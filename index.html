    { id:'m3-07', m:3, t:'mc', q:'“Suspender o juízo” significa:', o:['não considerar nada verdadeiro nem falso','considerar tudo falso','acreditar em tudo','confiar apenas na razão'], e:'Suspender o juízo é não afirmar nem negar: nada é tido como verdadeiro nem como falso.' },
    { id:'m3-08', m:3, t:'mc', q:'Pirro de Élis viveu:', o:['na Grécia Antiga, por volta de 360–270 a.C.','no século XVII, em França','no século XVIII, na Escócia','em Portugal, no século XVI'], e:'O manual diz c. 360–270 a.C. e a ficha c. 365–270 a.C.: o que importa é que viveu na Grécia Antiga, nos séculos IV–III a.C.' },
    { id:'m3-09', m:3, t:'mc', q:'O argumento cético da ilusão dos sentidos diz que:', o:['os sentidos enganam-nos, logo não podemos confiar neles','as pessoas discordam sobre tudo','há crenças autoevidentes','a razão é a fonte do conhecimento'], e:'Se os sentidos por vezes nos enganam, não podemos confiar neles para conhecer.' },
    { id:'m3-10', m:3, t:'mc', q:'O argumento cético da diversidade de opiniões diz que:', o:['as pessoas discordam sobre tudo e não há forma segura de saber quem tem razão','os sentidos enganam-nos','as crenças justificam-se noutras crenças','o conhecimento vem da experiência'], e:'A discordância constante mostraria que não há forma segura de saber quem tem razão.' },
    { id:'m3-11', m:3, t:'mc', q:'Qual destas perguntas também formula o problema da possibilidade do conhecimento?', o:['“Será que temos crenças justificadas?”','“Qual é a fonte do conhecimento?”','“O que é uma proposição?”','“O que é conhecer?”'], e:'Possibilidade: “Será possível conhecer alguma coisa?” ou “Será que temos crenças justificadas?”.' },
    { id:'m3-12', m:3, t:'mc', q:'A Ana diz: “Sou um pouco cética quanto a pratos com peixe cru.” Em sentido filosófico, ela:', o:['não é cética: só duvida no sentido comum','é cética radical','é cética moderada','é fundacionalista'], e:'No uso comum, “cético” é quem duvida. Isso não faz de alguém um cético filosófico.' },
    { id:'m3-13', m:3, t:'mc', q:'Para ser cético filosófico quanto ao sushi, alguém teria de acreditar que:', o:['não é de todo possível saber se o sushi é saboroso','o sushi não é saboroso','prefere outros pratos','o sushi faz mal'], e:'O cético filosófico põe em causa a possibilidade de saber, não apenas duvida.' },
    { id:'m3-14', m:3, t:'mc', q:'Quem defende que não podemos saber se Deus existe, mas aceita o conhecimento científico, é um cético:', o:['moderado','radical','fundacionalista','racionalista'], e:'Só põe em causa um domínio (a existência de Deus): ceticismo moderado.' },
    { id:'m3-15', m:3, t:'mc', q:'A objeção de que o ceticismo radical se autorrefuta diz que:', o:['ao afirmar que nada se pode conhecer, o cético afirma saber pelo menos uma coisa','os sentidos são fiáveis','há crenças básicas','a premissa 4 é falsa'], e:'Se o cético sabe que nada se sabe, então sabe alguma coisa: contradiz-se.' },
    { id:'m3-16', m:3, t:'mc', q:'Outra forma da objeção ao ceticismo: se nenhuma crença está justificada, então:', o:['as premissas do próprio cético também não estão justificadas','o cético tem razão','só a conclusão está justificada','os sentidos nunca enganam'], e:'O argumento cético mina-se a si mesmo: as suas premissas também ficam sem justificação.' },
    { id:'m3-17', m:3, t:'mc', q:'Qual é o principal argumento cético estudado?', o:['a regressão infinita da justificação','a definição tradicional','o fundacionalismo','o racionalismo'], e:'O principal argumento cético é o da regressão infinita da justificação (mundo 4).' },
    { id:'m3-18', m:3, t:'vf', q:'Duvidar que o sushi seja saboroso faz de alguém um cético em sentido filosófico.', a:false, e:'Isso é dúvida comum. O cético filosófico diz que não é de todo possível saber.' },
    { id:'m3-19', m:3, t:'vf', q:'Um cético moderado põe em causa todo o conhecimento.', a:false, e:'Quem põe em causa todo o conhecimento é o cético radical. O moderado limita-se a certos domínios.' },
    { id:'m3-20', m:3, t:'vf', q:'Pirro de Élis defendia que devemos suspender o juízo sobre tudo.', a:true, e:'Pirro: suspender o juízo sobre tudo para alcançar a tranquilidade.' },
    { id:'m3-21', m:3, t:'vf', q:'Em filosofia, o cético desafia a nossa pretensão de saber.', a:true, e:'É isso que define o cético filosófico: põe em causa a possibilidade do conhecimento.' },
    { id:'m3-22', m:3, t:'vf', q:'Para Pirro, suspender o juízo traz inquietação e sofrimento.', a:false, e:'Pelo contrário: traz paz de espírito e tranquilidade, para sermos felizes.' },
    { id:'m3-23', m:3, t:'vf', q:'O ceticismo radical pode ser acusado de se autorrefutar.', a:true, e:'Ao afirmar que nada se pode conhecer, afirma saber pelo menos uma coisa.' },
    { id:'m3-24', m:3, t:'completa', q:'Pirro defendia que devemos ___ o juízo sobre tudo.', o:['suspender','confiar','justificar','afirmar'], e:'Suspensão do juízo: não considerar nada verdadeiro nem falso.' },
    { id:'m3-25', m:3, t:'completa', q:'O ceticismo ___ limita-se a certos domínios, como a moralidade ou a existência de Deus.', o:['moderado','radical','fundacionalista','empirista'], e:'Moderado = só certos domínios.' },
    { id:'m3-26', m:3, t:'completa', q:'“Será possível conhecer alguma coisa?” é o problema da ___ do conhecimento.', o:['possibilidade','origem','definição','justificação'], e:'Problema da possibilidade do conhecimento.' },
    { id:'m3-27', m:3, t:'mc', destaque:true, q:'Quais destes são argumentos que os céticos radicais usam para negar a possibilidade do conhecimento?', o:['os enganos sensoriais (ilusão dos sentidos) e a regressão infinita da justificação','as crenças básicas e o fundacionalismo','o racionalismo e o empirismo','a definição tradicional e o caso da calculadora'], e:'São os dois argumentos do esquema do manual (p. 19). Os apontamentos juntam um terceiro: a diversidade de opiniões.' },
    { id:'m3-28', m:3, t:'mc', destaque:true, q:'Qual destes NÃO é um argumento cético?', o:['existência de crenças básicas autoevidentes','ilusão dos sentidos','diversidade de opiniões','regressão infinita da justificação'], e:'As crenças básicas autoevidentes são a resposta fundacionalista ao ceticismo, e não um argumento cético.' },
    { id:'m3-29', m:3, t:'mc', destaque:true, q:'Um pau parece partido dentro de água. Que argumento cético ilustra este exemplo?', o:['ilusão dos sentidos','diversidade de opiniões','regressão infinita da justificação','autorrefutação do ceticismo'], e:'Os sentidos às vezes enganam-nos, logo não podemos confiar neles como fonte de conhecimento.' },
    { id:'m3-30', m:3, t:'mc', destaque:true, q:'O que é o desafio cético?', o:['A posição que, na forma mais radical, considera que nenhum conhecimento é possível e que, por isso, devemos suspender o juízo sobre todas as coisas.','Duvidar de algumas coisas no dia a dia.','Defender que há crenças básicas autoevidentes.','Afirmar que o conhecimento vem da experiência.'], e:'Na forma radical: nenhum conhecimento é possível, logo devemos suspender o juízo sobre tudo.' },
    { id:'m3-31', m:3, t:'mc', destaque:true, q:'“As pessoas discordam sobre quase tudo e não há forma segura de decidir quem tem razão.” Este é o argumento:', o:['da diversidade de opiniões','da ilusão dos sentidos','da regressão infinita da justificação','fundacionalista'], e:'Se não há forma segura de decidir quem tem razão, não podemos dizer que sabemos.' },
    { id:'m3-32', m:3, t:'mc', destaque:true, q:'Segundo o argumento da regressão infinita, nenhuma crença fica justificada porque:', o:['cada crença precisa de outra para a justificar, sem fim','os sentidos enganam-nos','as pessoas discordam sobre tudo','as crenças básicas são autoevidentes'], e:'A cadeia de justificações nunca termina, logo nenhuma crença fica justificada e não há conhecimento.' },
    { id:'m3-33', m:3, t:'vf', destaque:true, q:'Os enganos sensoriais e a regressão infinita da justificação são argumentos céticos.', a:true, e:'São os argumentos do esquema do manual (p. 19); o principal é a regressão infinita.' },
    { id:'m3-34', m:3, t:'vf', destaque:true, q:'A existência de crenças básicas autoevidentes é um argumento cético.', a:false, e:'É a resposta do fundacionalismo contra o ceticismo.' },
    { id:'m3-35', m:3, t:'vf', destaque:true, q:'Segundo o desafio cético, na sua forma mais radical, devemos suspender o juízo sobre todas as coisas.', a:true, e:'Como nenhum conhecimento seria possível, o cético radical suspende o juízo sobre tudo.' },
    { id:'m3-36', m:3, t:'vf', destaque:true, q:'O exemplo do pau que parece partido dentro de água ilustra o argumento da diversidade de opiniões.', a:false, e:'Ilustra o argumento da ilusão dos sentidos.' },
    // Exercício 9 do manual (sai no teste) e treino extra
    { id:'m3-37', m:3, t:'vf', destaque:true, q:'O ceticismo radical é contraditório porque afirma saber que nada se pode saber.', a:true, e:'Ao apresentar a sua tese como verdadeira, o cético pretende saber pelo menos uma coisa: que nada se pode saber.' },
    { id:'m3-38', m:3, t:'vf', destaque:true, q:'Se a tese do cético radical fosse verdadeira, o próprio cético poderia conhecê-la.', a:false, e:'Se nada se pudesse conhecer, o cético também não poderia conhecer a sua tese. Por isso ela refuta-se a si mesma.' },
    { id:'m3-39', m:3, t:'vf', destaque:true, q:'Diz-se que o ceticismo radical é autorrefutante: refuta-se a si mesmo.', a:true, e:'A sua tese, se fosse verdadeira, não poderia ser conhecida, nem sequer pelo cético.' },
    { id:'m3-40', m:3, t:'mc', destaque:true, q:'Muitas pessoas pensam que o ceticismo radical é contraditório. Porquê?', o:['Porque, ao afirmar que nada se pode conhecer, apresenta essa tese como verdadeira: pretende saber pelo menos uma coisa.','Porque os sentidos às vezes nos enganam.','Porque só põe em causa alguns domínios do conhecimento.','Porque aceita que há crenças básicas autoevidentes.'], e:'O cético radical pretende saber que nada se pode saber. Se isso fosse verdade, nem ele o poderia saber: o ceticismo radical é autorrefutante.' },
    { id:'m3-41', m:3, t:'mc', destaque:true, q:'“Na religião não existe conhecimento, mas sim opiniões.” Para defender isto é preciso ser:', o:['apenas cético moderado, porque só põe em causa um domínio (a religião)','cético radical, porque põe em causa todo o conhecimento','fundacionalista','racionalista'], e:'Basta ser cético moderado: a dúvida limita-se ao domínio da religião.' },
    { id:'m3-42', m:3, t:'mc', destaque:true, q:'Quais são dois exemplos de enganos sensoriais?', o:['Um pau que parece partido dentro de água e uma miragem no deserto.','A diversidade de opiniões e a regressão infinita.','“2 + 2 = 4” e “Nenhum solteiro é casado”.','O sabor da manga e o cheiro do café.'], e:'Outro exemplo: a estrada parece molhada num dia de calor.' },
    { id:'m3-43', m:3, t:'vf', destaque:true, q:'A estrada parecer molhada num dia de calor é um exemplo de engano dos sentidos.', a:true, e:'Tal como a miragem no deserto ou o pau que parece partido dentro de água.' },
    { id:'m3-44', m:3, t:'vf', destaque:true, q:'Para defender que na religião não há conhecimento, só opiniões, é preciso ser cético radical.', a:false, e:'Basta ser cético moderado, porque só põe em causa o conhecimento num domínio.' },

    // Manual, pp. 15–19
    { id:'m3-45', m:3, t:'mc', q:'Diz-se que o ceticismo radical é global porque:', o:['duvida da possibilidade de todo e qualquer conhecimento','duvida só de algumas áreas','aceita todo o conhecimento','só fala do mundo'], e:'Radical = global. Moderado = regional ou localizado.' },
    { id:'m3-46', m:3, t:'mc', q:'O ceticismo moderado é:', o:['regional ou localizado: duvida do conhecimento em algumas áreas, mas não noutras','global: duvida de todo o conhecimento','o mesmo que o ceticismo pirrónico','uma forma de fundacionalismo'], e:'Ex.: duvidar que haja conhecimento na Ética e na Estética, mas não na Física e na Matemática.' },
    { id:'m3-47', m:3, t:'mc', q:'Qual é o exemplo do manual de um cético moderado?', o:['Duvidar que haja conhecimento na Ética e na Estética, mas não na Física e na Matemática.','Duvidar de todo o conhecimento.','Duvidar que o sushi seja saboroso.','Aceitar todas as opiniões.'], e:'O moderado só põe em causa certas áreas.' },
    { id:'m3-48', m:3, t:'vf', q:'Ao ceticismo radical também se chama ceticismo pirrónico.', a:true, e:'O nome vem de Pirro de Élis.' },
    { id:'m3-49', m:3, t:'vf', q:'Pirro escreveu vários livros a defender o ceticismo.', a:false, e:'Pirro não escreveu nenhum livro. As suas ideias foram apresentadas por outros céticos, como Sexto Empírico.' },
    { id:'m3-50', m:3, t:'mc', q:'Quem apresentou e desenvolveu as ideias de Pirro na obra «Hipóteses Pirrónicas»?', o:['Sexto Empírico','Francisco Sanches','Platão','Aristóteles'], e:'Sexto Empírico (c. 160–210 d.C.).' },
    { id:'m3-51', m:3, t:'mc', q:'Francisco Sanches, autor de «Que Nada se Sabe», foi:', o:['um filósofo cético, matemático e médico português','um filósofo fundacionalista grego','um empirista inglês','o autor da definição tradicional'], e:'Viveu c. 1551–1623.' },
    { id:'m3-52', m:3, t:'mc', q:'Segundo o manual, suspender o juízo é suspender a crença, ou seja:', o:['não acreditar nem deixar de acreditar na ideia em causa','acreditar em tudo','deixar de acreditar em tudo','acreditar só no que é útil'], e:'Não se afirma que a ideia é verdadeira nem que é falsa.' },
    { id:'m3-53', m:3, t:'mc', q:'Para o ceticismo radical, aquilo a que chamamos conhecimento:', o:['não passa de uma ilusão','é sempre verdadeiro','vem só da razão','é sempre conhecimento por contacto'], e:'Não existe realmente conhecimento (manual, p. 17).' },
    { id:'m3-54', m:3, t:'mc', q:'«Se as nossas crenças não estão justificadas, então não temos conhecimento. As nossas crenças não estão justificadas. Logo, não temos conhecimento.» Que premissa os céticos pirrónicos defenderam com vários argumentos?', o:['A segunda: «As nossas crenças não estão justificadas.»','A primeira: «Se as nossas crenças não estão justificadas, então não temos conhecimento.»','A conclusão.','Nenhuma.'], e:'A 1.ª premissa é plausível. A 2.ª é defendida com a regressão infinita e os enganos sensoriais.' },
    { id:'m3-55', m:3, t:'vf', q:'O argumento «Se as nossas crenças não estão justificadas, não temos conhecimento; não estão justificadas; logo, não temos conhecimento» é válido (é um modus ponens).', a:true, e:'É válido. A questão é se é sólido, isto é, se as premissas são verdadeiras.' },
    { id:'m3-56', m:3, t:'mc', q:'Um avião parece pequeno no céu, mas é enorme; com a mão fria, a água morna parece quente. Estes exemplos servem o argumento:', o:['dos enganos sensoriais','da regressão infinita','da diversidade de opiniões','fundacionalista'], e:'Argumento dos enganos sensoriais (ou da ilusão dos sentidos).' },
    { id:'m3-57', m:3, t:'mc', q:'Segundo o argumento dos enganos sensoriais, como os sentidos às vezes nos enganam:', o:['pode suceder que sejamos sempre enganados, e as justificações dos sentidos são inadequadas','os sentidos nunca nos enganam','basta usar dois sentidos','o conhecimento vem da razão'], e:'Isso compromete a justificação das nossas crenças (manual, p. 18).' },
    { id:'m3-58', m:3, t:'vf', q:'«Argumento dos enganos sensoriais» e «argumento da ilusão dos sentidos» são nomes para o mesmo argumento.', a:true, e:'O manual chama-lhe argumento dos enganos sensoriais.' },
    { id:'m3-59', m:3, t:'mc', q:'Segundo o manual, em que consiste o desafio cético?', o:['Mostrar que temos realmente conhecimento e não uma ilusão de conhecimento.','Mostrar que o sushi é saboroso.','Provar que Deus existe.','Decorar o argumento da regressão.'], e:'Como quase todos achamos que sabemos, o ceticismo desafia-nos a prová-lo (p. 18).' },
    { id:'m3-60', m:3, t:'vf', q:'Para pensar e dizer que o conhecimento não é possível, é preciso conhecer várias coisas, como o significado das palavras e algumas regras de gramática.', a:true, e:'É a segunda parte da objeção do manual: o ceticismo radical autorrefuta-se.' },
    { id:'m3-61', m:3, t:'mc', q:'Acreditamos que o mundo exterior e as outras pessoas são reais. Que problema levanta o manual?', o:['Como justificar essa crença; se não a justificarmos, não é conhecimento, mesmo que seja verdadeira.','Essa crença é falsa.','Essa crença é a priori.','Essa crença é conhecimento prático.'], e:'É assim que o manual apresenta o problema da possibilidade do conhecimento (p. 15).' },
    { id:'m3-62', m:3, t:'vf', q:'Uma crença verdadeira que não conseguimos justificar é conhecimento.', a:false, e:'Sem justificação não há conhecimento, mesmo que a crença seja verdadeira.' },
    { id:'m3-63', m:3, t:'mc', q:'Segundo o esquema do manual, o ceticismo radical tem como tese, argumentos e objeção:', o:['Tese: o conhecimento não é possível. Argumentos: enganos sensoriais e regressão infinita. Objeção: é contraditório.','Tese: há crenças básicas. Argumento: a priori. Objeção: é válido.','Tese: o conhecimento vem da razão. Argumento: a calculadora. Objeção: a Lua.','Tese: só há conhecimento prático. Argumento: a Alice. Objeção: o sushi.'], e:'Esquema da p. 19 do manual.' },
    /* ---------- Mundo 4 · Regressão infinita e fundacionalismo ---------- */
    { id:'m4-01', m:4, t:'mc', q:'O argumento da regressão infinita conclui que:', o:['não há conhecimento','há crenças básicas','os sentidos enganam','o conhecimento vem da razão'], e:'Conclusão: “Logo, não há conhecimento.”' },
    { id:'m4-02', m:4, t:'mc', q:'O argumento da regressão infinita é:', o:['válido','inválido','uma definição','uma crença básica'], e:'É válido: se as premissas forem verdadeiras, a conclusão também é.' },
    { id:'m4-03', m:4, t:'mc', q:'O fundacionalismo rejeita a:', o:['premissa 1','premissa 2','premissa 3','premissa 4'], e:'Rejeita a premissa 1: nem todas as crenças se justificam com base noutras.' },
    { id:'m4-04', m:4, t:'mc', q:'As crenças básicas são:', o:['autoevidentes','inferidas de outras crenças','sempre falsas','opiniões pessoais'], e:'Crenças básicas: autoevidentes, justificam-se a si mesmas.' },
    { id:'m4-05', m:4, t:'mc', q:'A premissa 1 do argumento diz que:', o:['as nossas crenças justificam-se com base noutras crenças','não há conhecimento','nunca temos crenças justificadas','há crenças básicas'], e:'P1: “As nossas crenças justificam-se com base noutras crenças.”' },
    { id:'m4-06', m:4, t:'mc', q:'Quem não aceita a conclusão de um argumento válido tem de:', o:['rejeitar pelo menos uma premissa','aceitar a conclusão na mesma','rejeitar todas as premissas','ignorar o argumento'], e:'Num argumento válido, premissas verdadeiras garantem a conclusão. Para a recusar, é preciso rejeitar uma premissa.' },
    { id:'m4-07', m:4, t:'mc', q:'Um argumento é válido quando:', o:['se as premissas forem verdadeiras, a conclusão também é','as premissas são verdadeiras','a conclusão é verdadeira','toda a gente concorda com ele'], e:'Validade: é impossível as premissas serem verdadeiras e a conclusão falsa.' },
    { id:'m4-08', m:4, t:'mc', q:'A premissa 4 (“Se nunca temos crenças justificadas, não há conhecimento”) liga-se à definição tradicional porque:', o:['sem justificação não há conhecimento','o conhecimento é só crença','a verdade não importa','as crenças básicas não existem'], e:'A justificação é condição necessária do conhecimento.' },
    { id:'m4-09', m:4, t:'mc', q:'A criança na idade dos “porquês” ilustra que:', o:['podemos sempre pedir justificação para cada crença','as crianças sabem tudo','a sopa faz bem','há crenças autoevidentes'], e:'A cada resposta podemos perguntar “porquê?”, e a cadeia de justificações não acaba.' },
    { id:'m4-10', m:4, t:'mc', q:'Responder “Porque sim!” a um “porquê?”:', o:['não justifica nada, só mostra que a pessoa desistiu','é uma crença básica','é uma justificação a priori','acaba com o ceticismo'], e:'“Porque sim” não é justificação.' },
    { id:'m4-11', m:4, t:'mc', q:'As crenças não-básicas:', o:['são inferidas a partir de outras crenças','são autoevidentes','justificam-se a si mesmas','são sempre falsas'], e:'Não-básicas: não são autoevidentes; apoiam-se noutras crenças.' },
    { id:'m4-12', m:4, t:'mc', q:'Na metáfora do edifício, as crenças básicas correspondem:', o:['às fundações (alicerces)','ao telhado','às janelas','aos andares de cima'], e:'As fundações sustentam o edifício sem serem sustentadas por ele.' },
    { id:'m4-13', m:4, t:'mc', q:'Para o fundacionalismo, a cadeia de justificação:', o:['termina nas crenças básicas','é infinita','não tem começo','depende da opinião de cada um'], e:'Termina nas crenças básicas, logo não há regressão infinita.' },
    { id:'m4-14', m:4, t:'mc', q:'Das premissas 1 a 4, quais são falsas para o fundacionalismo?', o:['apenas a 1','a 1 e a 2','todas','apenas a 4'], e:'Exercício do manual: para o fundacionalismo apenas a premissa 1 é falsa.' },
    { id:'m4-15', m:4, t:'mc', q:'Segundo o cético, porque é que a justificação forma uma cadeia sem fim?', o:['cada justificação é outra crença, que também precisa de justificação','porque os sentidos enganam','porque as pessoas discordam','porque a razão é infalível'], e:'Cada crença que justifica precisa, por sua vez, de ser justificada.' },
    { id:'m4-16', m:4, t:'vf', q:'Se o argumento cético é válido e não aceitamos a conclusão, temos de rejeitar pelo menos uma premissa.', a:true, e:'É o que significa ser válido.' },
    { id:'m4-17', m:4, t:'vf', q:'Para o fundacionalismo, as premissas 2, 3 e 4 podem ser aceites.', a:true, e:'O fundacionalismo só rejeita a premissa 1.' },
    { id:'m4-18', m:4, t:'vf', q:'As crenças não-básicas justificam-se com base noutras crenças.', a:true, e:'São inferidas a partir de outras crenças.' },
    { id:'m4-19', m:4, t:'vf', q:'O fundacionalismo rejeita a premissa 4.', a:false, e:'Rejeita a premissa 1. A 4 até se liga à definição tradicional.' },
    { id:'m4-20', m:4, t:'vf', q:'As crenças básicas precisam de outras crenças para estarem justificadas.', a:false, e:'São autoevidentes: justificam-se a si mesmas.' },
    { id:'m4-21', m:4, t:'vf', q:'O argumento cético da regressão infinita é inválido.', a:false, e:'É válido. Por isso, quem recusa a conclusão tem de rejeitar uma premissa.' },
    { id:'m4-22', m:4, t:'completa', q:'O fundacionalismo rejeita a premissa ___.', o:['1','2','3','4'], e:'Premissa 1: nem todas as crenças se justificam com base noutras.' },
    { id:'m4-23', m:4, t:'completa', q:'As crenças básicas são ___: justificam-se a si mesmas.', o:['autoevidentes','inferidas','falsas','duvidosas'], e:'Crenças básicas = autoevidentes.' },
    { id:'m4-25', m:4, t:'mc', destaque:true, q:'“A justificação da crença A é a crença B, a de B é a crença C, e assim sucessivamente.” Que dificuldade levanta esta situação?', o:['A regressão infinita da justificação: a cadeia nunca termina, logo nenhuma crença fica justificada e não há conhecimento.','A ilusão dos sentidos.','A diversidade de opiniões.','A autorrefutação do ceticismo.'], e:'Sem justificação não há conhecimento, porque a justificação é condição necessária.' },
    { id:'m4-24', m:4, t:'completa', q:'A conclusão do argumento da regressão infinita é: “Logo, não há ___.”', o:['conhecimento','crenças','premissas','experiência'], e:'Conclusão: “Logo, não há conhecimento.”' },

    { id:'m4-26', m:4, t:'mc', q:'Segundo Sexto Empírico, qual é a consequência da regressão infinita da justificação?', o:['A suspensão do juízo, porque não temos um ponto de partida para o raciocínio.','Que há crenças básicas.','Que os sentidos enganam.','Que o conhecimento vem da razão.'], e:'Cada demonstração precisa de ser demonstrada, até ao infinito (manual, p. 17).' },
    { id:'m4-27', m:4, t:'mc', q:'Para os fundacionalistas, o que distingue as crenças básicas das não-básicas?', o:['As básicas são autoevidentes e justificam-se a si mesmas; as não-básicas são inferidas de outras crenças.','As básicas são falsas e as não-básicas verdadeiras.','As básicas vêm dos livros e as não-básicas da escola.','Não há diferença.'], e:'É a pergunta 2 da revisão da ficha (p. 18).' },
    /* ---------- Mundo 5 · Origem do conhecimento (sai no teste) ---------- */
    { id:'m5-01', m:5, t:'mc', q:'“O conhecimento provém da razão ou da experiência?” formula o problema da:', o:['origem','definição','possibilidade','justificação moral'], e:'Problema da origem: qual é a fonte do conhecimento?' },
    { id:'m5-02', m:5, t:'mc', q:'Qual das frases identifica corretamente o problema da origem do conhecimento?', o:['Saber qual é a fonte do conhecimento: a razão, independentemente da experiência, ou a experiência sensível.','Saber se é possível conhecer alguma coisa.','Saber o que é conhecer.','Saber se temos crenças justificadas.'], e:'Resposta-modelo: o problema da origem consiste em saber qual é a fonte do nosso conhecimento.' },
    { id:'m5-03', m:5, t:'mc', q:'Para os racionalistas, as crenças básicas vêm:', o:['da razão','da experiência','da autoridade','de outras crenças'], e:'Racionalismo: a principal fonte é a razão; as crenças básicas são conhecidas a priori.' },
    { id:'m5-04', m:5, t:'mc', q:'Para os empiristas, as crenças básicas vêm:', o:['da experiência sensível','da razão','de Deus','de outras crenças'], e:'Empirismo: a principal fonte é a experiência; as crenças básicas são a posteriori.' },
    { id:'m5-05', m:5, t:'mc', q:'É conhecida a priori:', o:['Nenhum irmão é filho único.','O céu é azul.','Alguns irmãos são competitivos.','A água é H2O.'], e:'Um irmão filho único é contraditório: sabe-se só pelo pensamento.' },
    { id:'m5-06', m:5, t:'mc', q:'“A forma do planeta Terra é aproximadamente esférica” é conhecida:', o:['a posteriori','a priori','por contacto','como crença básica racional'], e:'Foi preciso observar a Terra. Só a definição de esfera é a priori.' },
    { id:'m5-07', m:5, t:'mc', q:'A matemática e a lógica são áreas de conhecimento:', o:['a priori','a posteriori','prático','por contacto'], e:'A priori: matemática, lógica, geometria.' },
    { id:'m5-08', m:5, t:'mc', q:'A palavra “empirismo” vem do grego “empeiria”, que significa:', o:['experiência','razão','conhecimento','dúvida'], e:'Empeiria = experiência.' },
    { id:'m5-09', m:5, t:'mc', q:'O conhecimento a priori é aquele que:', o:['pode ser conhecido independentemente da experiência, só pelo pensamento','só pode ser conhecido pela experiência','é conhecido por contacto','é sempre sobre o mundo físico'], e:'A priori: independente da experiência.' },
    { id:'m5-10', m:5, t:'mc', q:'O conhecimento a posteriori é aquele que:', o:['só pode ser conhecido através da experiência','pode ser conhecido só pelo pensamento','é sempre falso','não precisa de justificação'], e:'A posteriori: é preciso olhar para o mundo.' },
    { id:'m5-11', m:5, t:'mc', q:'Física, química, biologia, história e geografia são áreas de conhecimento:', o:['a posteriori','a priori','prático','por contacto'], e:'Todas dependem da observação do mundo.' },
    { id:'m5-12', m:5, t:'mc', q:'O Rui sabe que 2 + 2 = 4 porque viu numa calculadora. Esse conhecimento é:', o:['a priori, porque podia saber-se só pelo pensamento','a posteriori, porque usou a calculadora','prático','por contacto'], e:'Armadilha: o que conta é se PODIA saber-se só pelo pensamento.' },
    { id:'m5-13', m:5, t:'mc', q:'Para saber que “Nenhum solteiro é casado”, a experiência é precisa para:', o:['aprender os conceitos, mas não para saber que a frase é verdadeira','observar todos os solteiros','perguntar a cada solteiro','nada: nem para aprender os conceitos'], e:'Precisamos de experiência para aprender o que é “solteiro”, mas não para saber que a frase é verdadeira.' },
    { id:'m5-14', m:5, t:'mc', q:'“Pode haver conhecimento a priori com informação sobre o mundo?” Os racionalistas respondem:', o:['sim','não','só na história','só por contacto'], e:'Racionalistas: sim. Empiristas: não.' },
    { id:'m5-15', m:5, t:'mc', q:'Para os empiristas, o conhecimento a priori:', o:['só diz respeito a relações entre ideias e não informa sobre o mundo','é a principal fonte de conhecimento','é impossível em matemática','vem dos sentidos'], e:'Empiristas: o a priori não nos diz como é o mundo.' },
    { id:'m5-16', m:5, t:'mc', q:'Que relação há entre o fundacionalismo e o problema da origem?', o:['O fundacionalismo diz que há crenças básicas; o problema da origem pergunta de onde vêm','Nenhuma','O problema da origem prova que não há crenças básicas','O fundacionalismo é uma forma de ceticismo'], e:'Há fundacionalistas racionalistas e fundacionalistas empiristas.' },
    { id:'m5-17', m:5, t:'mc', q:'Truque: se o contrário de uma frase pudesse ser verdade sem contradição, a frase é conhecida:', o:['a posteriori','a priori','por contacto','como crença básica'], e:'Os ursos polares podiam ser castanhos sem contradição → a posteriori.' },
    { id:'m5-18', m:5, t:'vf', q:'Saber 2 + 2 = 4 através de uma calculadora torna esse conhecimento a posteriori.', a:false, e:'Continua a ser a priori, porque podia saber-se só pelo pensamento.' },
    { id:'m5-19', m:5, t:'vf', q:'Há fundacionalistas racionalistas e fundacionalistas empiristas.', a:true, e:'Discordam sobre de onde vêm as crenças básicas: da razão ou da experiência.' },
    { id:'m5-20', m:5, t:'vf', q:'“Os solteiros não são casados” diz-nos se existe algum solteiro.', a:false, e:'É a priori, mas não informa se há solteiros no mundo.' },
    { id:'m5-21', m:5, t:'vf', q:'A definição de esfera é a priori, mas “A Terra é aproximadamente esférica” é a posteriori.', a:true, e:'Saber a forma da Terra exige observação.' },
    { id:'m5-22', m:5, t:'vf', q:'Para os empiristas, as crenças básicas são conhecidas a priori.', a:false, e:'Para os empiristas são a posteriori (vêm da experiência). Para os racionalistas são a priori.' },
    { id:'m5-23', m:5, t:'completa', q:'O problema da origem pergunta se o conhecimento provém da razão ou da ___.', o:['experiência','autoridade','fé','tradição'], e:'Razão ou experiência: é esta a pergunta do problema da origem.' },
    { id:'m5-24', m:5, t:'completa', q:'Para os racionalistas, as crenças básicas são conhecidas ___.', o:['a priori','a posteriori','por contacto','por palpite'], e:'Racionalismo → a priori.' },
    { id:'m5-25', m:5, t:'completa', q:'A matemática, a lógica e a geometria são áreas de conhecimento ___.', o:['a priori','a posteriori','prático','por contacto'], e:'Sabem-se só pelo pensamento.' },
    { id:'m5-26', m:5, t:'mc', destaque:true, q:'“A Maria tem o cabelo castanho” é conhecida:', o:['a posteriori: só se sabe olhando para ela','a priori: basta compreender os conceitos','a priori: é uma verdade da lógica','por contacto, e por isso a priori'], e:'O contrário podia ser verdade sem contradição: a Maria podia ser loura.' },
    { id:'m5-27', m:5, t:'mc', destaque:true, q:'“As esferas não têm arestas” é conhecida:', o:['a priori: basta compreender o conceito de esfera','a posteriori: é preciso observar esferas','a posteriori: é uma verdade da física','por contacto'], e:'Uma esfera com arestas seria contraditória.' },
    { id:'m5-28', m:5, t:'vf', destaque:true, q:'“A Maria tem o cabelo castanho” é conhecida a priori.', a:false, e:'É a posteriori: só se sabe olhando para ela.' },
    { id:'m5-29', m:5, t:'vf', destaque:true, q:'“As esferas não têm arestas” é conhecida a priori.', a:true, e:'Basta compreender o conceito de esfera.' },
    // Manual, p. 14
    { id:'m5-30', m:5, t:'mc', q:'«A posteriori» significa:', o:['posterior à experiência','anterior à experiência','independente da razão','sem justificação'], e:'Só pode ser adquirido através da experiência.' },
    { id:'m5-31', m:5, t:'mc', q:'«A priori» significa:', o:['anterior à experiência','posterior à experiência','através dos sentidos','por contacto'], e:'Pode ser adquirido pensando, sem recorrer à experiência.' },
    { id:'m5-32', m:5, t:'mc', q:'O conhecimento a posteriori também se chama:', o:['conhecimento empírico','conhecimento racional','conhecimento prático','conhecimento por contacto'], e:'De «empeiría», palavra grega para experiência.' },
    { id:'m5-33', m:5, t:'mc', q:'Qual destas proposições é conhecida a priori?', o:['Tudo o que é verde é colorido.','As baleias são mamíferos.','A Suíça é um país europeu.','As avestruzes não voam.'], e:'Basta pensar nos conceitos de verde e de colorido.' },
    { id:'m5-34', m:5, t:'mc', q:'Qual destas proposições é conhecida a posteriori?', o:['A segunda maior cidade portuguesa é o Porto.','O todo é maior do que a parte.','Duas coisas iguais a uma terceira são iguais entre si.','723 + 168 = 891'], e:'É preciso observar o mundo para o saber.' },
    { id:'m5-35', m:5, t:'mc', q:'Segundo o manual, o conhecimento proposicional pode adquirir-se de duas maneiras:', o:['pelo pensamento (a priori) e pela experiência (a posteriori)','pela razão e pela fé','pelos livros e pela escola','pela crença e pela dúvida'], e:'As duas modalidades de conhecimento proposicional (p. 14).' },
    { id:'m5-36', m:5, t:'vf', q:'Para saber que o dobro de 30 é metade de 120 é preciso usar a máquina de calcular.', a:false, e:'Basta pensar um pouco e fazer a conta mentalmente: é a priori.' },
    { id:'m5-37', m:5, t:'vf', q:'Saber algo a priori é apenas recordar experiências feitas na infância.', a:false, e:'Posso nunca ter somado 99 + 98 e saber a priori que dá 197.' },
    { id:'m5-38', m:5, t:'vf', q:'O conhecimento a priori pode ser obtido pelo pensamento, mas a experiência também permite essa aquisição.', a:true, e:'Ex.: ver um resultado na calculadora. Continua a ser a priori, porque podia saber-se só a pensar.' },
    { id:'m5-39', m:5, t:'vf', q:'«Em Portugal o ensino secundário termina no 12.º ano» é conhecido a priori.', a:false, e:'É a posteriori: é preciso informação sobre o mundo.' }
  ],

  cartoes: [
    { id:'c01', m:3, aberta:true, frente:'Formula o problema da possibilidade do conhecimento.', verso:'O problema da possibilidade do conhecimento consiste em saber se é possível conhecermos alguma coisa, isto é, se temos crenças justificadas. Formula-se assim: “Será possível conhecer alguma coisa?” ou “Será que temos crenças justificadas?”', exemplo:'O cético radical responde que não: nenhum conhecimento é possível.' },
    { id:'c02', m:5, aberta:true, frente:'Identifica o problema da origem do conhecimento.', verso:'O problema da origem do conhecimento consiste em saber qual é a fonte do nosso conhecimento: se é a razão, independentemente da experiência, ou a experiência sensível.', exemplo:'Racionalistas: a fonte principal é a razão. Empiristas: é a experiência.' },
    { id:'c03', m:3, aberta:true, frente:'Distingue ceticismo radical de ceticismo moderado, com um exemplo.', verso:'O ceticismo radical põe em causa toda e qualquer espécie de conhecimento. O ceticismo moderado limita-se a certos tipos ou domínios de conhecimento.', exemplo:'Radical: Pirro de Élis, que defende suspender o juízo sobre tudo. Moderado: quem diz que não podemos saber se Deus existe, mas aceita a ciência.' },
    { id:'c04', m:4, aberta:true, frente:'Apresenta o argumento cético da regressão infinita.', verso:'1. As nossas crenças justificam-se com base noutras crenças.\n2. Se as nossas crenças se justificam com base noutras crenças, então sempre que tentamos justificar uma crença caímos numa regressão infinita da justificação.\n3. Se sempre que tentamos justificar uma crença caímos numa regressão infinita, então nunca temos crenças justificadas.\n4. Se nunca temos crenças justificadas, não há conhecimento.\n5. Logo, não há conhecimento.', exemplo:'Como a criança dos “porquês”: cada justificação precisa de outra justificação, sem fim.' },
    { id:'c05', m:4, aberta:true, frente:'Explica como o fundacionalismo responde ao ceticismo.', verso:'O argumento cético é válido, por isso, para recusar a conclusão, é preciso rejeitar uma premissa. O fundacionalismo rejeita a premissa 1: nem todas as crenças se justificam com base noutras. Há crenças básicas, autoevidentes, que se justificam a si mesmas. A cadeia de justificação termina nelas, logo não há regressão infinita.', exemplo:'Tal como as fundações sustentam um edifício sem serem sustentadas por ele.' },
    { id:'c06', m:4, aberta:true, frente:'Distingue crenças básicas de crenças não-básicas.', verso:'Crenças básicas (fundacionais): são autoevidentes, justificam-se a si mesmas e não precisam de outras crenças. Crenças não-básicas: não são autoevidentes e são inferidas a partir de outras crenças.', exemplo:'Básicas = alicerces do edifício; não-básicas = os andares construídos por cima.' },
    { id:'c07', m:3, aberta:true, frente:'Apresenta uma objeção ao ceticismo.', verso:'O ceticismo radical autorrefuta-se: ao afirmar que nada se pode conhecer, o cético afirma saber pelo menos uma coisa. Além disso, se nenhuma crença está justificada, as premissas do argumento cético também não estão.', exemplo:'“Sei que nada se sabe” contradiz-se a si mesma.' },
    { id:'c08', m:5, aberta:true, frente:'Distingue conhecimento a priori de a posteriori, com exemplos.', verso:'A priori: pode ser conhecido independentemente da experiência, só pelo pensamento (matemática, lógica, geometria). A posteriori: só pode ser conhecido através da experiência, olhando para o mundo (física, química, biologia, história, geografia).', exemplo:'A priori: “Nenhum solteiro é casado”. A posteriori: “Os ursos polares são brancos”.' },
    { id:'c09', m:1, aberta:false, frente:'Epistemologia', verso:'Área da filosofia que estuda o conhecimento (teoria do conhecimento). Do grego epistéme (conhecimento) + logos (estudo).', exemplo:'Problemas: definição, possibilidade e origem do conhecimento.' },
    { id:'c10', m:1, aberta:false, frente:'Os três problemas da epistemologia', verso:'Definição: “O que é conhecer?”\nPossibilidade: “Será possível conhecer alguma coisa?”\nOrigem: “O conhecimento provém da razão ou da experiência?”', exemplo:'Saem no teste: possibilidade e origem.' },
    { id:'c11', m:1, aberta:false, frente:'Definição tradicional de conhecimento', verso:'Crença verdadeira justificada (Platão, Teeteto). S sabe que P se e só se: S acredita que P; P é verdadeira; S tem justificação para acreditar que P.', exemplo:'O João acerta na chuva por palpite: crença verdadeira, não justificada → não sabe.' },
    { id:'c12', m:1, aberta:false, frente:'Condição necessária vs. suficiente', verso:'Necessária: sem ela não há conhecimento.\nSuficiente: se estiver presente, há conhecimento.', exemplo:'Na definição tradicional, cada condição é necessária e as três juntas seriam suficientes.' },
    { id:'c13', m:2, aberta:false, frente:'Conhecimento proposicional', verso:'Saber-que: saber que uma proposição é verdadeira. Também se chama conhecimento factual. É o que a epistemologia mais estuda.', exemplo:'“Sei que Lisboa é a capital de Portugal.”' },
    { id:'c14', m:2, aberta:false, frente:'Conhecimento prático', verso:'Saber-fazer: ter uma competência.', exemplo:'“Sei andar de bicicleta”, “Sei nadar”, “Sei tocar guitarra”.' },
    { id:'c15', m:2, aberta:false, frente:'Conhecimento por contacto', verso:'Familiaridade: conhecer diretamente pessoas, lugares ou coisas.', exemplo:'“Conheço o Porto”, “Conheço a Maria”, “Conheço o sabor da manga”.' },
    { id:'c16', m:2, aberta:false, frente:'Proposição', verso:'Pensamento expresso por uma frase declarativa, que pode ser verdadeiro ou falso. Atenção: escreve-se “proposicional”, não “proporcional”.', exemplo:'“O céu é azul” exprime uma proposição; “Fecha a porta!” não.' },
    { id:'c17', m:3, aberta:false, frente:'Cético no uso comum vs. em filosofia', verso:'No uso comum, cético é quem duvida. Em filosofia, o cético põe em causa a possibilidade do conhecimento.', exemplo:'Para ser cético quanto ao sushi, teria de acreditar que não é de todo possível saber se o sushi é saboroso.' },
    { id:'c18', m:3, aberta:false, frente:'Pirro de Élis', verso:'Grécia Antiga, c. 360–270 a.C. (a ficha diz c. 365). O mais antigo e radical cético. Como nunca podemos saber como as coisas realmente são, devemos suspender o juízo sobre tudo.', exemplo:'Assim libertamo-nos dos desejos e alcançamos a paz de espírito, para sermos felizes.' },
    { id:'c19', m:3, aberta:false, frente:'Argumentos céticos', verso:'Ilusão dos sentidos: os sentidos enganam-nos, logo não podemos confiar neles.\nDiversidade de opiniões: as pessoas discordam sobre tudo; não há forma segura de saber quem tem razão.\nRegressão infinita da justificação: o principal.', exemplo:'Um pau dentro de água parece torto: ilusão dos sentidos.' },
    { id:'c20', m:4, aberta:false, frente:'Validade do argumento da regressão', verso:'O argumento é válido: se as premissas forem verdadeiras, a conclusão também é. Quem não aceita a conclusão tem de rejeitar pelo menos uma premissa.', exemplo:'A premissa 4 liga-se à definição tradicional: sem justificação não há conhecimento.' },
    { id:'c21', m:5, aberta:false, frente:'Racionalismo', verso:'A principal fonte do conhecimento é a razão. As crenças básicas são conhecidas a priori. É possível conhecimento a priori sobre o mundo.', exemplo:'Debate: pode haver conhecimento a priori com informação sobre o mundo? Racionalistas: sim.' },
    { id:'c22', m:5, aberta:false, frente:'Empirismo', verso:'A principal fonte do conhecimento é a experiência sensível (do grego empeiria). As crenças básicas são conhecidas a posteriori. O a priori só diz respeito a relações entre ideias.', exemplo:'Debate: pode haver conhecimento a priori com informação sobre o mundo? Empiristas: não.' },
    { id:'c23', m:5, aberta:false, frente:'Truque para a priori / a posteriori', verso:'Pergunta: “O contrário podia ser verdade sem contradição?”\nSe sim → a posteriori. Se não → a priori.', exemplo:'Os ursos podiam ser castanhos → a posteriori. Um solteiro casado é contraditório → a priori.' },
    { id:'c24', m:5, aberta:false, frente:'Armadilhas do a priori', verso:'Saber 2 + 2 = 4 numa calculadora continua a ser a priori, porque podia saber-se só pelo pensamento. Precisamos de experiência para aprender os conceitos, mas não para saber que a frase é verdadeira.', exemplo:'A definição de esfera é a priori; “A Terra é aproximadamente esférica” é a posteriori.' },
    { id:'c25', m:1, aberta:true, frente:'A Manuela pergunta quanto dá 356 euros a dividir por 4. O Eurico usa a calculadora e diz que ela “sabe” que dá 89 euros. A calculadora sabe?', verso:'Não. Segundo a definição tradicional, saber implica ter uma crença, que é um estado mental. A calculadora não tem estados mentais nem crenças; dá o resultado certo apenas porque foi programada. Logo, não tem conhecimento.', exemplo:'A resposta é verdadeira, mas falta a condição da crença.' },
    { id:'c26', m:3, aberta:true, frente:'O que é o desafio cético?', verso:'É a posição que, na forma mais radical, considera que nenhum conhecimento é possível e que, por isso, devemos suspender o juízo sobre todas as coisas.', exemplo:'Pirro de Élis: suspender o juízo sobre tudo para alcançar a tranquilidade.' },
    { id:'c27', m:3, aberta:true, frente:'Apresenta os argumentos dos céticos radicais.', verso:'1. Enganos sensoriais (ilusão dos sentidos): os sentidos às vezes enganam-nos, logo não podemos confiar neles como fonte de conhecimento.\n2. Diversidade de opiniões (dos apontamentos; não está no esquema do manual): as pessoas discordam sobre quase tudo e não há forma segura de decidir quem tem razão.\n3. Regressão infinita da justificação: cada crença precisa de outra para a justificar, sem fim, logo nenhuma crença fica justificada e não há conhecimento.', exemplo:'Um pau parece partido dentro de água: ilusão dos sentidos.' },
    { id:'c28', m:1, aberta:false, frente:'Relação entre crença e conhecimento', verso:'Todo o conhecimento é uma crença, mas nem todas as crenças são conhecimento.', exemplo:'“Acredito em extraterrestres” é uma crença, mas não é saber que existem.' },
    { id:'c29', m:1, aberta:true, frente:'Explica porque é que cada condição da definição tradicional é necessária, mas nenhuma é suficiente sozinha.', verso:'Crença: é contraditório dizer “sei que o mar tem ondas, mas não acredito nisso”. Mas a crença não basta: “acredito em extraterrestres” não é saber que existem.\nVerdade: só se sabe o que é verdadeiro (o conhecimento é factivo).\nJustificação: não basta, porque podemos ter boas razões para acreditar em algo falso.\nCrença verdadeira: não basta, porque pode ser verdadeira por acaso (um palpite); o conhecimento tem de estar apoiado em boas razões.', exemplo:'Na Antiguidade havia razões para acreditar que a Terra era plana, e não é.' },
    { id:'c30', m:3, aberta:true, frente:'Muitas pessoas pensam que o ceticismo radical é contraditório. Porquê? (Exercício 9, sai no teste)', verso:'O cético radical defende que não é possível conhecer nada. Mas, ao afirmar isso, está a apresentar a sua tese como verdadeira, ou seja, pretende saber pelo menos uma coisa: que nada se pode saber. Se a tese fosse verdadeira, o próprio cético não a poderia conhecer. Por isso, o ceticismo radical refuta-se a si mesmo (é autorrefutante).', exemplo:'“Sei que nada se pode saber” contradiz-se.' },
    { id:'c31', m:2, aberta:true, frente:'Indica o tipo de conhecimento atribuído ao sujeito (Exercício 1, sai no teste):\nA. A Julieta sabe preparar batidos de frutas.\nB. Conhece de trás para a frente o sítio onde o Mondego nasce.\nC. Sabe qual é a diferença entre um romance e uma novela.\nD. Consegue fingir na perfeição que está a dormir.\nE. O filho dela já sabe comer de faca e garfo.\nF. Sabe o que é um neutrino.\nG. Conhece o primeiro namorado da sua mãe.', verso:'A. Prático (saber-fazer)\nB. Por contacto (conhece diretamente um lugar)\nC. Proposicional (sabe que…)\nD. Prático\nE. Prático\nF. Proposicional\nG. Por contacto (conhece diretamente uma pessoa)', exemplo:'Atenção: “sabe” nem sempre é proposicional. “Sabe preparar” e “sabe comer” são saber-fazer. “Conhece” uma pessoa ou um lugar é por contacto.' },
    { id:'c32', m:1, aberta:true, frente:'Tem ou não conhecimento?\nA. A Luísa acredita, por estudos científicos que leu, que o albinismo tem causa genética.\nB. A Teresa acredita que a Terra é maior do que a Lua porque ouviu dizer que o tamanho dos nomes exprime o tamanho das coisas.\nC. O Carlos leu numa revista médica que o álcool em excesso provoca cirroses, mas pensou que era falso.', verso:'A. Tem conhecimento: crença, verdadeira e justificada.\nB. Não tem: a crença é verdadeira, mas mal justificada.\nC. Não tem: falta a crença.', exemplo:'Verifica sempre as três condições: crença, verdade e justificação.' },
    { id:'c33', m:3, aberta:true, frente:'“Na religião não existe conhecimento, mas sim opiniões.” É preciso ser cético radical para defender isto?', verso:'Não. Basta ser cético moderado, porque só se põe em causa o conhecimento num domínio (a religião), e não todo o conhecimento.', exemplo:'Radical seria dizer que nenhum conhecimento é possível, em domínio nenhum.' },
    { id:'c34', m:4, aberta:true, frente:'“A justificação da crença A é a crença B, a de B é a crença C, e assim sucessivamente.” Que dificuldade levanta esta situação?', verso:'Levanta o problema da regressão infinita da justificação: a cadeia de justificações nunca termina, logo nenhuma crença fica justificada. E, como a justificação é condição necessária do conhecimento, não há conhecimento.', exemplo:'O fundacionalismo responde que a cadeia termina em crenças básicas, autoevidentes.' },
    { id:'c35', m:3, aberta:true, frente:'Dá dois exemplos de enganos sensoriais.', verso:'Um pau parece partido dentro de água; uma miragem no deserto; a estrada parece molhada num dia de calor.', exemplo:'São usados pelo argumento cético da ilusão dos sentidos.' },
    { id:'c36', m:5, aberta:false, frente:'“A Maria tem o cabelo castanho” e “As esferas não têm arestas”: a priori ou a posteriori?', verso:'“A Maria tem o cabelo castanho” é a posteriori: só se sabe olhando para ela.\n“As esferas não têm arestas” é a priori: basta compreender o conceito de esfera.', exemplo:'Truque: o contrário podia ser verdade sem contradição? A Maria podia ser loura (a posteriori); uma esfera com arestas é contraditória (a priori).' },
    { id:'c37', m:1, aberta:false, frente:'O que é o conhecimento? (sujeito e objeto)', verso:'Em todos os casos de conhecimento há um sujeito (quem conhece) e um objeto (aquilo que é conhecido). O conhecimento é uma relação entre um sujeito e um objeto. No autoconhecimento, o sujeito e o objeto coincidem.', exemplo:'Na frase «A Alice conhece o Museu», a Alice é o sujeito e o Museu é o objeto.' },
    { id:'c38', m:2, aberta:true, frente:'Distingue os três tipos de conhecimento, indicando o objeto de cada um.', verso:'Prático (saber-fazer): o objeto é uma aptidão ou capacidade; o sujeito sabe realizar uma ação.\nPor contacto: o sujeito conhece diretamente algo pelos sentidos externos; o objeto são lugares, pessoas, animais, objetos físicos.\nProposicional (saber-que): o objeto são proposições verdadeiras; é conhecer ideias.', exemplo:'Saber fritar ovos (prático); conhecer o Castelo dos Mouros (por contacto); saber o que é uma alucinação (proposicional).' },
    { id:'c39', m:1, aberta:true, frente:'Explica porque é que a crença, a verdade e a justificação são condições necessárias do conhecimento.', verso:'Crença: dizer «conheço P, mas não acredito em P» é contraditório.\nVerdade: uma crença falsa não é conhecimento; não podemos saber que os pardais falam, porque não falam.\nJustificação: uma crença verdadeira por sorte, como um palpite certeiro, não é conhecimento; são precisas boas razões que liguem a crença à verdade.\nBasta faltar uma para não haver conhecimento; as três juntas são suficientes.', exemplo:'Os autores do manual sabem que os Países Baixos são uma monarquia: acreditam, é verdade e têm boas razões.' },
    { id:'c40', m:3, aberta:true, frente:'Em que consiste o ceticismo? (revisão da ficha)', verso:'O ceticismo é a perspetiva filosófica que responde «não» à pergunta «Será o conhecimento possível?»: põe em causa a possibilidade do conhecimento. O ceticismo radical (global, pirrónico) duvida de todo e qualquer conhecimento e defende a suspensão do juízo; o moderado (regional) só duvida em certas áreas, como a Ética ou a religião.', exemplo:'Pirro de Élis: como não podemos ter a certeza de nada, devemos suspender o juízo.' },
    { id:'c41', m:3, aberta:true, frente:'De que forma argumentam os céticos a favor da sua perspetiva? (revisão da ficha)', verso:'Defendem que as nossas crenças não estão justificadas e que, sem justificação, não há conhecimento. Para isso usam o argumento dos enganos sensoriais (os sentidos às vezes enganam-nos, por isso podemos ser sempre enganados e as justificações dos sentidos são inadequadas) e, sobretudo, o argumento da regressão infinita da justificação (cada crença precisa de outra para a justificar, sem fim, logo nenhuma fica justificada).', exemplo:'Um lápis parece partido dentro de um copo de água.' },
    { id:'c42', m:4, aberta:true, frente:'Concordas com o argumento cético da regressão infinita? Porquê? (discussão)', verso:'Não há uma única resposta certa: o importante é justificar. Uma resposta possível: não concordo. O argumento é válido, mas não é sólido, porque a premissa 1 é falsa: como defende o fundacionalismo, nem todas as crenças se justificam com base noutras; há crenças básicas, autoevidentes, que se justificam a si mesmas, e a cadeia de justificação termina nelas. Além disso, o ceticismo radical autorrefuta-se: afirma saber que nada se pode saber.', exemplo:'Se concordares, tens de mostrar porque as premissas são verdadeiras (ex.: dizer que nenhuma crença é autoevidente).' },
    { id:'c43', m:5, aberta:true, frente:'«Eu estou aqui agora»: é conhecimento a priori ou a posteriori? Dá-nos informação acerca do mundo? (discussão da ficha)', verso:'É uma pergunta de discussão, sem uma única resposta certa. Pode defender-se que é a priori: quem a diz sabe que é verdadeira só por compreender as palavras («eu» é quem fala, «aqui» é onde está, «agora» é o momento em que fala), sem observar nada. Mas parece dar alguma informação sobre o mundo (que alguém existe num lugar e num momento). Por isso serve para o debate: os racionalistas diriam que há conhecimento a priori com informação sobre o mundo; os empiristas diriam que não informa sobre como o mundo é.', exemplo:'Compara com «Os solteiros não são casados»: é a priori, mas não diz se existe algum solteiro.' },
    { id:'c44', m:3, aberta:false, frente:'Ceticismo global e regional', verso:'Radical = global: duvida de todo e qualquer conhecimento (também se chama pirrónico).\nModerado = regional ou localizado: duvida em algumas áreas, mas não noutras.', exemplo:'Duvidar que haja conhecimento na Ética e na Estética, mas não na Física e na Matemática (moderado).' },
    { id:'c45', m:3, aberta:false, frente:'Pirro, Sexto Empírico e Francisco Sanches', verso:'Pirro de Élis (c. 360/365–270 a.C.): o cético radical mais antigo; não escreveu nenhum livro.\nSexto Empírico (c. 160–210 d.C.): apresentou as ideias de Pirro nas «Hipóteses Pirrónicas».\nFrancisco Sanches (c. 1551–1623): filósofo cético, matemático e médico português, autor de «Que Nada se Sabe».', exemplo:'Suspender o juízo = não acreditar nem deixar de acreditar.' }
  ],

    ],
    pontos:[
      'Formula o problema: “Será possível conhecer alguma coisa?”',
      'Define ceticismo: pôr em causa a possibilidade do conhecimento (não é só ter dúvidas).',
      'Distingue radical (todo o conhecimento; Pirro de Élis, suspensão do juízo) de moderado (só certos domínios, ex.: religião).',
      'Apresenta os argumentos céticos: enganos sensoriais / ilusão dos sentidos (com exemplo), regressão infinita (e diversidade de opiniões).',
      'Expõe o argumento da regressão infinita (5 passos) e diz que é válido.',

      'Usa vocabulário rigoroso e dá pelo menos um exemplo.'
    ],
    desenvolvimento:[
      { id:'a', pergunta:'Explica em que consiste o ceticismo e apresenta os argumentos que os céticos usam para negar a possibilidade do conhecimento.', pontos:[1,2,3,6],
        modelo:'O ceticismo é a posição que põe em causa a possibilidade do conhecimento. O cético radical, como Pirro de Élis, defende que não podemos conhecer nada e que devemos suspender o juízo; o moderado só duvida em certos domínios, como a religião. Os céticos apresentam três argumentos. Primeiro, a ilusão dos sentidos (o argumento dos enganos sensoriais): os sentidos enganam-nos às vezes (um pau parece partido dentro de água), logo não podemos confiar neles. Segundo, a diversidade de opiniões: as pessoas discordam sobre quase tudo e não há forma segura de decidir quem tem razão. Terceiro, a regressão infinita da justificação: cada crença justifica-se com outra, que precisa de outra, sem fim; assim, nenhuma crença fica justificada e, como a justificação é condição necessária do conhecimento, não há conhecimento.' },
      { id:'b', pergunta:'Apresenta o argumento cético da regressão infinita e explica uma resposta possível ao ceticismo.', pontos:[0,1,4,5,6],
        modelo:'O ceticismo põe em causa a possibilidade do conhecimento, respondendo negativamente à pergunta “Será possível conhecer alguma coisa?”. O seu principal argumento é o da regressão infinita da justificação:\n1. As nossas crenças justificam-se com base noutras crenças.\n2. Se as nossas crenças se justificam com base noutras crenças, então sempre que tentamos justificar uma crença caímos numa regressão infinita da justificação.\n3. Se sempre que tentamos justificar uma crença caímos numa regressão infinita da justificação, então nunca temos crenças justificadas.\n4. Se nunca temos crenças justificadas, não há conhecimento.\n5. Logo, não há conhecimento.\nO argumento é válido: se as premissas forem verdadeiras, a conclusão também é. Por isso, quem não aceita a conclusão tem de rejeitar pelo menos uma premissa. O fundacionalismo rejeita a premissa 1: nem todas as crenças se justificam com base noutras, porque há crenças básicas, autoevidentes, que se justificam a si mesmas. Tal como as fundações de um edifício, sustentam as outras crenças sem precisarem de ser sustentadas. A cadeia de justificação termina nelas, logo não há regressão infinita e o conhecimento é possível.' },
      { id:'c', pergunta:'Distingue ceticismo radical de ceticismo moderado e explica por que razão muitos consideram o ceticismo radical contraditório.', pontos:[0,1,2,5,6],
        modelo:'O ceticismo é a posição que põe em causa a possibilidade do conhecimento, isto é, responde negativamente à pergunta “Será possível conhecer alguma coisa?”. Não se trata apenas de ter dúvidas, como quem diz que é “cético” quanto ao sushi. O ceticismo radical põe em causa todo e qualquer conhecimento: Pirro de Élis, por exemplo, defendia que devemos suspender o juízo sobre tudo. O ceticismo moderado só põe em causa o conhecimento em certos domínios: quem diz que na religião não há conhecimento, só opiniões, é um cético moderado. Muitos consideram o ceticismo radical contraditório porque, ao afirmar que nada se pode conhecer, o cético apresenta essa tese como verdadeira, ou seja, pretende saber pelo menos uma coisa: que nada se pode saber. Se a tese fosse verdadeira, o próprio cético não a poderia conhecer. Por isso, o ceticismo radical refuta-se a si mesmo (é autorrefutante).' }
    ]
  },

  /* Teste final: quantas perguntas de cada tipo (total 20) */
  testeFinal: { perguntas:14, classificar:6, minDestaque:4 },

function baralhar(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

/* ---------- XP, níveis, mensagens ---------- */
function nivel(xp){
  let i = 0; C.niveis.forEach((n, k) => { if (xp >= n.xp) i = k; });
  const cur = C.niveis[i], prox = C.niveis[i + 1];
  return { i, nome:cur.nome, prog: prox ? (xp - cur.xp) / (prox.xp - cur.xp) : 1, falta: prox ? prox.xp - xp : 0, prox };
}
function toast(msg, cls){
  const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2000);
}
function mostrarCombo(){ const el = $('#pcombo'); if (el) el.textContent = combo >= 2 ? combo + ' seguidas' : ''; }
function acerto(){
  const antes = nivel(S.xp).i;
  S.xp += 10; combo++;
  let msg = '+10 XP';
  if (combo % 5 === 0){ S.xp += 5; msg += ' · +5 bónus (' + combo + ' seguidas!)'; }
  guardar(); toast(msg, 'xp'); mostrarCombo();
  FUNDO.squishTodos(); // animação do fundo (o som toca à parte, mesmo com o fundo desligado)
  const depois = nivel(S.xp).i;
  tocar('certo');
  if (depois > antes){ setTimeout(() => toast('Subiste para o Nível ' + (depois + 1) + ': ' + C.niveis[depois].nome + '!'), 400); setTimeout(() => tocar('nivel'), 350); }
}
function erro(id){
  combo = 0; mostrarCombo(); tocar('errado');
  if (id){ S.erros[id] = { s:0 }; guardar(); }
}

/* ---------- Estado dos mundos ---------- */
function infoMundo(n){ return S.mundos[n] || { best:0, est:0 }; }
function desbloqueado(n){ return n === 1 || S.abertos.indexOf(n) >= 0 || infoMundo(n - 1).best >= 0.7; }
function temProgresso(n){ return !!S.mundos[n] || !!S.prog['m' + n]; }
/* Recomeçar um mundo: apaga as estrelas e a pergunta onde se ia; os mundos já abertos continuam abertos */
function recomecarMundo(n){
  C.mundos.forEach(m => { if (desbloqueado(m.n) && S.abertos.indexOf(m.n) < 0) S.abertos.push(m.n); });
  delete S.mundos[n]; delete S.prog['m' + n]; guardar();
}
/* Confirmação com 2 toques (o confirm() não funciona em todos os browsers dentro de apps) */
function doisToques(btn, msg, acao){
  let armado = false, tm = 0; const txt = btn.textContent;
  btn.onclick = () => {
    if (armado){ clearTimeout(tm); acao(); return; }
    armado = true; btn.textContent = msg; btn.classList.add('armado');
    tm = setTimeout(() => { armado = false; btn.textContent = txt; btn.classList.remove('armado'); }, 4000);
  };
}
/* Jogos a meio: as perguntas guardam-se pelo id; as respostas, pelo texto da opção escolhida */
function progOk(ch){
  const p = S.prog[ch]; if (!p) return false;
  if (p.passos && p.passos.every(x => x.k !== 'q' || ITENS[x.id])) return true;
  delete S.prog[ch]; guardar(); return false;
}
const serPasso = p => p.k === 'q' ? { k:'q', id:p.it.id } : p;
const desPasso = p => p.k === 'q' ? { k:'q', it:ITENS[p.id] } : p;
const serRes = x => x.Q ? { c:x.c, ok:x.ok, id:x.Q.id, esc:x.Q.opts[x.i].txt } : { c:x.c };
function desResposta(x){ const Q = preparar(ITENS[x.id]); return { ok:x.ok, Q, i:Math.max(0, Q.opts.findIndex(o => o.txt === x.esc)) }; }
const desRes = (x, p) => x.id ? Object.assign({ p, c:x.c }, desResposta(x)) : { p, c:x.c };
let pedirReset = 0; // mundo cujo "Recomeçar?" está aberto no mapa
function estrelas(p){ return p >= 0.95 ? 3 : p >= 0.85 ? 2 : p >= 0.7 ? 1 : 0; }

function preparar(it){
  if (it.t === 'vf') return { id:it.id, t:'vf', q:it.q, e:it.e, opts:[{ txt:'Verdadeiro', ok:it.a === true }, { txt:'Falso', ok:it.a === false }] };
  if (it.t === 'cl'){
    const set = C.classificar[it.set];
    return { id:it.id, t:'cl', q:'Classifica: “' + it.x + '”', e:it.e || set.porque[it.c], opts:set.cats.map(c => ({ txt:c.l, ok:c.k === it.c })) };
  }
  return { id:it.id, t:it.t, q:it.q, e:it.e, opts:baralhar(it.o.map((txt, i) => ({ txt, ok:i === 0 }))) };
}
function fmtQ(q){ return esc(q).replace('___', '<span class="blank">______</span>'); }

function telaPergunta(ctx, it, done){
  const Q = preparar(it), teste = ctx.modo === 'teste';
  const letras = Q.t === 'vf' ? ['V','F'] : ['A','B','C','D'];
  ctx.body.innerHTML = '<article class="q pop-in"><p class="tag">' + TIPOS[Q.t] + '</p><h2 class="qtext">' + fmtQ(Q.q) + '</h2>' +
    '<div class="opts ' + (Q.t === 'vf' ? 'vf' : '') + '">' + Q.opts.map((o, i) => '<button class="opt" data-i="' + i + '" type="button"><span class="key">' + letras[i] + '</span><span>' + esc(o.txt) + '</span></button>').join('') + '</div>' +
    '<div class="fb" hidden></div></article>';
  const btns = Array.from(ctx.body.querySelectorAll('.opt'));
  let feito = false;
  btns.forEach(b => b.onclick = () => {
    if (feito) return; feito = true;
    const i = +b.dataset.i, ok = Q.opts[i].ok;
    btns.forEach(x => x.disabled = true);
    if (teste){ b.classList.add('picked'); setTimeout(() => done(ok, Q, i), 320); return; }
    const ci = Q.opts.findIndex(o => o.ok);
    btns[ci].classList.add('right'); if (!ok) b.classList.add('wrong');
    const blank = ctx.body.querySelector('.blank');
    if (blank){ blank.textContent = Q.opts[ci].txt; blank.classList.add('filled'); }
    if (ok) acerto(); else erro(Q.id);
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (ok ? 'is-ok' : 'is-bad');
    fb.innerHTML = '<p class="fb-msg">' + esc(sorte(ok ? C.mensagens.certo : C.mensagens.errado)) + '</p>' + (Q.e ? '<p class="fb-e">' + esc(Q.e) + '</p>' : '') + '<button class="btn primary" type="button">Continuar</button>' +
      (!ok && C.licoes[it.m] ? '<button class="link-b" data-mat type="button">Rever a matéria deste tema</button>' : '');
    const nb = fb.querySelector('.btn');
    const mt = fb.querySelector('[data-mat]'); if (mt) mt.onclick = () => abrirMateria(it.m);
    nb.onclick = () => done(ok, Q, i);
    try { nb.focus({ preventScroll:true }); fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  });
}

/* ---------- Sequência de passos (mundos, minijogos, teste) ---------- */
function jogar(titulo, passos, fim, modo, chave, materiaN){
  const ctx = palco(titulo, modo, chave, materiaN);
  let k = 0, cred = 0, res = [], xp0 = S.xp;
  const sv = chave && S.prog[chave];
  if (sv){ passos = sv.passos.map(desPasso); k = sv.k; cred = sv.cred; xp0 = S.xp - (sv.xp || 0); res = sv.res.map((x, j) => desRes(x, passos[j])); }
  const gravar = () => { if (chave){ S.prog[chave] = { passos:passos.map(serPasso), k, cred, xp:S.xp - xp0, res:res.map(serRes) }; guardar(); } };
  const passo = () => {
    topo();
    if (k >= passos.length){ if (chave){ delete S.prog[chave]; guardar(); } return fim({ cred, total:passos.length, res, xp:S.xp - xp0 }); }
    ctx.prog(k / passos.length, (k + 1) + '/' + passos.length);
    const p = passos[k];
    const done = (c, extra) => { cred += c; res.push(Object.assign({ p, c }, extra || {})); k++; gravar(); passo(); };
    if (p.k === 'q') telaPergunta(ctx, p.it, (ok, Q, i) => done(ok ? 1 : 0, { ok, Q, i }));
    else if (p.k === 'ordem') telaOrdem(ctx, done);
    else if (p.k === 'ligar') telaLigar(ctx, p.set, done);
    else if (p.k === 'sprint') telaSprint(ctx, p.set, done);
  };
  passo();
}

function jogarMundo(n, saltarLicao){
  const m = C.mundos[n - 1];
  combo = 0;
  if (progOk('m' + n)) return jogar('Mundo ' + n + ' · ' + m.titulo, [], r => fimMundo(n, r), 'normal', 'm' + n, n);
  const comecar = () => {
    const passos = baralhar(C.perguntas.filter(p => p.m === n)).slice(0, m.nPerguntas).map(it => ({ k:'q', it }));
    const esp = m.especiais, L = passos.length;
    esp.forEach((s, i) => { passos.splice(Math.round((i + 1) * L / (esp.length + 1)) + i, 0, s); });
    jogar('Mundo ' + n + ' · ' + m.titulo, passos, r => fimMundo(n, r), 'normal', 'm' + n, n);
  };
  if (saltarLicao) comecar(); else telaLicao(n, comecar);
}

function fimMundo(n, r){
  const pct = r.total ? r.cred / r.total : 0, est = estrelas(pct);
  const prev = infoMundo(n);
  const abriaAntes = n < 5 && desbloqueado(n + 1);
  S.mundos[n] = { best:Math.max(prev.best || 0, pct), est:Math.max(prev.est || 0, est) };
  if (n < 5 && pct >= 0.7 && S.abertos.indexOf(n + 1) < 0) S.abertos.push(n + 1);
  guardar();
  const abriuAgora = n < 5 && !abriaAntes && desbloqueado(n + 1);
  const m = C.mundos[n - 1];
  let msg;
  if (est === 3) msg = 'Perfeito! Dominas este mundo.';
  else if (est === 2) msg = 'Muito bom! Falta pouco para as 3 estrelas.';
  else if (est === 1) msg = 'Passaste! Repete para ganhar mais estrelas.';
  else msg = 'Precisas de 70% para passar. Os erros já estão na revisão: cada tentativa fica mais fácil.';
  limpar(); topo();
  $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Mundo ' + n + ' · ' + esc(m.titulo) + '</p>' +
    estrelasHTML(est) + '<p class="big">' + Math.round(pct * 100) + '<small>%</small></p><h2>' + esc(msg) + '</h2>' +
    (abriuAgora ? '<p class="aviso">Desbloqueaste o Mundo ' + (n + 1) + ': <b>' + esc(C.mundos[n].titulo) + '</b></p>' : '') +
    '<div class="stats"><span>+' + r.xp + ' XP</span><span>melhor: ' + Math.round(S.mundos[n].best * 100) + '%</span></div>' +
    '<div class="acts">' + (n < 5 && desbloqueado(n + 1) ? '<button class="btn primary" id="r-prox" type="button">Mundo ' + (n + 1) + '</button>' : '') +
    '<button class="btn" id="r-rep" type="button">Jogar outra vez</button><button class="btn ghost" id="r-ini" type="button">Voltar ao mapa</button></div></section></div>';
  const prox = $('#r-prox'); if (prox) prox.onclick = () => jogarMundo(n + 1);
  $('#r-rep').onclick = () => jogarMundo(n);
  $('#r-ini').onclick = inicio;
  if (est === 3) setTimeout(confetis, 250);
}

/* ---------- Classifica rápido ---------- */
function telaSprint(ctx, key, done){
  const set = C.classificar[key], DUR = 60;
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Classifica rápido · 60 segundos</p><h2 class="qtext">' + esc(set.titulo) + '</h2><p class="lead">' + esc(set.instrucao) + '</p>' +
    '<ul class="hint">' + set.cats.map(c => '<li><b>' + esc(c.l) + '</b>: ' + esc(c.dica) + '</li>').join('') + '</ul>' +
    '<p class="lead small">Acertos seguidos fazem combo. Recorde atual: ' + (S.recordes[key] || 0) + ' certas.</p>' +
    '<button class="btn primary big" id="go" type="button">Começar</button></article>';
  $('#go').onclick = comecar;

  function comecar(){
    let pool = [], cur = null, certos = 0, total = 0, cmb = 0, maxc = 0, ativo = true;
    const errados = [], fimT = Date.now() + DUR * 1000;
    ctx.body.innerHTML = '<article class="sprint"><div class="sp-top"><div class="timer"><i id="tbar"></i></div><span class="sp-time" id="ttxt">60</span></div>' +
      '<div class="sp-stats"><span>Certas: <b id="sc">0</b></span><span class="combo" id="scombo"></span></div>' +
      '<div class="sp-card" id="scard"><p id="stxt"></p></div>' +
      '<div class="sp-btns n' + set.cats.length + '">' + set.cats.map(c => '<button class="btn sp-b" data-k="' + c.k + '" type="button">' + esc(c.l) + '</button>').join('') + '</div></article>';
    const card = $('#scard'), txt = $('#stxt');
    const anima = cls => { card.classList.remove('in', 'ok', 'bad'); void card.offsetWidth; card.classList.add(cls); };
    const novo = () => {
      if (!pool.length){ pool = baralhar(set.itens); if (pool.length > 1 && pool[pool.length - 1] === cur) pool.unshift(pool.pop()); }
      cur = pool.pop(); txt.textContent = cur.x;
    };
    ctx.body.querySelectorAll('.sp-b').forEach(b => b.onclick = () => {
      if (!ativo) return;
      total++;
      const ok = b.dataset.k === cur.c;
      if (ok){ certos++; cmb++; maxc = Math.max(maxc, cmb); acerto(); }
      else { cmb = 0; erro(cur.id); errados.push(cur); }
      anima(ok ? 'ok' : 'bad');
      $('#sc').textContent = certos;
      $('#scombo').textContent = cmb >= 2 ? 'Combo ×' + cmb : '';
      novo();
    });
    const tick = () => {
      const left = Math.max(0, fimT - Date.now());
      $('#tbar').style.width = (left / (DUR * 10)) + '%';
      $('#ttxt').textContent = Math.ceil(left / 1000);
      if (left <= 0) terminar();
    };
    const iv = setInterval(tick, 100); TIMERS.push(iv);
    novo(); anima('in'); tick();

    function terminar(){
      if (!ativo) return; ativo = false; clearInterval(iv);
      const rec = S.recordes[key] || 0, novoRec = certos > rec;
      if (novoRec){ S.recordes[key] = certos; guardar(); }
      const pct = total ? certos / total : 0;
      const unicos = errados.filter((x, i) => errados.indexOf(x) === i);
      const nomeCat = k => set.cats.find(c => c.k === k).l;
      ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Tempo!</p><h2 class="qtext">' + certos + ' certas em ' + total + '</h2>' +
        '<div class="stats" style="justify-content:flex-start"><span>precisão ' + Math.round(pct * 100) + '%</span><span>maior combo ×' + maxc + '</span><span>' + (novoRec ? 'novo recorde!' : 'recorde: ' + rec) + '</span></div>' +
        (unicos.length ? '<div><p class="col-h">Para rever</p><ul class="lista-err">' + unicos.map(x => '<li>“' + esc(x.x) + '” → <b>' + esc(nomeCat(x.c)) + '</b></li>').join('') + '</ul></div>' : (total ? '<p class="fb-msg" style="color:var(--ok)">Sem erros. Impressionante!</p>' : '<p class="lead">Não respondeste a nenhuma frase. Tenta outra vez!</p>')) +
        '<button class="btn primary big" id="sp-ok" type="button">Continuar</button></article>';
      $('#sp-ok').onclick = () => done(pct);
    }
  }
}

/* ---------- Ordena o argumento ---------- */
function telaOrdem(ctx, done){
  const O = C.ordenar, L = O.linhas;
  let pecas = baralhar(L.map((_, i) => i));
  while (pecas.every((v, i) => v === i)) pecas = baralhar(pecas);
  let resp = [];
  const render = () => {
    ctx.body.innerHTML = '<article class="mini"><p class="tag">Ordena o argumento</p><h2 class="qtext">' + esc(O.titulo) + '</h2><p class="lead">' + esc(O.instrucao) + '</p>' +
      '<ol class="slots">' + L.map((_, j) => { const v = resp[j];
        return '<li class="slot ' + (v == null ? 'empty' : '') + '"><span class="sn">' + (j < L.length - 1 ? 'P' + (j + 1) : 'C') + '</span>' +
          (v == null ? '<span class="ph">' + (j === resp.length ? 'Toca numa frase abaixo' : '') + '</span>' : '<button class="slot-b" data-j="' + j + '" type="button">' + esc(L[v]) + '</button>') + '</li>'; }).join('') + '</ol>' +
      '<div class="pecas">' + pecas.filter(i => resp.indexOf(i) < 0).map(i => '<button class="peca" data-i="' + i + '" type="button">' + esc(L[i]) + '</button>').join('') + '</div>' +
      '<div class="acts">' + (resp.length === L.length ? '<button class="btn primary" id="ver" type="button">Verificar</button>' : '') + (resp.length ? '<button class="btn ghost" id="lim" type="button">Recomeçar</button>' : '') + '</div>' +
      '<div class="fb" hidden></div></article>';
    ctx.body.querySelectorAll('.peca').forEach(b => b.onclick = () => { resp.push(+b.dataset.i); render(); });
    ctx.body.querySelectorAll('.slot-b').forEach(b => b.onclick = () => { resp.splice(+b.dataset.j, 1); render(); });
    const lim = $('#lim'); if (lim) lim.onclick = () => { resp = []; render(); };
    const ver = $('#ver'); if (ver) ver.onclick = verificar;
  };
  const verificar = () => {
    const slots = ctx.body.querySelectorAll('.slot');
    let hits = 0;
    resp.forEach((v, j) => { const ok = v === j; if (ok) hits++; slots[j].classList.add(ok ? 'right' : 'wrong'); });
    ctx.body.querySelectorAll('.slot-b').forEach(b => b.disabled = true);
    ctx.body.querySelector('.acts').innerHTML = '';
    const tudo = hits === L.length;
    if (tudo) acerto(); else erro();
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (tudo ? 'is-ok' : 'is-bad');
    fb.innerHTML = '<p class="fb-msg">' + (tudo ? 'Ordem perfeita!' : hits + ' de ' + L.length + ' no sítio certo. ' + esc(sorte(C.mensagens.errado))) + '</p>' +
      (tudo ? '' : '<p class="col-h">Ordem certa</p><ol class="ordem-certa">' + L.map(l => '<li>' + esc(l) + '</li>').join('') + '</ol>') +
      '<p class="fb-e">' + esc(O.nota) + '</p><button class="btn primary" type="button">Continuar</button>';
    fb.querySelector('button').onclick = () => done(hits / L.length);
    try { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  };
  render();
}

/* ---------- Liga ---------- */
function telaLigar(ctx, key, done){
  const set = C.ligar[key], n = set.pares.length;
  const esq = baralhar(set.pares.map((_, i) => i)), dir = baralhar(set.pares.map((_, i) => i));
  let sel = null, falhas = 0; const feitos = [];
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Liga</p><h2 class="qtext">' + esc(set.titulo) + '</h2><p class="lead">Toca primeiro num ' + esc(set.colA.toLowerCase()) + ' e depois no que lhe corresponde.</p>' +
    '<div class="lig"><div><p class="col-h">' + esc(set.colA) + '</p><div class="lig-a">' + esq.map(i => '<button class="lk a" data-i="' + i + '" type="button">' + esc(set.pares[i][0]) + '</button>').join('') + '</div></div>' +
    '<div><p class="col-h">' + esc(set.colB) + '</p><div class="lig-b">' + dir.map(i => '<button class="lk b" data-i="' + i + '" type="button"><span class="pr"></span>' + esc(set.pares[i][1]) + '</button>').join('') + '</div></div></div>' +
    '<div class="fb" hidden></div></article>';
  const A = Array.from(ctx.body.querySelectorAll('.lk.a')), B = Array.from(ctx.body.querySelectorAll('.lk.b'));
  const abana = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
  A.forEach(b => b.onclick = () => {
    const i = +b.dataset.i; if (feitos.indexOf(i) >= 0) return;
    sel = i; A.forEach(x => x.classList.toggle('sel', x === b));
  });
  B.forEach(b => b.onclick = () => {
    const j = +b.dataset.i; if (feitos.indexOf(j) >= 0) return;
    if (sel == null){ A.forEach(abana); return; }
    const a = A.find(x => +x.dataset.i === sel);
    if (j === sel){
      const cor = 'm' + (feitos.length % 4); feitos.push(j);
      a.classList.remove('sel'); a.classList.add(cor); b.classList.add(cor); a.disabled = b.disabled = true;
      b.querySelector('.pr').textContent = set.pares[j][0] + ' ·';
      sel = null; acerto();
      if (feitos.length === n) acabar();
    } else { falhas++; erro(); abana(b); abana(a); }
  });
  function acabar(){
    const c = Math.max(0, (n - falhas) / n);
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (falhas ? 'is-info' : 'is-ok');
    fb.innerHTML = '<p class="fb-msg">' + (falhas ? 'Tudo ligado, com ' + falhas + (falhas === 1 ? ' tentativa errada.' : ' tentativas erradas.') : 'Tudo ligado à primeira!') + '</p><button class="btn primary" type="button">Continuar</button>';
    fb.querySelector('button').onclick = () => done(c);
    try { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  }
}
