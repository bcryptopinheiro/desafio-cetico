    { id:'m2-12', m:2, s:0, t:'mc', q:'Uma proposição é:', o:['o pensamento expresso por uma frase declarativa, que pode ser verdadeiro ou falso','uma pergunta que se faz sobre o mundo, à espera de uma resposta','uma ordem ou um pedido, expresso por uma frase imperativa ou exclamativa','uma frase interrogativa ou exclamativa, verdadeira ou falsa conforme quem a diz'], e:'Só frases declarativas exprimem proposições, porque só essas podem ser verdadeiras ou falsas.' },
    { id:'m2-13', m:2, s:0, t:'mc', q:'Qual destas frases exprime uma proposição?', o:['“Lisboa é a capital de Portugal.”','“Fecha a porta, se faz favor!”','“Que horas são em Lisboa?”','“Oxalá chova amanhã!”'], e:'É declarativa: pode ser verdadeira ou falsa. Ordens, perguntas e desejos não exprimem proposições.' },
    { id:'m2-14', m:2, s:0, t:'mc', q:'Qual destes é um exemplo de conhecimento prático?', o:['Sei nadar.','Sei que o Sol é uma estrela.','Conheço o Algarve.','Conheço a minha avó.'], e:'Nadar é uma competência: saber-fazer.' },
    { id:'m2-15', m:2, s:0, t:'vf', q:'A palavra correta é “conhecimento proporcional”.', a:false, e:'É “proposicional”, de proposição. “Proporcional” é um erro frequente.' },
    { id:'m2-16', m:2, s:0, t:'vf', q:'“Sei nadar” é um exemplo de conhecimento prático.', a:true, e:'Nadar é uma competência: saber-fazer.' },
    { id:'m2-17', m:2, s:0, t:'vf', q:'“Conheço o Porto” é conhecimento proposicional.', a:false, e:'É conhecimento por contacto: conhecimento direto de um lugar.' },
    { id:'m2-18', m:2, s:0, t:'vf', q:'A pergunta “Que horas são?” exprime uma proposição.', a:false, e:'Uma pergunta não é verdadeira nem falsa, por isso não exprime uma proposição.' },
    { id:'m2-19', m:2, s:0, t:'vf', q:'O conhecimento proposicional também se chama conhecimento factual.', a:true, e:'Saber-que = conhecimento proposicional = conhecimento factual.' },
    { id:'m2-20', m:2, s:0, t:'completa', q:'“Sei que…” indica conhecimento ___.', o:['proposicional','prático','por contacto','por familiaridade'], e:'Truque: “sei que…” → proposicional.' },
    { id:'m2-21', m:2, s:0, t:'completa', q:'“Sei fazer…” indica conhecimento ___.', o:['prático','proposicional','por contacto','a posteriori'], e:'Truque: “sei fazer…” → prático.' },
    { id:'m2-22', m:2, s:0, t:'completa', q:'O conhecimento por contacto também se chama conhecimento por ___.', o:['familiaridade','aprendizagem escolar','proposição','competência'], e:'Por contacto = familiaridade.' },
    // Exercício 1 do manual (sai no teste): a Julieta
    { id:'m2-23', m:2, s:2, t:'mc', destaque:true, q:'Indica o tipo de conhecimento: “A Julieta sabe preparar batidos de frutas.”', o:['prático','proposicional','por contacto','nenhum dos três tipos'], e:'Atenção: “sabe” nem sempre é proposicional. “Sabe preparar” é saber-fazer, uma competência.' },
    { id:'m2-24', m:2, s:2, t:'mc', destaque:true, q:'Indica o tipo de conhecimento: “A Julieta conhece de trás para a frente o sítio onde o rio Mondego nasce.”', o:['por contacto','proposicional','prático','nenhum dos três tipos'], e:'Conhece diretamente um lugar: conhecimento por contacto.' },
    { id:'m2-25', m:2, s:2, t:'mc', destaque:true, q:'Indica o tipo de conhecimento: “A Julieta sabe qual é a diferença entre um romance e uma novela.”', o:['proposicional','prático','por contacto','nenhum dos três tipos'], e:'Sabe que a diferença é esta e aquela: é saber-que, conhecimento proposicional.' },
    { id:'m2-26', m:2, s:2, t:'mc', destaque:true, q:'Indica o tipo de conhecimento: “A Julieta consegue fingir na perfeição que está a dormir.”', o:['prático','proposicional','por contacto','nenhum dos três tipos'], e:'Fingir que dorme é uma competência: saber-fazer.' },
    { id:'m2-27', m:2, s:2, t:'mc', destaque:true, q:'Indica o tipo de conhecimento: “O filho da Julieta já sabe comer de faca e garfo.”', o:['prático','proposicional','por contacto','nenhum dos três tipos'], e:'Atenção: “sabe comer” é saber-fazer, não proposicional.' },
    { id:'m2-28', m:2, s:2, t:'mc', destaque:true, q:'Indica o tipo de conhecimento: “A Julieta sabe o que é um neutrino.”', o:['proposicional','prático','por contacto','nenhum dos três tipos'], e:'Sabe que um neutrino é uma certa partícula: saber-que, conhecimento proposicional.' },
    { id:'m2-29', m:2, s:2, t:'mc', destaque:true, q:'Indica o tipo de conhecimento: “A Julieta conhece o primeiro namorado da sua mãe.”', o:['por contacto','proposicional','prático','nenhum dos três tipos'], e:'Conhece diretamente uma pessoa: conhecimento por contacto.' },
    { id:'m2-30', m:2, s:2, t:'mc', destaque:true, q:'Em “A Julieta sabe preparar batidos de frutas”, o verbo “saber” indica:', o:['saber-fazer (conhecimento prático), apesar de se usar “sabe”','conhecimento proposicional, porque se usa o verbo “sabe”','conhecimento por contacto, porque conhece as frutas','conhecimento proposicional: sabe que os batidos se fazem com fruta, por isso usa “sabe”'], e:'O que conta não é o verbo, mas o que se sabe: preparar batidos é uma competência.' },
    { id:'m2-31', m:2, s:2, t:'vf', destaque:true, q:'“A Julieta sabe preparar batidos de frutas” é conhecimento proposicional, porque usa o verbo saber.', a:false, e:'É conhecimento prático: “sabe preparar” é saber-fazer.' },
    { id:'m2-32', m:2, s:2, t:'vf', destaque:true, q:'“A Julieta sabe o que é um neutrino” é conhecimento proposicional.', a:true, e:'É saber-que: sabe que um neutrino é uma certa partícula.' },
    { id:'m2-33', m:2, s:2, t:'vf', destaque:true, q:'“A Julieta conhece o primeiro namorado da sua mãe” é conhecimento por contacto.', a:true, e:'Conhece diretamente uma pessoa.' },
    { id:'m2-34', m:2, s:2, t:'vf', destaque:true, q:'“O filho da Julieta já sabe comer de faca e garfo” é conhecimento por contacto.', a:false, e:'É conhecimento prático: saber comer de faca e garfo é uma competência.' },
    { id:'m2-35', m:2, s:2, t:'vf', destaque:true, q:'Sempre que uma frase usa o verbo “saber”, o conhecimento é proposicional.', a:false, e:'“Sabe preparar”, “sabe comer” são saber-fazer (prático). Só “sabe que…” é proposicional.' },
    { id:'m2-36', m:2, s:2, t:'vf', destaque:true, q:'“A Julieta conhece de trás para a frente o sítio onde o rio Mondego nasce” é conhecimento por contacto.', a:true, e:'Conhece diretamente um lugar.' },

    // Manual, pp. 10–11 (a Alice)
    { id:'m2-37', m:2, s:1, t:'mc', q:'«Alice consegue assobiar o hino nacional» é conhecimento:', o:['prático','proposicional','por contacto','nenhum dos três tipos'], e:'O objeto é uma capacidade (assobiar). Não é preciso a palavra «sabe» para ser prático.' },
    { id:'m2-38', m:2, s:1, t:'mc', q:'«Alice compreende a teoria da relatividade» é conhecimento:', o:['proposicional','prático','por contacto','nenhum dos três tipos'], e:'O objeto são ideias (proposições) da teoria. Está na tabela do manual como proposicional.' },
    { id:'m2-39', m:2, s:1, t:'mc', q:'«Alice conhece o seu corpo» é conhecimento:', o:['por contacto','proposicional','prático','nenhum dos três tipos'], e:'Conhecimento direto, através dos sentidos. Está na tabela do manual como por contacto.' },
    { id:'m2-40', m:2, s:1, t:'mc', q:'«Alice conhece o Museu Nacional de Arte Antiga» é conhecimento:', o:['por contacto','proposicional','prático','nenhum dos três tipos'], e:'Conhecer diretamente um lugar.' },
    { id:'m2-41', m:2, s:1, t:'mc', q:'«Alice sabe que um soneto tem catorze versos» é conhecimento:', o:['proposicional','prático','por contacto','nenhum dos três tipos'], e:'«Sabe que…» + proposição.' },
    { id:'m2-42', m:2, s:0, t:'mc', q:'No conhecimento por contacto, o sujeito conhece diretamente algo:', o:['através dos sentidos externos (visão, audição, tato…)','só através do pensamento, sem usar os sentidos','através de livros e de testemunhos de outras pessoas','através de uma competência ou aptidão que treinou'], e:'O objeto são lugares, animais, plantas, pessoas, objetos físicos (manual, p. 11).' },
    { id:'m2-43', m:2, s:0, t:'mc', q:'No conhecimento prático, o objeto de conhecimento é:', o:['uma aptidão ou capacidade','uma proposição verdadeira','um lugar, uma pessoa ou uma coisa','uma crença básica autoevidente'], e:'O sujeito sabe realizar uma ação ou atividade (ex.: fritar ovos).' },
    { id:'m2-44', m:2, s:0, t:'mc', q:'No conhecimento proposicional, o objeto de conhecimento são:', o:['proposições (ideias)','capacidades (aptidões)','lugares e pessoas','os sentidos externos'], e:'Conhecer proposicionalmente é conhecer ideias.' },
    { id:'m2-45', m:2, s:0, t:'mc', q:'Qual é o tipo de conhecimento que nos permite saber sem ter uma experiência direta?', o:['proposicional','por contacto','prático','nenhum dos três tipos'], e:'Posso saber que Platão foi um filósofo grego sem o ter conhecido. O por contacto exige contacto direto.' },
    { id:'m2-46', m:2, s:0, t:'vf', q:'Saber o que é uma alucinação é conhecimento proposicional.', a:true, e:'É o exemplo do manual (Oliver Sacks).' },
    { id:'m2-47', m:2, s:0, t:'vf', q:'Saber fritar ovos é conhecimento por contacto.', a:false, e:'É conhecimento prático: uma capacidade.' },
    { id:'m2-48', m:2, s:0, t:'vf', q:'Conhecer o Castelo dos Mouros é conhecimento por contacto.', a:true, e:'Conhecer diretamente um lugar.' },
    { id:'m2-49', m:2, s:0, t:'vf', q:'A maior parte dos conhecimentos adquiridos na escola, por exemplo em História ou Biologia, é proposicional.', a:true, e:'É o que diz o manual na p. 11.' },
    /* ---------- Mundo 3 · Possibilidade e ceticismo (sai no teste) ---------- */
    { id:'m3-01', m:3, s:1, t:'mc', q:'Em filosofia, um cético é quem:', o:['põe em causa a possibilidade do conhecimento','tem dúvidas sobre se o sushi é bom ou não','acredita em tudo o que lhe dizem','defende que há crenças básicas autoevidentes'], e:'O cético filosófico desafia a nossa pretensão de saber: põe em causa a possibilidade do conhecimento.' },
    { id:'m3-02', m:3, s:3, t:'mc', q:'Pirro de Élis defendia que devemos:', o:['suspender o juízo sobre tudo','confiar nos sentidos','usar a razão como fonte do conhecimento','procurar crenças básicas'], e:'Como nunca podemos saber como as coisas realmente são, Pirro defendia a suspensão do juízo sobre tudo.' },
    { id:'m3-03', m:3, s:2, t:'mc', q:'Quem só duvida que se possa saber o que é moralmente certo é um cético:', o:['moderado','radical','fundacionalista','empirista'], e:'Limita-se a um domínio (a moralidade): ceticismo moderado.' },
    { id:'m3-04', m:3, s:2, t:'mc', q:'O ceticismo radical:', o:['põe em causa toda e qualquer espécie de conhecimento','limita-se a certos domínios, como a moral ou a religião','defende que há crenças básicas que se justificam a si mesmas','confia na experiência sensível como única fonte de conhecimento'], e:'Radical = põe em causa todo o conhecimento.' },
    { id:'m3-05', m:3, s:2, t:'mc', q:'O ceticismo moderado:', o:['limita-se a certos tipos ou domínios de conhecimento','põe em causa toda e qualquer espécie de conhecimento','diz que tudo pode ser conhecido pela razão','rejeita a premissa 1 do argumento da regressão infinita'], e:'Moderado = só certos domínios: livre-arbítrio, moralidade, existência de Deus.' },
    { id:'m3-06', m:3, s:3, t:'mc', q:'Segundo Pirro, suspender o juízo permite:', o:['libertarmo-nos dos desejos e alcançar a paz de espírito, para sermos felizes','conhecer a verdade absoluta sobre o mundo e sobre nós mesmos','ganhar todas as discussões, porque nunca se afirma nada de errado','justificar todas as nossas crenças através de crenças básicas'], e:'A suspensão do juízo traz tranquilidade (paz de espírito) e, assim, felicidade.' },
    { id:'m3-07', m:3, s:3, t:'mc', q:'“Suspender o juízo” significa:', o:['não considerar nada verdadeiro nem falso','considerar tudo falso até prova em contrário','acreditar em tudo o que parece verdadeiro','confiar apenas na razão e não nos sentidos'], e:'Suspender o juízo é não afirmar nem negar: nada é tido como verdadeiro nem como falso.' },
    { id:'m3-08', m:3, s:3, t:'mc', q:'Pirro de Élis viveu:', o:['na Grécia Antiga, por volta de 360–270 a.C.','na Roma Antiga, por volta do século II depois de Cristo','em Portugal, no século XVI, como Francisco Sanches','na Grécia Antiga, por volta de 160–210 d.C.'], e:'O manual diz c. 360–270 a.C. e a ficha c. 365–270 a.C.: o que importa é que viveu na Grécia Antiga, nos séculos IV–III a.C.' },
    { id:'m3-09', m:3, s:5, t:'mc', q:'O argumento cético da ilusão dos sentidos diz que:', o:['os sentidos enganam-nos, logo não podemos confiar neles','as pessoas discordam sobre tudo e por isso ninguém pode ter razão','há crenças autoevidentes que não precisam de justificação','a razão é a única fonte segura de conhecimento'], e:'Se os sentidos por vezes nos enganam, não podemos confiar neles para conhecer.' },
    { id:'m3-10', m:3, s:5, t:'mc', q:'Extra dos apontamentos — o argumento da diversidade de opiniões diz que:', o:['as pessoas discordam sobre tudo e não há forma segura de saber quem tem razão','os sentidos às vezes nos enganam, logo nunca podemos confiar neles','as crenças justificam-se sempre noutras crenças, numa cadeia sem fim','o conhecimento vem todo da experiência, que é diferente para cada pessoa'], e:'A discordância constante mostraria que não há forma segura de saber quem tem razão.' },
    { id:'m3-11', m:3, s:0, t:'mc', q:'Qual destas perguntas também formula o problema da possibilidade do conhecimento?', o:['“Será que temos crenças justificadas?”','“Qual é a fonte do nosso conhecimento?”','“O que é uma proposição verdadeira?”','“O que é que significa conhecer?”'], e:'Possibilidade: “Será possível conhecer alguma coisa?” ou “Será que temos crenças justificadas?”.' },
    { id:'m3-12', m:3, s:1, t:'mc', q:'A Ana diz: “Sou um pouco cética quanto a pratos com peixe cru.” Em sentido filosófico, ela:', o:['não é cética: só duvida no sentido comum','é cética radical, porque duvida de algo que não provou','é cética moderada, porque só duvida da comida','é fundacionalista quanto à comida'], e:'No uso comum, “cético” é quem duvida. Isso não faz de alguém um cético filosófico.' },
    { id:'m3-13', m:3, s:1, t:'mc', q:'Para ser cético filosófico quanto ao sushi, alguém teria de acreditar que:', o:['não é de todo possível saber se o sushi é saboroso','o sushi não é saboroso para a maioria das pessoas','prefere outros pratos ao sushi e não o quer provar','o sushi faz mal à saúde se o peixe não for fresco'], e:'O cético filosófico põe em causa a possibilidade de saber, não apenas duvida.' },
    { id:'m3-14', m:3, s:2, t:'mc', q:'Quem defende que não podemos saber se Deus existe, mas aceita o conhecimento científico, é um cético:', o:['moderado','radical','fundacionalista','racionalista'], e:'Só põe em causa um domínio (a existência de Deus): ceticismo moderado.' },
    { id:'m3-15', m:3, s:6, t:'mc', q:'A objeção de que o ceticismo radical se autorrefuta diz que:', o:['ao afirmar que nada se pode conhecer, o cético afirma saber pelo menos uma coisa','os sentidos são fiáveis, por isso o cético está errado','há crenças básicas autoevidentes que travam a regressão infinita','a premissa 4 do argumento da regressão é falsa'], e:'Se o cético sabe que nada se sabe, então sabe alguma coisa: contradiz-se.' },
    { id:'m3-16', m:3, s:6, t:'mc', q:'Outra forma da objeção ao ceticismo: se nenhuma crença está justificada, então:', o:['as premissas do próprio cético também não estão justificadas','o cético tem razão e não há conhecimento nenhum','só a conclusão do cético fica justificada, e as premissas não','os sentidos nunca nos enganam e todas as crenças são verdadeiras'], e:'O argumento cético mina-se a si mesmo: as suas premissas também ficam sem justificação.' },
    { id:'m3-17', m:3, s:5, t:'mc', q:'Qual é o principal argumento cético estudado?', o:['a regressão infinita da justificação','a definição tradicional de conhecimento','o fundacionalismo e as crenças básicas','o racionalismo'], e:'O principal argumento cético é o da regressão infinita da justificação (mundo 4).' },
    { id:'m3-18', m:3, s:1, t:'vf', q:'Duvidar que o sushi seja saboroso faz de alguém um cético em sentido filosófico.', a:false, e:'Isso é dúvida comum. O cético filosófico diz que não é de todo possível saber.' },
    { id:'m3-19', m:3, s:2, t:'vf', q:'Um cético moderado põe em causa todo o conhecimento.', a:false, e:'Quem põe em causa todo o conhecimento é o cético radical. O moderado limita-se a certos domínios.' },
    { id:'m3-20', m:3, s:3, t:'vf', q:'Pirro de Élis defendia que devemos suspender o juízo sobre tudo.', a:true, e:'Pirro: suspender o juízo sobre tudo para alcançar a tranquilidade.' },
    { id:'m3-21', m:3, s:1, t:'vf', q:'Em filosofia, o cético desafia a nossa pretensão de saber.', a:true, e:'É isso que define o cético filosófico: põe em causa a possibilidade do conhecimento.' },
    { id:'m3-22', m:3, s:3, t:'vf', q:'Para Pirro, suspender o juízo traz inquietação e sofrimento.', a:false, e:'Pelo contrário: traz paz de espírito e tranquilidade, para sermos felizes.' },
    { id:'m3-23', m:3, s:6, t:'vf', q:'O ceticismo radical pode ser acusado de se autorrefutar.', a:true, e:'Ao afirmar que nada se pode conhecer, afirma saber pelo menos uma coisa.' },
    { id:'m3-24', m:3, s:3, t:'completa', q:'Pirro defendia que devemos ___ o juízo sobre tudo.', o:['suspender','confiar','justificar','afirmar'], e:'Suspensão do juízo: não considerar nada verdadeiro nem falso.' },
    { id:'m3-25', m:3, s:2, t:'completa', q:'O ceticismo ___ limita-se a certos domínios, como a moralidade ou a existência de Deus.', o:['moderado','radical','fundacionalista','empirista'], e:'Moderado = só certos domínios.' },
    { id:'m3-26', m:3, s:0, t:'completa', q:'“Será possível conhecer alguma coisa?” é o problema da ___ do conhecimento.', o:['possibilidade','origem','definição','fundamentação'], e:'Problema da possibilidade do conhecimento.' },
    { id:'m3-27', m:3, s:5, t:'mc', destaque:true, q:'Quais destes são argumentos que os céticos radicais usam para negar a possibilidade do conhecimento?', o:['os enganos sensoriais (ilusão dos sentidos) e a regressão infinita da justificação','as crenças básicas autoevidentes e a resposta do fundacionalismo','o racionalismo e o empirismo, as duas respostas ao problema da origem','a definição tradicional de conhecimento e o caso da calculadora que «sabe» contas'], e:'São os dois argumentos do esquema do manual (p. 19). Os apontamentos juntam um terceiro: a diversidade de opiniões.' },
    { id:'m3-28', m:3, s:5, t:'mc', destaque:true, q:'Qual destes NÃO é um argumento cético?', o:['existência de crenças básicas autoevidentes','ilusão dos sentidos (enganos sensoriais)','regressão infinita da justificação','diversidade de opiniões (extra dos apontamentos)'], e:'As crenças básicas autoevidentes são a resposta fundacionalista ao ceticismo, e não um argumento cético.' },
    { id:'m3-29', m:3, s:5, t:'mc', destaque:true, q:'Um pau parece partido dentro de água. Que argumento cético ilustra este exemplo?', o:['ilusão dos sentidos','regressão infinita da justificação','autorrefutação do ceticismo','fundacionalismo'], e:'Os sentidos às vezes enganam-nos, logo não podemos confiar neles como fonte de conhecimento.' },
    { id:'m3-30', m:3, s:5, t:'mc', destaque:true, q:'O que é o desafio cético?', o:['Mostrar que temos realmente conhecimento e não apenas uma ilusão de que sabemos.','Duvidar de algumas coisas no dia a dia, como da qualidade de um restaurante, sem pôr em causa o conhecimento em geral.','A posição que defende que há crenças básicas autoevidentes e que, por isso, o conhecimento é possível.','A posição que afirma que todo o conhecimento vem da experiência sensível e que, por isso, só conhecemos o que observamos com os sentidos.'], e:'O desafio cético pergunta como podemos mostrar que sabemos mesmo o que julgamos saber.' },
    { id:'m3-31', m:3, s:5, t:'mc', destaque:true, q:'Extra dos apontamentos — “As pessoas discordam sobre quase tudo e não há forma segura de decidir quem tem razão.” Este é o argumento:', o:['da diversidade de opiniões','da ilusão dos sentidos','da regressão infinita da justificação','fundacionalista'], e:'Se não há forma segura de decidir quem tem razão, não podemos dizer que sabemos.' },
    { id:'m3-32', m:3, s:5, t:'mc', destaque:true, q:'Segundo o argumento da regressão infinita, nenhuma crença fica justificada porque:', o:['cada crença precisa de outra para a justificar, sem fim','os sentidos enganam-nos, por isso nenhuma crença é segura','as pessoas discordam sobre tudo e ninguém sabe quem tem razão','as crenças básicas são autoevidentes e não precisam de outras'], e:'A cadeia de justificações nunca termina, logo nenhuma crença fica justificada e não há conhecimento.' },
    { id:'m3-33', m:3, s:5, t:'vf', destaque:true, q:'Os enganos sensoriais e a regressão infinita da justificação são argumentos céticos.', a:true, e:'São os argumentos do esquema do manual (p. 19); o principal é a regressão infinita.' },
    { id:'m3-34', m:3, s:5, t:'vf', destaque:true, q:'A existência de crenças básicas autoevidentes é um argumento cético.', a:false, e:'É a resposta do fundacionalismo contra o ceticismo.' },
    { id:'m3-35', m:3, s:5, t:'vf', destaque:true, q:'Segundo o desafio cético, na sua forma mais radical, devemos suspender o juízo sobre todas as coisas.', a:true, e:'Como nenhum conhecimento seria possível, o cético radical suspende o juízo sobre tudo.' },
    { id:'m3-36', m:3, s:5, t:'vf', destaque:true, q:'O exemplo do pau que parece partido dentro de água ilustra o argumento da regressão infinita.', a:false, e:'Ilustra o argumento da ilusão dos sentidos.' },
    // Exercício 9 do manual (sai no teste) e treino extra
    { id:'m3-37', m:3, s:6, t:'vf', destaque:true, q:'O ceticismo radical é contraditório porque afirma saber que nada se pode saber.', a:true, e:'Ao apresentar a sua tese como verdadeira, o cético pretende saber pelo menos uma coisa: que nada se pode saber.' },
    { id:'m3-38', m:3, s:6, t:'vf', destaque:true, q:'Se a tese do cético radical fosse verdadeira, o próprio cético poderia conhecê-la.', a:false, e:'Se nada se pudesse conhecer, o cético também não poderia conhecer a sua tese. Por isso ela refuta-se a si mesma.' },
    { id:'m3-39', m:3, s:6, t:'vf', destaque:true, q:'Diz-se que o ceticismo radical é autorrefutante: refuta-se a si mesmo.', a:true, e:'A sua tese, se fosse verdadeira, não poderia ser conhecida, nem sequer pelo cético.' },
    { id:'m3-40', m:3, s:6, t:'mc', destaque:true, q:'Muitas pessoas pensam que o ceticismo radical é contraditório. Porquê?', o:['Porque, ao afirmar que nada se pode conhecer, apresenta essa tese como verdadeira: pretende saber pelo menos uma coisa.','Porque os sentidos às vezes nos enganam, e o cético confia neles para chegar à sua conclusão.','Porque só põe em causa alguns domínios do conhecimento, como a moral, mas diz que põe em causa todos.','Porque aceita que há crenças básicas autoevidentes, como defende o fundacionalismo.'], e:'O cético radical pretende saber que nada se pode saber. Se isso fosse verdade, nem ele o poderia saber: o ceticismo radical é autorrefutante.' },
    { id:'m3-41', m:3, s:2, t:'mc', destaque:true, q:'“Na religião não existe conhecimento, mas sim opiniões.” Para defender isto é preciso ser:', o:['apenas cético moderado, porque só põe em causa um domínio (a religião)','cético radical, porque põe em causa todo o conhecimento sobre a religião','fundacionalista, porque as crenças religiosas são básicas','racionalista, porque a religião não vem da experiência'], e:'Basta ser cético moderado: a dúvida limita-se ao domínio da religião.' },
    { id:'m3-42', m:3, s:5, t:'mc', destaque:true, q:'Quais são dois exemplos de enganos sensoriais?', o:['Um pau que parece partido dentro de água e uma miragem no deserto.','A diversidade de opiniões e a regressão infinita da justificação.','“2 + 2 = 4” e “Nenhum solteiro é casado”, que se sabem sem os sentidos.','O sabor da manga e o cheiro do café, que conhecemos por contacto.'], e:'Outro exemplo: a estrada parece molhada num dia de calor.' },
    { id:'m3-43', m:3, s:5, t:'vf', destaque:true, q:'A estrada parecer molhada num dia de calor é um exemplo de engano dos sentidos.', a:true, e:'Tal como a miragem no deserto ou o pau que parece partido dentro de água.' },
    { id:'m3-44', m:3, s:2, t:'vf', destaque:true, q:'Para defender que na religião não há conhecimento, só opiniões, é preciso ser cético radical.', a:false, e:'Basta ser cético moderado, porque só põe em causa o conhecimento num domínio.' },

    // Manual, pp. 15–19
    { id:'m3-45', m:3, s:2, t:'mc', q:'Diz-se que o ceticismo radical é global porque:', o:['duvida da possibilidade de todo e qualquer conhecimento','duvida só de algumas áreas, como a ética e a religião','aceita todo o conhecimento que vem dos sentidos','só fala do conhecimento sobre o mundo e o planeta Terra'], e:'Radical = global. Moderado = regional ou localizado.' },
    { id:'m3-46', m:3, s:2, t:'mc', q:'O ceticismo moderado é:', o:['regional ou localizado: duvida do conhecimento em algumas áreas, mas não noutras','global: duvida de todo e qualquer conhecimento, em todas as áreas','o mesmo que o ceticismo pirrónico, defendido por Pirro de Élis','uma forma de fundacionalismo, porque aceita crenças básicas em algumas áreas'], e:'Ex.: duvidar que haja conhecimento na Ética e na Estética, mas não na Física e na Matemática.' },
    { id:'m3-47', m:3, s:2, t:'mc', q:'Qual é o exemplo do manual de um cético moderado?', o:['Duvidar que haja conhecimento na Ética e na Estética, mas não na Física e na Matemática.','Duvidar de todo o conhecimento, em todas as áreas, e suspender o juízo sobre tudo.','Duvidar que o sushi seja saboroso, mas aceitar que outros pratos sejam bons.','Duvidar que haja conhecimento na Física e na Matemática e também na Ética.'], e:'O moderado só põe em causa certas áreas.' },
    { id:'m3-48', m:3, s:2, t:'vf', q:'Ao ceticismo radical também se chama ceticismo pirrónico.', a:true, e:'O nome vem de Pirro de Élis.' },
    { id:'m3-49', m:3, s:3, t:'vf', q:'Pirro escreveu vários livros a defender o ceticismo.', a:false, e:'Pirro não escreveu nenhum livro. As suas ideias foram apresentadas por outros céticos, como Sexto Empírico.' },
    { id:'m3-50', m:3, s:3, t:'mc', q:'Quem apresentou e desenvolveu as ideias de Pirro na obra «Hipóteses Pirrónicas»?', o:['Sexto Empírico','Francisco Sanches','Platão','Aristóteles'], e:'Sexto Empírico (c. 160–210 d.C.).' },
    { id:'m3-51', m:3, s:3, t:'mc', q:'Francisco Sanches, autor de «Que Nada se Sabe», foi:', o:['um filósofo cético, matemático e médico português','um filósofo fundacionalista grego, discípulo de Pirro','um empirista inglês do século XVIII','o autor da definição tradicional de conhecimento'], e:'Viveu c. 1551–1623.' },
    { id:'m3-52', m:3, s:3, t:'mc', q:'Segundo o manual, suspender o juízo é suspender a crença, ou seja:', o:['não acreditar nem deixar de acreditar na ideia em causa','acreditar em tudo o que nos parece verdadeiro','deixar de acreditar em tudo e considerar tudo falso','acreditar só no que é útil para alcançar a felicidade'], e:'Não se afirma que a ideia é verdadeira nem que é falsa.' },
    { id:'m3-53', m:3, s:2, t:'mc', q:'Para o ceticismo radical, aquilo a que chamamos conhecimento:', o:['não passa de uma ilusão','é sempre verdadeiro','vem só da razão','é sempre conhecimento por contacto'], e:'Não existe realmente conhecimento (manual, p. 17).' },
    { id:'m3-54', m:3, s:4, t:'mc', q:'«Se as nossas crenças não estão justificadas, então não temos conhecimento. As nossas crenças não estão justificadas. Logo, não temos conhecimento.» Que premissa os céticos pirrónicos defenderam com vários argumentos?', o:['A segunda: «As nossas crenças não estão justificadas.»','A primeira: «Se as nossas crenças não estão justificadas, então não temos conhecimento.»','A conclusão.','Nenhuma.'], e:'A 1.ª premissa é plausível. A 2.ª é defendida com a regressão infinita e os enganos sensoriais.' },
    { id:'m3-55', m:3, s:4, t:'vf', q:'O argumento «Se as nossas crenças não estão justificadas, não temos conhecimento; não estão justificadas; logo, não temos conhecimento» é válido (é um modus ponens).', a:true, e:'É válido. Para ser sólido, além de válido, o argumento tem de ter premissas verdadeiras.' },
    { id:'m3-56', m:3, s:5, t:'mc', q:'Um avião parece pequeno no céu, mas é enorme; com a mão fria, a água morna parece quente. Estes exemplos servem o argumento:', o:['dos enganos sensoriais','da regressão infinita','da diversidade de opiniões','fundacionalista'], e:'Argumento dos enganos sensoriais (ou da ilusão dos sentidos).' },
    { id:'m3-57', m:3, s:5, t:'mc', q:'Segundo o argumento dos enganos sensoriais, como os sentidos às vezes nos enganam:', o:['pode suceder que sejamos sempre enganados, e as justificações dos sentidos são inadequadas','os sentidos nunca nos enganam quando usamos mais do que um ao mesmo tempo','basta usar dois sentidos diferentes para confirmar qualquer crença','o conhecimento só pode vir da razão, e por isso a matemática é a única ciência segura'], e:'Isso compromete a justificação das nossas crenças (manual, p. 18).' },
    { id:'m3-58', m:3, s:5, t:'vf', q:'«Argumento dos enganos sensoriais» e «argumento da ilusão dos sentidos» são nomes para o mesmo argumento.', a:true, e:'O manual chama-lhe argumento dos enganos sensoriais.' },
    { id:'m3-59', m:3, s:5, t:'mc', q:'Segundo o manual, em que consiste o desafio cético?', o:['Mostrar que temos realmente conhecimento e não uma ilusão de conhecimento.','Mostrar que o sushi é saboroso, apesar das dúvidas de quem nunca o provou.','Provar que Deus existe usando apenas a razão, sem recorrer aos sentidos.','Mostrar que há conhecimento a priori com informação sobre o mundo exterior.'], e:'Como quase todos achamos que sabemos, o ceticismo desafia-nos a prová-lo (p. 18).' },
    { id:'m3-60', m:3, s:6, t:'vf', q:'Para pensar e dizer que o conhecimento não é possível, é preciso conhecer várias coisas, como o significado das palavras e algumas regras de gramática.', a:true, e:'É a segunda parte da objeção do manual: o ceticismo radical autorrefuta-se.' },
    { id:'m3-61', m:3, s:0, t:'mc', q:'Acreditamos que o mundo exterior e as outras pessoas são reais. Que problema levanta o manual?', o:['Como justificar essa crença; se não a justificarmos, não é conhecimento, mesmo que seja verdadeira.','Essa crença é falsa, porque o mundo exterior e as outras pessoas são só ilusões dos sentidos.','Essa crença é conhecida a priori, por isso não precisa de qualquer justificação dos sentidos.','Essa crença é conhecimento prático, porque sabemos lidar com as pessoas.'], e:'É assim que o manual apresenta o problema da possibilidade do conhecimento (p. 15).' },
    { id:'m3-62', m:3, s:4, t:'vf', q:'Uma crença verdadeira que não conseguimos justificar é conhecimento.', a:false, e:'Sem justificação não há conhecimento, mesmo que a crença seja verdadeira.' },
    { id:'m3-63', m:3, s:6, t:'mc', q:'Segundo o esquema do manual, o ceticismo radical tem como tese, argumentos e objeção:', o:['Tese: o conhecimento não é possível. Argumentos: enganos sensoriais e regressão infinita. Objeção: é contraditório.','Tese: há crenças básicas autoevidentes. Argumento: a regressão infinita. Objeção: o argumento é inválido.','Tese: o conhecimento vem da razão. Argumentos: a calculadora e a Lua. Objeção: é a posteriori.','Tese: só há conhecimento prático. Argumentos: a Alice e o sushi. Objeção: é a priori.'], e:'Esquema da p. 19 do manual.' },
    /* ---------- Mundo 4 · Regressão infinita e fundacionalismo ---------- */
    { id:'m4-01', m:4, s:1, t:'mc', q:'O argumento da regressão infinita conclui que:', o:['não há conhecimento','há crenças básicas','os sentidos enganam','o conhecimento vem da razão'], e:'Conclusão: “Logo, não há conhecimento.”' },
    { id:'m4-02', m:4, s:1, t:'mc', q:'O argumento da regressão infinita é:', o:['válido','inválido','uma definição','uma crença básica'], e:'É válido: se as premissas forem verdadeiras, a conclusão também é.' },
    { id:'m4-03', m:4, s:2, t:'mc', q:'O fundacionalismo rejeita a:', o:['premissa 1','premissa 2','premissa 3','premissa 4'], e:'Rejeita a premissa 1: nem todas as crenças se justificam com base noutras.' },
    { id:'m4-04', m:4, s:2, t:'mc', q:'As crenças básicas são:', o:['autoevidentes','inferidas de outras crenças','sempre falsas','opiniões pessoais'], e:'Crenças básicas: autoevidentes, justificam-se a si mesmas.' },
    { id:'m4-05', m:4, s:1, t:'mc', q:'A premissa 1 do argumento diz que:', o:['as nossas crenças justificam-se com base noutras crenças','não há conhecimento, porque nenhuma crença está justificada','nunca temos crenças justificadas, porque a cadeia não acaba','há crenças básicas que se justificam a si mesmas'], e:'P1: “As nossas crenças justificam-se com base noutras crenças.”' },
    { id:'m4-06', m:4, s:1, t:'mc', q:'Quem não aceita a conclusão de um argumento válido tem de:', o:['rejeitar pelo menos uma premissa','aceitar a conclusão, mesmo sem querer','rejeitar todas as premissas ao mesmo tempo','ignorar o argumento'], e:'Num argumento válido, premissas verdadeiras garantem a conclusão. Para a recusar, é preciso rejeitar uma premissa.' },
    { id:'m4-07', m:4, s:1, t:'mc', q:'Um argumento é válido quando:', o:['se as premissas forem verdadeiras, a conclusão também é','as premissas são todas verdadeiras e estão bem justificadas pelos factos','a conclusão é verdadeira, mesmo que as premissas sejam falsas','toda a gente concorda com ele depois de o ouvir'], e:'Validade: é impossível as premissas serem verdadeiras e a conclusão falsa.' },
    { id:'m4-08', m:4, s:1, t:'mc', q:'A premissa 4 (“Se nunca temos crenças justificadas, não há conhecimento”) liga-se à definição tradicional porque:', o:['sem justificação não há conhecimento','o conhecimento é só uma crença verdadeira','a verdade não importa para o conhecimento','as crenças básicas não existem'], e:'A justificação é condição necessária do conhecimento.' },
    { id:'m4-09', m:4, s:0, t:'mc', q:'A criança na idade dos “porquês” ilustra que:', o:['podemos sempre pedir justificação para cada crença','as crianças sabem tudo e não precisam de justificação','há crenças autoevidentes que não precisam de razões','a sopa faz bem porque os pais o dizem'], e:'A cada resposta podemos perguntar “porquê?”, e a cadeia de justificações não acaba.' },
    { id:'m4-10', m:4, s:0, t:'mc', q:'Responder “Porque sim!” a um “porquê?”:', o:['não justifica nada, só mostra que a pessoa desistiu','é uma crença básica, que se justifica a si mesma','é uma justificação a priori, que não precisa da experiência','acaba com o ceticismo, porque termina a cadeia de porquês'], e:'“Porque sim” não é justificação.' },
    { id:'m4-11', m:4, s:2, t:'mc', q:'As crenças não-básicas:', o:['são inferidas a partir de outras crenças','são autoevidentes e não precisam de outras','justificam-se a si mesmas, como as fundações','são sempre falsas, porque dependem de outras'], e:'Não-básicas: não são autoevidentes; apoiam-se noutras crenças.' },
    { id:'m4-12', m:4, s:2, t:'mc', q:'Na metáfora do edifício, as crenças básicas correspondem:', o:['às fundações (alicerces)','ao telhado, que fica por cima','às janelas e às portas','aos andares de cima'], e:'As fundações sustentam o edifício sem serem sustentadas por ele.' },
    { id:'m4-13', m:4, s:2, t:'mc', q:'Para o fundacionalismo, a cadeia de justificação:', o:['termina nas crenças básicas','é infinita','não tem começo','depende da opinião de cada um'], e:'Termina nas crenças básicas, logo não há regressão infinita.' },
    { id:'m4-14', m:4, s:2, t:'mc', q:'Das premissas 1 a 4, quais são falsas para o fundacionalismo?', o:['apenas a 1','a 1 e a 2','todas','apenas a 4'], e:'Exercício do manual: para o fundacionalismo apenas a premissa 1 é falsa.' },
    { id:'m4-15', m:4, s:0, t:'mc', q:'Segundo o cético, porque é que a justificação forma uma cadeia sem fim?', o:['cada justificação é outra crença, que também precisa de justificação','porque os sentidos nos enganam e temos de verificar tudo outra vez','porque as pessoas discordam e pedem sempre mais razões umas às outras','porque a razão é infalível e consegue justificar tudo até ao infinito'], e:'Cada crença que justifica precisa, por sua vez, de ser justificada.' },
    { id:'m4-16', m:4, s:1, t:'vf', q:'Se o argumento cético é válido e não aceitamos a conclusão, temos de rejeitar pelo menos uma premissa.', a:true, e:'É o que significa ser válido.' },
    { id:'m4-17', m:4, s:2, t:'vf', q:'Para o fundacionalismo, as premissas 2, 3 e 4 podem ser aceites.', a:true, e:'O fundacionalismo só rejeita a premissa 1.' },
    { id:'m4-18', m:4, s:2, t:'vf', q:'As crenças não-básicas justificam-se com base noutras crenças.', a:true, e:'São inferidas a partir de outras crenças.' },
    { id:'m4-19', m:4, s:2, t:'vf', q:'O fundacionalismo rejeita a premissa 4.', a:false, e:'Rejeita a premissa 1. A 4 até se liga à definição tradicional.' },
    { id:'m4-20', m:4, s:2, t:'vf', q:'As crenças básicas precisam de outras crenças para estarem justificadas.', a:false, e:'São autoevidentes: justificam-se a si mesmas.' },
    { id:'m4-21', m:4, s:1, t:'vf', q:'O argumento cético da regressão infinita é inválido.', a:false, e:'É válido. Por isso, quem recusa a conclusão tem de rejeitar uma premissa.' },
    { id:'m4-22', m:4, s:2, t:'completa', q:'O fundacionalismo rejeita a premissa ___.', o:['1','2','3','4'], e:'Premissa 1: nem todas as crenças se justificam com base noutras.' },
    { id:'m4-23', m:4, s:2, t:'completa', q:'As crenças básicas são ___: justificam-se a si mesmas.', o:['autoevidentes','inferidas','contraditórias','duvidosas'], e:'Crenças básicas = autoevidentes.' },
    { id:'m4-25', m:4, s:0, t:'mc', destaque:true, q:'“A justificação da crença A é a crença B, a de B é a crença C, e assim sucessivamente.” Que dificuldade levanta esta situação?', o:['A regressão infinita da justificação: a cadeia nunca termina, logo nenhuma crença fica justificada e não há conhecimento.','A ilusão dos sentidos: como os sentidos às vezes nos enganam, podemos ser sempre enganados.','A diversidade de opiniões: as pessoas discordam sobre quase tudo e ninguém sabe quem tem razão.','A autorrefutação do ceticismo: o cético afirma saber que nada se pode saber.'], e:'Sem justificação não há conhecimento, porque a justificação é condição necessária.' },
    { id:'m4-24', m:4, s:1, t:'completa', q:'A conclusão do argumento da regressão infinita é: “Logo, não há ___.”', o:['conhecimento','crenças','premissas','argumentos válidos'], e:'Conclusão: “Logo, não há conhecimento.”' },

    { id:'m4-26', m:4, s:0, t:'mc', q:'Segundo Sexto Empírico, qual é a consequência da regressão infinita da justificação?', o:['A suspensão do juízo, porque não temos um ponto de partida para o raciocínio.','Que há crenças básicas que servem de ponto de partida para o raciocínio.','Que os sentidos nos enganam e por isso devemos confiar só na razão.','Que o conhecimento vem da razão e não da experiência.'], e:'Cada demonstração precisa de ser demonstrada, até ao infinito (manual, p. 17).' },
    { id:'m4-27', m:4, s:2, t:'mc', q:'Para os fundacionalistas, o que distingue as crenças básicas das não-básicas?', o:['As básicas são autoevidentes e justificam-se a si mesmas; as não-básicas são inferidas de outras crenças.','As básicas são falsas e as não-básicas verdadeiras, porque estas têm mais justificação.','As básicas vêm dos livros e dos professores; as não-básicas vêm da nossa experiência pessoal.','As básicas são inferidas de outras crenças; as não-básicas são autoevidentes e justificam-se a si mesmas.'], e:'É a pergunta 2 da revisão da ficha (p. 18).' },
    /* ---------- Mundo 5 · Origem do conhecimento (sai no teste) ---------- */
    { id:'m5-01', m:5, s:0, t:'mc', q:'“O conhecimento provém da razão ou da experiência?” formula o problema da:', o:['origem','definição','possibilidade','justificação moral'], e:'Problema da origem: qual é a fonte do conhecimento?' },
    { id:'m5-02', m:5, s:0, t:'mc', q:'Qual das frases identifica corretamente o problema da origem do conhecimento?', o:['Saber qual é a fonte do conhecimento: a razão, independentemente da experiência, ou a experiência sensível.','Saber se é possível conhecer alguma coisa ou se devemos suspender o juízo sobre tudo, como Pirro.','Saber o que é conhecer, isto é, quais são as condições necessárias e suficientes do conhecimento.','Saber se temos crenças justificadas ou se caímos numa regressão infinita sempre que tentamos justificá-las.'], e:'Resposta-modelo: o problema da origem consiste em saber qual é a fonte do nosso conhecimento.' },
    { id:'m5-03', m:5, s:1, t:'mc', q:'Para os racionalistas, as crenças básicas vêm:', o:['da razão','da experiência','da autoridade','de outras crenças'], e:'Racionalismo: a principal fonte é a razão; as crenças básicas são conhecidas a priori.' },
    { id:'m5-04', m:5, s:1, t:'mc', q:'Para os empiristas, as crenças básicas vêm:', o:['da experiência sensível','da razão, independentemente da experiência','de Deus','de outras crenças'], e:'Empirismo: a principal fonte é a experiência; as crenças básicas são a posteriori.' },
    { id:'m5-05', m:5, s:2, t:'mc', q:'É conhecida a priori:', o:['Nenhum irmão é filho único.','O céu é azul.','Alguns irmãos são competitivos.','A água é H2O.'], e:'Um irmão filho único é contraditório: sabe-se só pelo pensamento.' },
    { id:'m5-06', m:5, s:2, t:'mc', q:'“A forma do planeta Terra é aproximadamente esférica” é conhecida:', o:['a posteriori','a priori','por contacto','como crença básica racional'], e:'Foi preciso observar a Terra. Só a definição de esfera é a priori.' },
    { id:'m5-07', m:5, s:2, t:'mc', q:'A matemática e a lógica são áreas de conhecimento:', o:['a priori','a posteriori','prático','por contacto'], e:'A priori: matemática, lógica, geometria.' },
    { id:'m5-08', m:5, s:1, t:'mc', q:'A palavra “empirismo” vem do grego “empeiria”, que significa:', o:['experiência','razão','conhecimento','dúvida'], e:'Empeiria = experiência.' },
    { id:'m5-09', m:5, s:2, t:'mc', q:'O conhecimento a priori é aquele que:', o:['pode ser conhecido independentemente da experiência, só pelo pensamento','só pode ser conhecido através da experiência, observando o mundo','é conhecido por contacto, diretamente através dos sentidos','é sempre sobre o mundo físico e precisa de observação'], e:'A priori: independente da experiência.' },
    { id:'m5-10', m:5, s:2, t:'mc', q:'O conhecimento a posteriori é aquele que:', o:['só pode ser conhecido através da experiência','pode ser conhecido só pelo pensamento, sem observar','é sempre falso, porque os sentidos enganam','não precisa de justificação, porque é observado'], e:'A posteriori: é preciso olhar para o mundo.' },
    { id:'m5-11', m:5, s:2, t:'mc', q:'Física, química, biologia, história e geografia são áreas de conhecimento:', o:['a posteriori','a priori','prático','por contacto'], e:'Todas dependem da observação do mundo.' },
    { id:'m5-12', m:5, s:3, t:'mc', q:'O Rui sabe que 2 + 2 = 4 porque viu numa calculadora. Esse conhecimento é:', o:['a priori, porque podia saber-se só pelo pensamento','a posteriori, porque usou a calculadora','prático, porque sabe usar a calculadora','por contacto, porque viu o resultado com os olhos'], e:'Armadilha: o que conta é se PODIA saber-se só pelo pensamento.' },
    { id:'m5-13', m:5, s:3, t:'mc', q:'Para saber que “Nenhum solteiro é casado”, a experiência é precisa para:', o:['aprender os conceitos, mas não para saber que a frase é verdadeira','observar todos os solteiros e confirmar que nenhum é casado','perguntar a cada solteiro se é casado e registar todas as respostas num caderno','nada: nem para aprender os conceitos de solteiro e de casado é precisa'], e:'Precisamos de experiência para aprender o que é “solteiro”, mas não para saber que a frase é verdadeira.' },
    { id:'m5-14', m:5, s:2, t:'mc', q:'“Pode haver conhecimento a priori com informação sobre o mundo?” Os racionalistas respondem:', o:['sim','não','só na história','só por contacto'], e:'Racionalistas: sim. Empiristas: não.' },
    { id:'m5-15', m:5, s:2, t:'mc', q:'Para os empiristas, o conhecimento a priori:', o:['só diz respeito a relações entre ideias e não informa sobre o mundo','é a principal fonte de conhecimento sobre o mundo e sobre as coisas','é impossível, mesmo na matemática e na lógica','vem dos sentidos, tal como todo o conhecimento a posteriori'], e:'Empiristas: o a priori não nos diz como é o mundo.' },
    { id:'m5-16', m:5, s:1, t:'mc', q:'Que relação há entre o fundacionalismo e o problema da origem?', o:['O fundacionalismo diz que há crenças básicas; o problema da origem pergunta de onde vêm','Nenhuma: são problemas diferentes que não têm qualquer ligação entre si','O problema da origem prova que não há crenças básicas, ao contrário do fundacionalismo','O fundacionalismo é uma forma de ceticismo sobre as crenças básicas'], e:'Há fundacionalistas racionalistas e fundacionalistas empiristas.' },
    { id:'m5-17', m:5, s:2, t:'mc', q:'Truque: se o contrário de uma frase pudesse ser verdade sem contradição, a frase é conhecida:', o:['a posteriori','a priori','por contacto','como crença básica'], e:'Os ursos polares podiam ser castanhos sem contradição → a posteriori.' },
    { id:'m5-18', m:5, s:3, t:'vf', q:'Saber 2 + 2 = 4 através de uma calculadora torna esse conhecimento a posteriori.', a:false, e:'Continua a ser a priori, porque podia saber-se só pelo pensamento.' },
    { id:'m5-19', m:5, s:1, t:'vf', q:'Há fundacionalistas racionalistas e fundacionalistas empiristas.', a:true, e:'Discordam sobre de onde vêm as crenças básicas: da razão ou da experiência.' },
    { id:'m5-20', m:5, s:3, t:'vf', q:'“Os solteiros não são casados” diz-nos se existe algum solteiro.', a:false, e:'É a priori, mas não informa se há solteiros no mundo.' },
    { id:'m5-21', m:5, s:3, t:'vf', q:'A definição de esfera é a priori, mas “A Terra é aproximadamente esférica” é a posteriori.', a:true, e:'Saber a forma da Terra exige observação.' },
    { id:'m5-22', m:5, s:2, t:'vf', q:'Para os empiristas, as crenças básicas são conhecidas a priori.', a:false, e:'Para os empiristas são a posteriori (vêm da experiência). Para os racionalistas são a priori.' },
    { id:'m5-23', m:5, s:0, t:'completa', q:'O problema da origem pergunta se o conhecimento provém da razão ou da ___.', o:['experiência','autoridade','revelação divina','tradição'], e:'Razão ou experiência: é esta a pergunta do problema da origem.' },
    { id:'m5-24', m:5, s:2, t:'completa', q:'Para os racionalistas, as crenças básicas são conhecidas ___.', o:['a priori','a posteriori','por contacto','por palpite'], e:'Racionalismo → a priori.' },
    { id:'m5-25', m:5, s:2, t:'completa', q:'A matemática, a lógica e a geometria são áreas de conhecimento ___.', o:['a priori','a posteriori','prático','por contacto'], e:'Sabem-se só pelo pensamento.' },
    { id:'m5-26', m:5, s:2, t:'mc', destaque:true, q:'“A Maria tem o cabelo castanho” é conhecida:', o:['a posteriori: só se sabe olhando para ela','a priori: basta compreender os conceitos de cabelo e de cor','a priori: é uma verdade da lógica e da matemática','por contacto, e por isso a priori'], e:'O contrário podia ser verdade sem contradição: a Maria podia ser loura.' },
    { id:'m5-27', m:5, s:2, t:'mc', destaque:true, q:'“As esferas não têm arestas” é conhecida:', o:['a priori: basta compreender o conceito de esfera','a posteriori: é preciso observar várias esferas e as suas superfícies','a posteriori: é uma verdade da física, que se testa em laboratório','por contacto, porque já vimos esferas'], e:'Uma esfera com arestas seria contraditória.' },
    { id:'m5-28', m:5, s:2, t:'vf', destaque:true, q:'“A Maria tem o cabelo castanho” é conhecida a priori.', a:false, e:'É a posteriori: só se sabe olhando para ela.' },
    { id:'m5-29', m:5, s:2, t:'vf', destaque:true, q:'“As esferas não têm arestas” é conhecida a priori.', a:true, e:'Basta compreender o conceito de esfera.' },
    // Manual, p. 14
    { id:'m5-30', m:5, s:2, t:'mc', q:'«A posteriori» significa:', o:['posterior à experiência','anterior à experiência','independente da razão','sem qualquer justificação'], e:'Só pode ser adquirido através da experiência.' },
    { id:'m5-31', m:5, s:2, t:'mc', q:'«A priori» significa:', o:['anterior à experiência','posterior à experiência','através dos sentidos','por contacto'], e:'Pode ser adquirido pensando, sem recorrer à experiência.' },
    { id:'m5-32', m:5, s:2, t:'mc', q:'O conhecimento a posteriori também se chama:', o:['conhecimento empírico','conhecimento racional','conhecimento prático','conhecimento por contacto'], e:'De «empeiría», palavra grega para experiência.' },
    { id:'m5-33', m:5, s:2, t:'mc', q:'Qual destas proposições é conhecida a priori?', o:['Tudo o que é verde é colorido.','As baleias são mamíferos marinhos.','A Suíça é um país europeu.','As avestruzes não voam.'], e:'Basta pensar nos conceitos de verde e de colorido.' },
    { id:'m5-34', m:5, s:2, t:'mc', q:'Qual destas proposições é conhecida a posteriori?', o:['A segunda maior cidade portuguesa é o Porto.','O todo é maior do que a parte.','Duas coisas iguais a uma terceira são iguais entre si.','723 + 168 = 891'], e:'É preciso observar o mundo para o saber.' },
    { id:'m5-35', m:5, s:2, t:'mc', q:'Segundo o manual, o conhecimento proposicional pode adquirir-se de duas maneiras:', o:['pelo pensamento (a priori) e pela experiência (a posteriori)','pela razão e pela fé religiosa, que são as duas fontes do conhecimento','pelos livros e pela escola, onde se aprende quase tudo','pela crença e pela dúvida, como defendia Pirro de Élis'], e:'As duas modalidades de conhecimento proposicional (p. 14).' },
    { id:'m5-36', m:5, s:2, t:'vf', q:'Para saber que o dobro de 30 é metade de 120 é preciso usar a máquina de calcular.', a:false, e:'Basta pensar um pouco e fazer a conta mentalmente: é a priori.' },
    { id:'m5-37', m:5, s:2, t:'vf', q:'Saber algo a priori é apenas recordar experiências feitas na infância.', a:false, e:'Posso nunca ter somado 99 + 98 e saber a priori que dá 197.' },
    { id:'m5-38', m:5, s:2, t:'vf', q:'O conhecimento a priori pode ser obtido pelo pensamento, mas a experiência também permite essa aquisição.', a:true, e:'Ex.: ver um resultado na calculadora. Continua a ser a priori, porque podia saber-se só a pensar.' },
    { id:'m5-39', m:5, s:2, t:'vf', q:'«Em Portugal o ensino secundário termina no 12.º ano» é conhecido a priori.', a:false, e:'É a posteriori: é preciso informação sobre o mundo.' }
  ],

    condicoes: {

      porque:{ sabe:'Tem as três condições: acredita, é verdade e tem boas razões.', cr:'Falta a crença: não acredita, por isso não sabe, mesmo sendo verdade e havendo boas razões.', ve:'Falta a verdade: é falso, e não se pode saber o que é falso, mesmo acreditando e tendo razões.', ju:'Falta a justificação: acredita e é verdade, mas foi sorte ou as razões não prestam.' },
      itens:[
        {x:'O Carlos leu numa revista médica que o álcool em excesso provoca cirroses, mas pensou que era falso.', c:'cr', e:'Exemplo do manual: é verdade e havia boas razões, mas o Carlos não acredita.'},
        {x:'Há muito tempo, as pessoas tinham razões para acreditar que a Terra era plana, e acreditavam nisso.', c:'ve', e:'Exemplo do manual: acreditavam e tinham razões, mas era falso, por isso ninguém sabia.'},
        {x:'A Teresa acredita que a Terra é maior do que a Lua porque ouviu dizer que o tamanho dos nomes exprime o tamanho das coisas.', c:'ju', e:'Exemplo do manual: acredita e é verdade, mas a razão não presta; acertou por sorte.'},
        {x:'A Luísa acredita, por estudos científicos que leu, que o albinismo tem causa genética.', c:'sabe', e:'Exemplo do manual: acredita, é verdade e tem boas razões.'},
        {x:'O Rui acredita que amanhã há teste de Filosofia porque a professora o disse na aula e o escreveu no sumário. E há mesmo teste.', c:'sabe'},
        {x:'A Inês acredita que o autocarro passa às 8h porque viu o horário na paragem. Mas o horário mudou ontem e o autocarro agora passa às 8h15.', c:'ve', e:'Tinha uma boa razão e acreditava, mas a crença é falsa.'},
        {x:'O Tiago acha que a resposta certa é a B só porque gosta da letra B. E a B está mesmo certa.', c:'ju', e:'Acredita e é verdade, mas gostar da letra não é uma razão: foi sorte.'},
        {x:'A Marta olha pela janela, vê a chuva a cair e acredita que está a chover. Está mesmo a chover.', c:'sabe'},
        {x:'O Pedro leu num livro de ciências que o Sol é uma estrela, mas acha que é mentira e não acredita.', c:'cr', e:'É verdade e o livro é uma boa razão, mas o Pedro não acredita.'},
        {x:'O João acredita que vai chover amanhã só porque lhe apetece. E no dia seguinte chove.', c:'ju', e:'Acredita e é verdade, mas «porque me apetece» não é uma razão: é um palpite.'}
      ]
    },

  /* Cartões de estudo. aberta:true = pergunta de resposta aberta (estilo teste) */
  cartoes: [
    { id:'c01', m:3, aberta:true, frente:'Formula o problema da possibilidade do conhecimento.', verso:'O problema da possibilidade do conhecimento consiste em saber se é possível conhecermos alguma coisa, isto é, se temos crenças justificadas. Formula-se assim: “Será possível conhecer alguma coisa?” ou “Será que temos crenças justificadas?”', exemplo:'O cético radical responde que não: nenhum conhecimento é possível.' },
    { id:'c02', m:5, aberta:true, frente:'Identifica o problema da origem do conhecimento.', verso:'O problema da origem do conhecimento consiste em saber qual é a fonte do nosso conhecimento: se é a razão, independentemente da experiência, ou a experiência sensível.', exemplo:'Racionalistas: a fonte principal é a razão. Empiristas: é a experiência.' },
    { id:'c03', m:3, aberta:true, frente:'Distingue ceticismo radical de ceticismo moderado, com um exemplo.', verso:'O ceticismo radical põe em causa toda e qualquer espécie de conhecimento. O ceticismo moderado limita-se a certos tipos ou domínios de conhecimento.', exemplo:'Radical: Pirro de Élis, que defende suspender o juízo sobre tudo. Moderado: quem diz que não podemos saber se Deus existe, mas aceita a ciência.' },
    { id:'c04', m:4, aberta:true, frente:'Apresenta o argumento cético da regressão infinita.', verso:'1. As nossas crenças justificam-se com base noutras crenças.\n2. Se as nossas crenças se justificam com base noutras crenças, então sempre que tentamos justificar uma crença caímos numa regressão infinita da justificação.\n3. Se sempre que tentamos justificar uma crença caímos numa regressão infinita, então nunca temos crenças justificadas.\n4. Se nunca temos crenças justificadas, não há conhecimento.\n5. Logo, não há conhecimento.', exemplo:'Como a criança dos “porquês”: cada justificação precisa de outra justificação, sem fim.' },
    { id:'c05', m:4, aberta:true, frente:'Explica como o fundacionalismo responde ao ceticismo.', verso:'O argumento cético é válido, por isso, para recusar a conclusão, é preciso rejeitar uma premissa. O fundacionalismo rejeita a premissa 1: nem todas as crenças se justificam com base noutras. Há crenças básicas, autoevidentes, que se justificam a si mesmas. A cadeia de justificação termina nelas, logo não há regressão infinita.', exemplo:'Tal como as fundações sustentam um edifício sem serem sustentadas por ele.' },
    { id:'c06', m:4, aberta:true, frente:'Distingue crenças básicas de crenças não-básicas.', verso:'Crenças básicas (fundacionais): são autoevidentes, justificam-se a si mesmas e não precisam de outras crenças. Crenças não-básicas: não são autoevidentes e são inferidas a partir de outras crenças.', exemplo:'Básicas = alicerces do edifício; não-básicas = os andares construídos por cima.' },
    { id:'c07', m:3, aberta:true, frente:'Apresenta uma objeção ao ceticismo.', verso:'O ceticismo radical autorrefuta-se: ao afirmar que nada se pode conhecer, o cético afirma saber pelo menos uma coisa. Além disso, se nenhuma crença está justificada, as premissas do argumento cético também não estão.', exemplo:'“Sei que nada se sabe” contradiz-se a si mesma.' },
    { id:'c08', m:5, aberta:true, frente:'Distingue conhecimento a priori de a posteriori, com exemplos.', verso:'A priori: pode ser conhecido independentemente da experiência, só pelo pensamento (matemática, lógica, geometria). A posteriori: só pode ser conhecido através da experiência, olhando para o mundo (física, química, biologia, história, geografia).', exemplo:'A priori: “Nenhum solteiro é casado”. A posteriori: “Os ursos polares são brancos”.' },
    { id:'c09', m:1, aberta:false, frente:'Epistemologia', verso:'Área da filosofia que estuda o conhecimento (teoria do conhecimento). Do grego epistéme (conhecimento) + logos (estudo).', exemplo:'Problemas: definição, possibilidade e origem do conhecimento.' },
    { id:'c10', m:1, aberta:false, frente:'Os três problemas da epistemologia', verso:'Definição: “O que é conhecer?”\nPossibilidade: “Será possível conhecer alguma coisa?”\nOrigem: “O conhecimento provém da razão ou da experiência?”', exemplo:'Saem no teste: possibilidade e origem.' },
    { id:'c11', m:1, aberta:false, frente:'Definição tradicional de conhecimento', verso:'Crença verdadeira justificada (Platão, Teeteto). S sabe que P se e só se: S acredita que P; P é verdadeira; S tem justificação para acreditar que P.', exemplo:'O João acerta na chuva por palpite: crença verdadeira, não justificada → não sabe.' },
    { id:'c12', m:1, aberta:false, frente:'Condições do conhecimento: necessária vs. suficiente', verso:'São as condições para alguém SABER alguma coisa (para haver conhecimento): crença, verdade e justificação. Cada uma é necessária e as três são conjuntamente suficientes (como bilhete + documento + idade para entrar num concerto).\nNecessária = obrigatória («sem isto, não»): se faltar, não há conhecimento, mas sozinha pode não chegar.\nSuficiente = chega sozinha («com isto, sim, de certeza»): se estiver presente, há conhecimento.\nExemplo: ser animal é necessário para ser cão (mas não chega); ser cão é suficiente para ser animal.', exemplo:'Na definição tradicional, cada condição é necessária e as três juntas seriam suficientes.' },
    { id:'c13', m:2, aberta:false, frente:'Conhecimento proposicional', verso:'Saber-que: saber que uma proposição é verdadeira. Também se chama conhecimento factual. É o que a epistemologia mais estuda.', exemplo:'“Sei que Lisboa é a capital de Portugal.”' },
    { id:'c14', m:2, aberta:false, frente:'Conhecimento prático', verso:'Saber-fazer: ter uma competência.', exemplo:'“Sei andar de bicicleta”, “Sei nadar”, “Sei tocar guitarra”.' },
    { id:'c15', m:2, aberta:false, frente:'Conhecimento por contacto', verso:'Familiaridade: conhecer diretamente pessoas, lugares ou coisas.', exemplo:'“Conheço o Porto”, “Conheço a Maria”, “Conheço o sabor da manga”.' },
    { id:'c16', m:2, aberta:false, frente:'Proposição', verso:'Pensamento expresso por uma frase declarativa, que pode ser verdadeiro ou falso. Atenção: escreve-se “proposicional”, não “proporcional”.', exemplo:'“O céu é azul” exprime uma proposição; “Fecha a porta!” não.' },
    { id:'c17', m:3, aberta:false, frente:'Cético no uso comum vs. em filosofia', verso:'No uso comum, cético é quem duvida. Em filosofia, o cético põe em causa a possibilidade do conhecimento.', exemplo:'Para ser cético quanto ao sushi, teria de acreditar que não é de todo possível saber se o sushi é saboroso.' },
    { id:'c18', m:3, aberta:false, frente:'Pirro de Élis', verso:'Grécia Antiga, c. 360–270 a.C. (a ficha diz c. 365). O mais antigo e radical cético. Como nunca podemos saber como as coisas realmente são, devemos suspender o juízo sobre tudo.', exemplo:'Assim libertamo-nos dos desejos e alcançamos a paz de espírito, para sermos felizes.' },
    { id:'c19', m:3, aberta:false, frente:'Argumentos céticos', verso:'Dois argumentos do esquema do manual:\n1. Enganos sensoriais: os sentidos às vezes enganam-nos.\n2. Regressão infinita: cada crença precisaria de outra justificação, sem fim.\n\nExtra dos apontamentos: diversidade de opiniões; estuda se foi abordada nas aulas.', exemplo:'Um pau dentro de água parece torto: ilusão dos sentidos.' },
    { id:'c20', m:4, aberta:false, frente:'Validade do argumento da regressão', verso:'O argumento é válido: se as premissas forem verdadeiras, a conclusão também é. Quem não aceita a conclusão tem de rejeitar pelo menos uma premissa.', exemplo:'A premissa 4 liga-se à definição tradicional: sem justificação não há conhecimento.' },
    { id:'c21', m:5, aberta:false, frente:'Racionalismo', verso:'A principal fonte do conhecimento é a razão. As crenças básicas são conhecidas a priori. É possível conhecimento a priori sobre o mundo.', exemplo:'Debate: pode haver conhecimento a priori com informação sobre o mundo? Racionalistas: sim.' },
    { id:'c22', m:5, aberta:false, frente:'Empirismo', verso:'A principal fonte do conhecimento é a experiência sensível (do grego empeiria). As crenças básicas são conhecidas a posteriori. O a priori só diz respeito a relações entre ideias.', exemplo:'Debate: pode haver conhecimento a priori com informação sobre o mundo? Empiristas: não.' },
    { id:'c23', m:5, aberta:false, frente:'Truque para a priori / a posteriori', verso:'Pergunta: “O contrário podia ser verdade sem contradição?”\nSe sim → a posteriori. Se não → a priori.', exemplo:'Os ursos podiam ser castanhos → a posteriori. Um solteiro casado é contraditório → a priori.' },
    { id:'c24', m:5, aberta:false, frente:'Armadilhas do a priori', verso:'Saber 2 + 2 = 4 numa calculadora continua a ser a priori, porque podia saber-se só pelo pensamento. Precisamos de experiência para aprender os conceitos, mas não para saber que a frase é verdadeira.', exemplo:'A definição de esfera é a priori; “A Terra é aproximadamente esférica” é a posteriori.' },
    { id:'c25', m:1, aberta:true, frente:'A Manuela pergunta quanto dá 356 euros a dividir por 4. O Eurico usa a calculadora e diz que ela “sabe” que dá 89 euros. A calculadora sabe?', verso:'Não. Segundo a definição tradicional, saber implica ter uma crença, que é um estado mental. A calculadora não tem estados mentais nem crenças; dá o resultado certo apenas porque foi programada. Logo, não tem conhecimento.', exemplo:'A resposta é verdadeira, mas falta a condição da crença.' },
    { id:'c26', m:3, aberta:true, frente:'O que é o desafio cético?', verso:'É o desafio de mostrar que temos realmente conhecimento e não apenas a ilusão de que sabemos. Surge porque o cético radical põe em causa se as nossas crenças estão justificadas.', exemplo:'Como podemos mostrar que o mundo exterior é real e não uma ilusão?' },
    { id:'c27', m:3, aberta:true, frente:'Apresenta os argumentos céticos principais.', verso:'1. Enganos sensoriais (ilusão dos sentidos): os sentidos às vezes enganam-nos, logo não podemos confiar neles como fonte de conhecimento.\n2. Regressão infinita da justificação: cada crença precisa de outra para a justificar, sem fim; segundo o cético, assim nenhuma crença fica justificada e não há conhecimento.\n\nExtra dos apontamentos: diversidade de opiniões; inclui-a se foi abordada nas aulas.', exemplo:'Um pau parece partido dentro de água: ilusão dos sentidos.' },
    { id:'c28', m:1, aberta:false, frente:'Relação entre crença e conhecimento', verso:'Todo o conhecimento é uma crença, mas nem todas as crenças são conhecimento.', exemplo:'“Acredito em extraterrestres” é uma crença, mas não é saber que existem.' },
    { id:'c29', m:1, aberta:true, frente:'Explica porque é que cada condição da definição tradicional é necessária, mas nenhuma é suficiente sozinha.', verso:'Crença: é contraditório dizer “sei que o mar tem ondas, mas não acredito nisso”. Mas a crença não basta: “acredito em extraterrestres” não é saber que existem.\nVerdade: só se sabe o que é verdadeiro (o conhecimento é factivo).\nJustificação: não basta, porque podemos ter boas razões para acreditar em algo falso.\nCrença verdadeira: não basta, porque pode ser verdadeira por acaso (um palpite); o conhecimento tem de estar apoiado em boas razões.', exemplo:'Na Antiguidade havia razões para acreditar que a Terra era plana, e não é.' },
    { id:'c30', m:3, aberta:true, frente:'Muitas pessoas pensam que o ceticismo radical é contraditório. Porquê? (Exercício 9, sai no teste)', verso:'O cético radical defende que não é possível conhecer nada. Mas, ao afirmar isso, está a apresentar a sua tese como verdadeira, ou seja, pretende saber pelo menos uma coisa: que nada se pode saber. Se a tese fosse verdadeira, o próprio cético não a poderia conhecer. Por isso, o ceticismo radical refuta-se a si mesmo (é autorrefutante).', exemplo:'“Sei que nada se pode saber” contradiz-se.' },
    { id:'c31', m:2, aberta:true, frente:'Indica o tipo de conhecimento atribuído ao sujeito (Exercício 1, sai no teste):\nA. A Julieta sabe preparar batidos de frutas.\nB. Conhece de trás para a frente o sítio onde o Mondego nasce.\nC. Sabe qual é a diferença entre um romance e uma novela.\nD. Consegue fingir na perfeição que está a dormir.\nE. O filho dela já sabe comer de faca e garfo.\nF. Sabe o que é um neutrino.\nG. Conhece o primeiro namorado da sua mãe.', verso:'A. Prático (saber-fazer)\nB. Por contacto (conhece diretamente um lugar)\nC. Proposicional (sabe que…)\nD. Prático\nE. Prático\nF. Proposicional\nG. Por contacto (conhece diretamente uma pessoa)', exemplo:'Atenção: “sabe” nem sempre é proposicional. “Sabe preparar” e “sabe comer” são saber-fazer. “Conhece” uma pessoa ou um lugar é por contacto.' },
    { id:'c32', m:1, aberta:true, frente:'Tem ou não conhecimento?\nA. A Luísa acredita, por estudos científicos que leu, que o albinismo tem causa genética.\nB. A Teresa acredita que a Terra é maior do que a Lua porque ouviu dizer que o tamanho dos nomes exprime o tamanho das coisas.\nC. O Carlos leu numa revista médica que o álcool em excesso provoca cirroses, mas pensou que era falso.', verso:'A. Tem conhecimento: crença, verdadeira e justificada.\nB. Não tem: a crença é verdadeira, mas mal justificada.\nC. Não tem: falta a crença.', exemplo:'Verifica sempre as três condições: crença, verdade e justificação.' },
    { id:'c33', m:3, aberta:true, frente:'“Na religião não existe conhecimento, mas sim opiniões.” É preciso ser cético radical para defender isto?', verso:'Não. Basta ser cético moderado, porque só se põe em causa o conhecimento num domínio (a religião), e não todo o conhecimento.', exemplo:'Radical seria dizer que nenhum conhecimento é possível, em domínio nenhum.' },
    { id:'c34', m:4, aberta:true, frente:'“A justificação da crença A é a crença B, a de B é a crença C, e assim sucessivamente.” Que dificuldade levanta esta situação?', verso:'Levanta o problema da regressão infinita da justificação: a cadeia de justificações nunca termina, logo nenhuma crença fica justificada. E, como a justificação é condição necessária do conhecimento, não há conhecimento.', exemplo:'O fundacionalismo responde que a cadeia termina em crenças básicas, autoevidentes.' },
    { id:'c35', m:3, aberta:true, frente:'Dá dois exemplos de enganos sensoriais.', verso:'Um pau parece partido dentro de água; uma miragem no deserto; a estrada parece molhada num dia de calor.', exemplo:'São usados pelo argumento cético da ilusão dos sentidos.' },
    { id:'c36', m:5, aberta:false, frente:'“A Maria tem o cabelo castanho” e “As esferas não têm arestas”: a priori ou a posteriori?', verso:'“A Maria tem o cabelo castanho” é a posteriori: só se sabe olhando para ela.\n“As esferas não têm arestas” é a priori: basta compreender o conceito de esfera.', exemplo:'Truque: o contrário podia ser verdade sem contradição? A Maria podia ser loura (a posteriori); uma esfera com arestas é contraditória (a priori).' },
    { id:'c37', m:1, aberta:false, frente:'O que é o conhecimento? (sujeito e objeto)', verso:'Em todos os casos de conhecimento há um sujeito (quem conhece) e um objeto (aquilo que é conhecido). O conhecimento é uma relação entre um sujeito e um objeto. No autoconhecimento, o sujeito e o objeto coincidem.', exemplo:'Na frase «A Alice conhece o Museu», a Alice é o sujeito e o Museu é o objeto.' },
    { id:'c38', m:2, aberta:true, frente:'Distingue os três tipos de conhecimento, indicando o objeto de cada um.', verso:'Prático (saber-fazer): o objeto é uma aptidão ou capacidade; o sujeito sabe realizar uma ação.\nPor contacto: o sujeito conhece diretamente algo pelos sentidos externos; o objeto são lugares, pessoas, animais, objetos físicos.\nProposicional (saber-que): o objeto são proposições verdadeiras; é conhecer ideias.', exemplo:'Saber fritar ovos (prático); conhecer o Castelo dos Mouros (por contacto); saber o que é uma alucinação (proposicional).' },
    { id:'c39', m:1, aberta:true, frente:'Explica porque é que a crença, a verdade e a justificação são condições necessárias do conhecimento.', verso:'Crença: dizer «conheço P, mas não acredito em P» é contraditório.\nVerdade: uma crença falsa não é conhecimento; não podemos saber que os pardais falam, porque não falam.\nJustificação: uma crença verdadeira por sorte, como um palpite certeiro, não é conhecimento; são precisas boas razões que liguem a crença à verdade.\nBasta faltar uma para não haver conhecimento; as três juntas são suficientes.', exemplo:'Os autores do manual sabem que os Países Baixos são uma monarquia: acreditam, é verdade e têm boas razões.' },
    { id:'c40', m:3, aberta:true, frente:'Em que consiste o ceticismo? (revisão da ficha)', verso:'O ceticismo põe em causa se podemos conhecer. O radical responde «não» para todo o conhecimento; o moderado duvida apenas de alguns domínios. O ceticismo radical (global, pirrónico) duvida de todo e qualquer conhecimento e defende a suspensão do juízo; o moderado (regional) só duvida em certas áreas, como a Ética ou a religião.', exemplo:'Pirro de Élis: como não podemos ter a certeza de nada, devemos suspender o juízo.' },
    { id:'c41', m:3, aberta:true, frente:'De que forma argumentam os céticos a favor da sua perspetiva? (revisão da ficha)', verso:'Defendem que as nossas crenças não estão justificadas e que, sem justificação, não há conhecimento. Para isso usam o argumento dos enganos sensoriais (os sentidos às vezes enganam-nos, por isso podemos ser sempre enganados e as justificações dos sentidos são inadequadas) e, sobretudo, o argumento da regressão infinita da justificação (cada crença precisa de outra para a justificar, sem fim, logo nenhuma fica justificada).', exemplo:'Um lápis parece partido dentro de um copo de água.' },
    { id:'c42', m:4, aberta:true, frente:'Concordas com o argumento cético da regressão infinita? Porquê? (discussão)', verso:'Não há uma única resposta certa: o importante é justificar. Uma resposta possível: não concordo. O argumento é válido, mas não é sólido, porque a premissa 1 é falsa: como defende o fundacionalismo, nem todas as crenças se justificam com base noutras; há crenças básicas, autoevidentes, que se justificam a si mesmas, e a cadeia de justificação termina nelas. Além disso, o ceticismo radical autorrefuta-se: afirma saber que nada se pode saber.', exemplo:'Se concordares, tens de mostrar porque as premissas são verdadeiras (ex.: dizer que nenhuma crença é autoevidente).' },
    { id:'c43', m:5, aberta:true, frente:'«Eu estou aqui agora»: é conhecimento a priori ou a posteriori? Dá-nos informação acerca do mundo? (discussão da ficha)', verso:'É uma pergunta de discussão, sem uma única resposta certa. Pode defender-se que é a priori: quem a diz sabe que é verdadeira só por compreender as palavras («eu» é quem fala, «aqui» é onde está, «agora» é o momento em que fala), sem observar nada. Mas parece dar alguma informação sobre o mundo (que alguém existe num lugar e num momento). Por isso serve para o debate: os racionalistas diriam que há conhecimento a priori com informação sobre o mundo; os empiristas diriam que não informa sobre como o mundo é.', exemplo:'Compara com «Os solteiros não são casados»: é a priori, mas não diz se existe algum solteiro.' },
    { id:'c44', m:3, aberta:false, frente:'Ceticismo global e regional', verso:'Radical = global: duvida de todo e qualquer conhecimento (também se chama pirrónico).\nModerado = regional ou localizado: duvida em algumas áreas, mas não noutras.', exemplo:'Duvidar que haja conhecimento na Ética e na Estética, mas não na Física e na Matemática (moderado).' },
    { id:'c45', m:3, aberta:false, frente:'Pirro, Sexto Empírico e Francisco Sanches', verso:'Pirro de Élis (c. 360/365–270 a.C.): o cético radical mais antigo; não escreveu nenhum livro.\nSexto Empírico (c. 160–210 d.C.): apresentou as ideias de Pirro nas «Hipóteses Pirrónicas».\nFrancisco Sanches (c. 1551–1623): filósofo cético, matemático e médico português, autor de «Que Nada se Sabe».', exemplo:'Suspender o juízo = não acreditar nem deixar de acreditar.' }
