/* =====================================================================
   MOTOR DO JOGO
   ===================================================================== */
const C = CONTEUDO;
const CHAVE = 'desafio-cetico-v1';
// prog: jogos a meio (mundos "m1"…"m5", "teste", "sim"), para continuar onde se parou
// abertos: mundos já desbloqueados (continuam abertos mesmo que se recomece o anterior)
const base = () => ({ xp:0, mundos:{}, erros:{}, cartoes:{}, recordes:{}, teste:null, prog:{}, abertos:[], def:{ fundo:false, som:false } });
function carregar(){ try { const r = localStorage.getItem(CHAVE); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function guardar(){ try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch(e){} }
let S = base();
const lido = carregar();
if (lido && typeof lido === 'object') S = Object.assign(base(), lido);
S.def = Object.assign(base().def, S.def || {});

const ITENS = {};
C.perguntas.forEach(p => { ITENS[p.id] = p; });
Object.keys(C.classificar).forEach(k => {
  const set = C.classificar[k];
  set.itens.forEach((it, i) => { it.id = k + '-' + (i + 1); it.t = 'cl'; it.set = k; it.m = set.mundo; ITENS[it.id] = it; });
});

const TIPOS = { mc:'Escolha múltipla', vf:'Verdadeiro ou falso', completa:'Completa a frase', cl:'Classifica' };
const $ = s => document.querySelector(s);
const $app = $('#app');
let TIMERS = [];
let combo = 0;

function limpar(){ TIMERS.forEach(clearInterval); TIMERS = []; fecharMateria(); document.body.classList.remove('foco'); VOLTAR = inicio; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function baralhar(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function sorte(a){ return a[Math.floor(Math.random() * a.length)]; }
function topo(){ try { window.scrollTo({ top:0 }); } catch(e){ window.scrollTo(0, 0); } }

const STAR = '<path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/>';
function estrelasHTML(n){ return '<span class="stars" aria-label="' + n + ' de 3 estrelas">' + [0,1,2].map(i => '<svg viewBox="0 0 24 24" class="' + (i < n ? 'on' : '') + '">' + STAR + '</svg>').join('') + '</span>'; }
const LOCK = '<svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>';

/* ---------- XP, níveis, mensagens ---------- */
function nivel(xp){
  let i = 0; C.niveis.forEach((n, k) => { if (xp >= n.xp) i = k; });
  const cur = C.niveis[i], prox = C.niveis[i + 1];
  return { i, nome:cur.nome, prog: prox ? (xp - cur.xp) / (prox.xp - cur.xp) : 1, falta: prox ? prox.xp - xp : 0, prox };
}
function toast(msg, cls){
  const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2000);
}
function mostrarCombo(){ const el = $('#pcombo'); if (el) el.textContent = combo >= 2 ? combo + ' seguidas' : ''; }
function acerto(){
  const antes = nivel(S.xp).i;
  S.xp += 10; combo++;
  let msg = '+10 XP';
  if (combo % 5 === 0){ S.xp += 5; msg += ' · +5 bónus (' + combo + ' seguidas!)'; }
  guardar(); toast(msg, 'xp'); mostrarCombo();
  FUNDO.squishTodos(); // animação do fundo (o som toca à parte, mesmo com o fundo desligado)
  const depois = nivel(S.xp).i;
  tocar('certo');
  if (depois > antes){ setTimeout(() => toast('Subiste para o Nível ' + (depois + 1) + ': ' + C.niveis[depois].nome + '!'), 400); setTimeout(() => tocar('nivel'), 350); }
}
function erro(id){
  combo = 0; mostrarCombo(); tocar('errado');
  if (id){ S.erros[id] = { s:0 }; guardar(); }
}

/* ---------- Botão «voltar» do telemóvel/browser ----------
   Em vez de sair do jogo, recua: pergunta anterior, cartão anterior, lição anterior ou início. */
let VOLTAR = null, histArmado = false, ignorarPop = false;
function armarVoltar(fn){
  VOLTAR = fn;
  if (!histArmado){ try { history.pushState({ dc:1 }, ''); histArmado = true; } catch(e){} }
}
function desarmarVoltar(){
  VOLTAR = null;
  if (histArmado){ histArmado = false; ignorarPop = true; try { history.back(); } catch(e){ ignorarPop = false; } }
}
addEventListener('popstate', () => {
  if (ignorarPop){ ignorarPop = false; return; }
  histArmado = false;
  if (document.getElementById('sheet')){ fecharMateria(); if (VOLTAR) armarVoltar(VOLTAR); return; }
  const f = VOLTAR; VOLTAR = null; if (f) f();
});

/* ---------- Estado dos mundos ---------- */
function infoMundo(n){ return S.mundos[n] || { best:0, est:0 }; }
function desbloqueado(n){ return n === 1 || S.abertos.indexOf(n) >= 0 || infoMundo(n - 1).best >= 0.7; }
function temProgresso(n){ return !!S.mundos[n] || !!S.prog['m' + n]; }
/* Recomeçar um mundo: apaga as estrelas e a pergunta onde se ia; os mundos já abertos continuam abertos */
function recomecarMundo(n){
  C.mundos.forEach(m => { if (desbloqueado(m.n) && S.abertos.indexOf(m.n) < 0) S.abertos.push(m.n); });
  delete S.mundos[n]; delete S.prog['m' + n]; guardar();
}
/* Confirmação com 2 toques (o confirm() não funciona em todos os browsers dentro de apps) */
function doisToques(btn, msg, acao){
  let armado = false, tm = 0; const txt = btn.textContent;
  btn.onclick = () => {
    if (armado){ clearTimeout(tm); acao(); return; }
    armado = true; btn.textContent = msg; btn.classList.add('armado');
    tm = setTimeout(() => { armado = false; btn.textContent = txt; btn.classList.remove('armado'); }, 4000);
  };
}
/* Jogos a meio: as perguntas guardam-se pelo id; as respostas, pelo texto da opção escolhida */
function progOk(ch){
  const p = S.prog[ch]; if (!p) return false;
  if (p.passos && p.passos.every(x => x.k !== 'q' || ITENS[x.id])) return true;
  delete S.prog[ch]; guardar(); return false;
}
const serPasso = p => p.k === 'q' ? { k:'q', id:p.it.id } : p; // partes de matéria e respostas escritas guardam-se como estão
const desPasso = p => p.k === 'q' ? { k:'q', it:ITENS[p.id] } : p;
const serRes = x => x.Q ? { c:x.c, ok:x.ok, id:x.Q.id, esc:x.Q.opts[x.i].txt } : x.texto != null ? { c:x.c, texto:x.texto, marcados:x.marcados } : { c:x.c };
function desResposta(x){ const Q = preparar(ITENS[x.id]); return { ok:x.ok, Q, i:Math.max(0, Q.opts.findIndex(o => o.txt === x.esc)) }; }
const desRes = (x, p) => x.id ? Object.assign({ p, c:x.c }, desResposta(x)) : Object.assign({ p }, x);
let pedirReset = 0; // mundo cujo "Recomeçar?" está aberto no mapa
function estrelas(p){ return p >= 0.95 ? 3 : p >= 0.85 ? 2 : p >= 0.7 ? 1 : 0; }

/* Partes de matéria de um mundo: grupos de secções da lição (as secções com minijogo ficam de fora) */
function partesMundo(n){
  const m = C.mundos[n - 1], L = C.licoes[n];
  if (m.partes) return m.partes.map(g => g.filter(i => L.seccoes[i] && !L.seccoes[i].quiz)).filter(g => g.length);
  return L.seccoes.map((s, i) => i).filter(i => !L.seccoes[i].quiz).map(i => [i]);
}
/* Minutos estimados para um mundo (matéria + perguntas + desafios + resposta escrita) */
function minutos(n){
  const m = C.mundos[n - 1], escrita = (C.escritas || []).some(e => e.m === n) ? 4 : 0;
  return Math.max(5, Math.round((partesMundo(n).length * 1.5 + m.nPerguntas * 0.5 + m.especiais.length * 1.5 + escrita) / 5) * 5);
}
const listaMundos = ms => { const t = ms.map(m => 'Mundo ' + m.n); return t.length > 1 ? t.slice(0, -1).join(', ') + ' e ' + t[t.length - 1] : t[0]; };

/* O botão «Continuar»: o próximo passo certo para o aluno */
function proximoPasso(){
  const emCurso = C.mundos.find(m => progOk('m' + m.n));
  if (emCurso){ const pg = S.prog['m' + emCurso.n]; return { t:'Continuar o Mundo ' + emCurso.n, d:esc(emCurso.titulo) + ' · passo ' + (pg.k + 1) + ' de ' + pg.passos.length, f:() => jogarMundo(emCurso.n) }; }
  if (simValida(S.prog.sim)) return { t:'Continuar a Simulação', d:esc(descreverSim(S.prog.sim)), f:simulacao };
  const prox = C.mundos.find(m => desbloqueado(m.n) && infoMundo(m.n).best < 0.7);
  if (prox) return { t:(S.mundos[prox.n] ? 'Repetir o Mundo ' : 'Começar o Mundo ') + prox.n, d:esc(prox.titulo) + ' · ≈ ' + minutos(prox.n) + ' min', f:() => jogarMundo(prox.n) };
  if (!S.simulacao) return { t:'Fazer a Simulação do Teste', d:'Já passaste todos os mundos: agora treina como no teste real.', f:simulacao };
  const ne = errosAtivos().length;
  if (ne) return { t:'Rever os erros', d:ne + (ne === 1 ? ' pergunta' : ' perguntas') + ' para dominar', f:revisao };
  return { t:'Fazer outra Simulação', d:'Melhor nota: ' + virgula(S.simulacao.melhor) + ' valores', f:simulacao };
}

/* Plano até ao teste: o aluno diz a data e o jogo diz o que fazer hoje */
function htmlPlano(){
  const d = S.def.dataTeste;
  if (!d) return '<section class="plano"><p class="pl-t">Quando é o teste?</p><p class="small muted">Diz a data e o jogo diz-te o que fazer em cada dia.</p>' +
    '<div class="pl-row"><input type="date" id="pl-data" aria-label="Data do teste"><button class="btn" id="pl-ok" type="button">Guardar</button></div></section>';
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dt = new Date(d + 'T00:00:00'), dias = Math.round((dt - hoje) / 864e5);
  const falta = C.mundos.filter(m => infoMundo(m.n).best < 0.7);
  let txt;
  if (dias < 0) txt = 'O teste já passou. Se tiveres outro, muda a data.';
  else if (dias === 0) txt = '<b>O teste é hoje!</b> Nada de matéria nova: lê os cartões de resposta aberta e faz a revisão dos erros.';
  else if (dias === 1) txt = '<b>O teste é amanhã.</b> Hoje: ' + (falta.length ? 'acaba o ' + listaMundos(falta) + ' e depois ' : '') + 'faz a Simulação do Teste e a revisão dos erros.';
  else {
    const hojeM = falta.slice(0, Math.ceil(falta.length / (dias - 1)));
    txt = '<b>Faltam ' + dias + ' dias.</b> ' + (hojeM.length ? 'Hoje: ' + listaMundos(hojeM) + ' (≈ ' + hojeM.reduce((s, m) => s + minutos(m.n), 0) + ' min).' : 'Já fizeste os mundos todos: faz a Simulação e a revisão dos erros.') +
      ' Na véspera: Simulação do Teste e revisão dos erros.';
  }
  return '<section class="plano"><p class="pl-t">Plano até ao teste · ' + esc(dt.toLocaleDateString('pt-PT', { day:'numeric', month:'long' })) + '</p><p>' + txt + '</p>' +
    '<button class="link-b" id="pl-mudar" type="button">Mudar a data</button></section>';
}

function palco(titulo, modo, chave, materiaN){
  limpar(); topo();

    '<div class="pb-mid"><p class="pb-title">' + esc(titulo) + '</p><div class="bar"><i id="pbar"></i></div></div>' +
    '<button class="mat-b" id="pmat" type="button" hidden>Matéria</button>' +
    '<div class="pb-right"><span id="pcount"></span><span class="pb-combo" id="pcombo"></span></div></header><main class="stage" id="stage"></main></div>';
  const sair = () => { const guardado = chave && S.prog[chave]; inicio(); if (guardado) toast('Fica guardado: continuas onde paraste.'); };
  $('#sair').onclick = sair;
  armarVoltar(sair);
  mostrarCombo();
  // "Matéria": rever a lição do tema sem sair do jogo (não aparece no teste nem na simulação)
  let alvo = 0; const mb = $('#pmat'), pa = $('#pant');
  const setMateria = n => { alvo = n; mb.hidden = modo === 'teste' || !(n && C.licoes[n]); };
  mb.onclick = () => abrirMateria(alvo);
  setMateria(materiaN);
  return { body:$('#stage'), modo:modo || 'normal', setMateria, sair,
    setVoltar(fn){ armarVoltar(fn); },
    setAnterior(mostrar, fn){ pa.hidden = !mostrar; pa.onclick = fn; },
    prog(f, l){ $('#pbar').style.width = (f * 100) + '%'; $('#pcount').textContent = l || ''; } };
}

function preparar(it){
  if (it.t === 'vf') return { id:it.id, t:'vf', q:it.q, e:it.e, opts:[{ txt:'Verdadeiro', ok:it.a === true }, { txt:'Falso', ok:it.a === false }] };
  if (it.t === 'cl'){
    const set = C.classificar[it.set];
    return { id:it.id, t:'cl', q:'Classifica: “' + it.x + '”', e:it.e || set.porque[it.c], opts:set.cats.map(c => ({ txt:c.l, ok:c.k === it.c })) };
  }
  return { id:it.id, t:it.t, q:it.q, e:it.e, opts:baralhar(it.o.map((txt, i) => ({ txt, ok:i === 0 }))) };
}
function fmtQ(q){ return esc(q).replace('___', '<span class="blank">______</span>'); }

function telaPergunta(ctx, it, done, op){
  op = op || {};
  const Q = op.Q || preparar(it), teste = ctx.modo === 'teste';
  const letras = Q.t === 'vf' ? ['V','F'] : ['A','B','C','D'];
  ctx.body.innerHTML = '<article class="q pop-in"><p class="tag">' + (op.tag || TIPOS[Q.t]) + '</p><h2 class="qtext">' + fmtQ(Q.q) + '</h2>' +
    '<div class="opts ' + (Q.t === 'vf' ? 'vf' : '') + '">' + Q.opts.map((o, i) => '<button class="opt" data-i="' + i + '" type="button"><span class="key">' + letras[i] + '</span><span>' + esc(o.txt) + '</span></button>').join('') + '</div>' +
    '<div class="fb" hidden></div></article>';
  const btns = Array.from(ctx.body.querySelectorAll('.opt'));
  if (op.escolhido != null && btns[op.escolhido]) btns[op.escolhido].classList.add('picked');
  let feito = false;
  btns.forEach(b => b.onclick = () => {
    if (feito) return; feito = true;
    const i = +b.dataset.i, ok = Q.opts[i].ok;
    btns.forEach(x => { x.disabled = true; x.classList.remove('picked'); });
    if (teste){ b.classList.add('picked'); setTimeout(() => done(ok, Q, i), 320); return; }
    if (op.onResp) op.onResp(ok, Q, i);
    const ci = Q.opts.findIndex(o => o.ok);
    btns[ci].classList.add('right'); if (!ok) b.classList.add('wrong');
    const blank = ctx.body.querySelector('.blank');
    if (blank){ blank.textContent = Q.opts[ci].txt; blank.classList.add('filled'); }
    if (ok) acerto(); else erro(Q.id);
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (ok ? 'is-ok' : 'is-bad');
    fb.innerHTML = '<p class="fb-msg">' + esc(sorte(ok ? C.mensagens.certo : C.mensagens.errado)) + '</p>' + (Q.e ? '<p class="fb-e">' + esc(Q.e) + '</p>' : '') + '<button class="btn primary" type="button">Continuar</button>' +
      (!ok && C.licoes[it.m] ? '<button class="link-b" data-mat type="button">Rever a matéria deste tema</button>' : '');
    const nb = fb.querySelector('.btn');
    const mt = fb.querySelector('[data-mat]'); if (mt) mt.onclick = () => abrirMateria(it.m);
    nb.onclick = () => done(ok, Q, i);
    try { nb.focus({ preventScroll:true }); fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  });
}

function nomeMini(p){ return p.k === 'sprint' ? C.classificar[p.set].titulo : p.k === 'ligar' ? C.ligar[p.set].titulo : p.k === 'ordem' ? C.ordenar.titulo : 'Desafio'; }
/* Uma pergunta já respondida: a tua resposta, a certa e a explicação */
function htmlRevisto(x, titulo){
  if (x.p && x.p.k === 'licao'){ // voltar a ler uma parte da matéria
    const L = C.licoes[x.p.n], secs = [].concat(x.p.i).map(i => L.seccoes[i]).filter(Boolean);
    return '<article class="mini pop-in parte"><p class="tag">' + esc(titulo) + ' · matéria, parte ' + x.p.parte + ' de ' + x.p.de + '</p>' + (x.p.parte === 1 ? '<p class="li-ideia">' + L.ideia + '</p>' : '') + '<div class="licao">' + secs.map(htmlSeccao).join('') + '</div>' + (x.p.parte === x.p.de ? '<p class="li-truque"><b>Truque:</b> ' + L.truque + '</p>' : '') + '</article>';
  }
  if (x.p && x.p.k === 'escrita'){ // a resposta escrita: o que escreveste e a resposta-modelo
    const dev = (C.escritas || []).find(e => e.id === x.p.id) || { pergunta:'', modelo:'' };
    return '<article class="mini pop-in"><p class="tag">' + esc(titulo) + ' · resposta escrita</p><h2 class="qtext longa">' + esc(dev.pergunta) + '</h2>' +
      (x.texto != null ? '<p class="col-h">A tua resposta</p><div class="caixa">' + (x.texto ? esc(x.texto) : '<span class="muted">(sem resposta)</span>') + '</div>' : '') +
      '<p class="col-h">Resposta-modelo</p><div class="caixa modelo">' + esc(dev.modelo) + '</div><p class="fb-msg">Marcaste ' + Math.round(x.c * 100) + '% dos pontos.</p></article>';
  }
  if (!x.Q) return '<article class="mini pop-in"><p class="tag">' + esc(titulo) + '</p><h2 class="qtext">' + esc(nomeMini(x.p)) + '</h2><p class="fb-msg">Já feito: ' + Math.round(x.c * 100) + '% certo.</p></article>';
  const Q = x.Q, letras = Q.t === 'vf' ? ['V','F'] : ['A','B','C','D'];
  return '<article class="q pop-in"><p class="tag">' + esc(titulo) + '</p><h2 class="qtext">' + fmtQ(Q.q) + '</h2><div class="opts' + (Q.t === 'vf' ? ' vf' : '') + '">' +
    Q.opts.map((o, i) => '<button class="opt' + (o.ok ? ' right' : i === x.i ? ' wrong' : '') + '" type="button" disabled><span class="key">' + letras[i] + '</span><span>' + esc(o.txt) + (i === x.i ? ' <b>← a tua resposta</b>' : '') + '</span></button>').join('') + '</div>' +
    '<div class="fb ' + (x.ok ? 'is-ok' : 'is-bad') + '"><p class="fb-msg">' + (x.ok ? 'Acertaste.' : 'Erraste.') + '</p>' + (Q.e ? '<p class="fb-e">' + esc(Q.e) + '</p>' : '') + '</div></article>';
}
/* Lista de todas as respostas, no fim de um mundo ou de um teste */
function htmlRespostas(res, titulo){
  res = res.filter(x => !(x.p && x.p.k === 'licao'));
  const qs = res.filter(x => x.Q); if (!res.length) return '';
  return '<details class="respostas"><summary>' + esc(titulo) + (qs.length ? ' (' + qs.filter(x => x.ok).length + ' de ' + qs.length + ' certas)' : '') + '</summary><div class="revlist">' +
    res.map((x, j) => x.Q
      ? '<div class="revitem ' + (x.ok ? 'ok' : 'mal') + '"><p class="qq">' + (j + 1) + '. ' + (x.ok ? '✓ ' : '✗ ') + esc(x.Q.q.replace('___', '______')) + '</p><p class="' + (x.ok ? 'ce' : 'tu') + '">A tua resposta: ' + esc(x.Q.opts[x.i].txt) + '</p>' +
        (x.ok ? '' : '<p class="ce">Resposta certa: ' + esc(x.Q.opts.find(o => o.ok).txt) + '</p>') + (x.Q.e ? '<p>' + esc(x.Q.e) + '</p>' : '') + '</div>'
      : '<div class="revitem"><p class="qq">' + (j + 1) + '. ' + (x.p && x.p.k === 'escrita' ? 'Resposta escrita' : 'Minijogo: ' + esc(nomeMini(x.p))) + '</p><p>' + Math.round(x.c * 100) + (x.p && x.p.k === 'escrita' ? '% dos pontos' : '% certo') + '</p></div>').join('') + '</div></details>';
}

/* ---------- Sequência de passos (mundos, minijogos, teste) ----------
   ← (ou o «voltar» do telemóvel) mostra os passos já feitos. No teste final pode mudar-se a resposta. */
function jogar(titulo, passos, fim, modo, chave, materiaN){
  const ctx = palco(titulo, modo, chave, materiaN);
  const teste = modo === 'teste';
  let k = 0, res = [], xp0 = S.xp, pend = null; // pend: pergunta atual já respondida, à espera de «Continuar»
  const sv = chave && S.prog[chave];
  if (sv){ passos = sv.passos.map(desPasso); k = sv.k; xp0 = S.xp - (sv.xp || 0); res = sv.res.map((x, j) => desRes(x, passos[j])); }
  const cred = () => res.reduce((t, x) => t + x.c, 0);
  const conta = () => passos.filter(p => p.k !== 'licao').length; // as partes de matéria não contam para a nota
  const gravar = () => { if (chave){ S.prog[chave] = { passos:passos.map(serPasso), k, cred:cred(), xp:S.xp - xp0, res:res.map(serRes) }; guardar(); } };
  const pararTimers = () => { TIMERS.forEach(clearInterval); TIMERS = []; };
  const recuar = j => { if (j > 0) mostrar(j - 1); else ctx.sair(); };
  const done = (c, extra) => { pend = null; res.push(Object.assign({ p:passos[k], c }, extra || {})); k++; gravar(); passo(); };
  function passo(){
    topo(); document.body.classList.remove('foco'); ctx.setMateria(materiaN);
    if (k >= passos.length){ if (chave){ delete S.prog[chave]; guardar(); } return fim({ cred:cred(), total:conta(), res, xp:S.xp - xp0 }); }
    ctx.prog(k / passos.length, (k + 1) + '/' + passos.length);
    ctx.setAnterior(k > 0, () => mostrar(k - 1));
    ctx.setVoltar(() => recuar(k));
    const p = passos[k];
    if (p.k === 'licao') telaParte(ctx, p, passos[k + 1], () => done(0));
    else if (p.k === 'escrita') telaEscrita(ctx, p.id, done);
    else if (p.k === 'q'){
      if (pend){
        ctx.body.innerHTML = htmlRevisto(pend, 'Pergunta ' + (k + 1)) + '<div class="acts"><button class="btn primary" id="rv-cont" type="button">Continuar</button></div>';
        $('#rv-cont').onclick = () => done(pend.ok ? 1 : 0, pend); return;
      }
      telaPergunta(ctx, p.it, (ok, Q, i) => done(ok ? 1 : 0, { ok, Q, i }), { onResp:(ok, Q, i) => { pend = { ok, Q, i, p }; } });
    }
    else if (p.k === 'ordem') telaOrdem(ctx, done);
    else if (p.k === 'ligar') telaLigar(ctx, p.set, done);
    else if (p.k === 'sprint') telaSprint(ctx, p.set, done);
  }
  function mostrar(j){
    pararTimers(); topo();
    const x = res[j], ultimo = j + 1 >= k;
    const ehMateria = x.p && x.p.k === 'licao';
    document.body.classList.toggle('foco', !!ehMateria); ctx.setMateria(ehMateria ? 0 : materiaN);
    const seguinte = () => ultimo ? passo() : mostrar(j + 1);
    const txtSeg = ultimo ? 'Voltar à pergunta onde ias →' : 'Seguinte →';
    ctx.prog(j / passos.length, (j + 1) + '/' + passos.length);
    ctx.setAnterior(j > 0, () => mostrar(j - 1));
    ctx.setVoltar(() => recuar(j));
    if (teste && x.Q){ // no teste podes mudar a resposta, como num teste em papel
      telaPergunta(ctx, null, (ok, Q, i) => { Object.assign(x, { ok, Q, i, c:ok ? 1 : 0 }); gravar(); seguinte(); }, { Q:x.Q, escolhido:x.i, tag:'Pergunta ' + (j + 1) + ' · podes mudar a resposta' });
      ctx.body.querySelector('.q').insertAdjacentHTML('beforeend', '<div class="acts"><button class="btn ghost" id="rv-seg" type="button">' + (ultimo ? txtSeg : 'Seguinte sem mudar →') + '</button></div>');
    } else {
      ctx.body.innerHTML = htmlRevisto(x, 'Passo ' + (j + 1) + (ehMateria ? '' : ' · já feito')) + '<div class="acts"><button class="btn primary" id="rv-seg" type="button">' + txtSeg + '</button></div>';
    }
    $('#rv-seg').onclick = seguinte;
  }
  passo();
}

/* Passos de um mundo: parte de matéria → perguntas sobre essa parte (e, às vezes, uma resposta escrita) → parte seguinte…
   e, no fim, os desafios. Cada pergunta tem "s" (a secção onde a matéria é explicada), por isso nunca aparece antes dela. */
function passosMundo(n, comMateria){
  const m = C.mundos[n - 1], partes = partesMundo(n);
  const pools = partes.map(g => baralhar(C.perguntas.filter(p => p.m === n && g.indexOf(p.s) >= 0)));
  const total = pools.reduce((a, b) => a + b.length, 0);
  const quotas = pools.map(p => p.length ? Math.max(1, Math.round(m.nPerguntas * p.length / total)) : 0);
  const soma = () => quotas.reduce((a, b) => a + b, 0);
  while (soma() > m.nPerguntas){ const j = quotas.indexOf(Math.max.apply(null, quotas)); quotas[j]--; }
  while (soma() < m.nPerguntas){ let j = -1, folga = 0; pools.forEach((p, i) => { if (p.length - quotas[i] > folga){ folga = p.length - quotas[i]; j = i; } }); if (j < 0) break; quotas[j]++; }
  const escrita = sorte((C.escritas || []).filter(e => e.m === n));
  const passos = [];
  partes.forEach((g, j) => {
    if (comMateria) passos.push({ k:'licao', n, i:g, parte:j + 1, de:partes.length });
    pools[j].slice(0, quotas[j]).sort((a, b) => g.indexOf(a.s) - g.indexOf(b.s)).forEach(it => passos.push({ k:'q', it }));
    if (escrita && g.indexOf(escrita.s) >= 0) passos.push({ k:'escrita', id:escrita.id });
  });
  return passos.concat(m.especiais.map(e => Object.assign({}, e)));
}

function jogarMundo(n, soPerguntas){
  const m = C.mundos[n - 1];
  combo = 0;
  if (progOk('m' + n)) return jogar('Mundo ' + n + ' · ' + m.titulo, [], r => fimMundo(n, r), 'normal', 'm' + n, n);
  if (soPerguntas == null) return telaInicioMundo(n);
  jogar('Mundo ' + n + ' · ' + m.titulo, passosMundo(n, !soPerguntas), r => fimMundo(n, r), 'normal', 'm' + n, n);
}

/* Uma parte de matéria, dentro do mundo (o fundo fica mais discreto para ler) */

function fimMundo(n, r){
  const pct = r.total ? r.cred / r.total : 0, est = estrelas(pct);
  const prev = infoMundo(n);
  const abriaAntes = n < 5 && desbloqueado(n + 1);
  S.mundos[n] = { best:Math.max(prev.best || 0, pct), est:Math.max(prev.est || 0, est) };
  if (n < 5 && pct >= 0.7 && S.abertos.indexOf(n + 1) < 0) S.abertos.push(n + 1);
  guardar();
  const abriuAgora = n < 5 && !abriaAntes && desbloqueado(n + 1);
  const m = C.mundos[n - 1];
  let msg;
  if (est === 3) msg = 'Perfeito! Dominas este mundo.';
  else if (est === 2) msg = 'Muito bom! Falta pouco para as 3 estrelas.';
  else if (est === 1) msg = 'Passaste! Repete para ganhar mais estrelas.';
  else msg = 'Precisas de 70% para passar. Os erros já estão na revisão: cada tentativa fica mais fácil.';
  limpar(); topo();
  $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Mundo ' + n + ' · ' + esc(m.titulo) + '</p>' +
    estrelasHTML(est) + '<p class="big">' + Math.round(pct * 100) + '<small>%</small></p><h2>' + esc(msg) + '</h2>' +
    (abriuAgora ? '<p class="aviso">Desbloqueaste o Mundo ' + (n + 1) + ': <b>' + esc(C.mundos[n].titulo) + '</b></p>' : '') +
    '<div class="stats"><span>+' + r.xp + ' XP</span><span>melhor: ' + Math.round(S.mundos[n].best * 100) + '%</span></div>' + htmlRespostas(r.res, 'Ver as tuas respostas') +
    '<div class="acts">' + (n < 5 && desbloqueado(n + 1) ? '<button class="btn primary" id="r-prox" type="button">Mundo ' + (n + 1) + '</button>' : '') +
    '<button class="btn" id="r-rep" type="button">Jogar outra vez</button><button class="btn ghost" id="r-ini" type="button">Voltar ao mapa</button></div></section></div>';
  const prox = $('#r-prox'); if (prox) prox.onclick = () => jogarMundo(n + 1);
  $('#r-rep').onclick = () => jogarMundo(n);
  $('#r-ini').onclick = inicio;
  if (est === 3) setTimeout(confetis, 250);
}

/* ---------- Classifica rápido ---------- */
function telaSprint(ctx, key, done){
  const set = C.classificar[key], DUR = 60;
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Classifica rápido · 60 segundos</p><h2 class="qtext">' + esc(set.titulo) + '</h2><p class="lead">' + esc(set.instrucao) + '</p>' +
    '<ul class="hint">' + set.cats.map(c => '<li><b>' + esc(c.l) + '</b>: ' + esc(c.dica) + '</li>').join('') + '</ul>' +
    '<p class="lead small">Acertos seguidos fazem combo. Recorde atual: ' + (S.recordes[key] || 0) + ' certas.</p>' +
    '<button class="btn primary big" id="go" type="button">Começar</button></article>';
  $('#go').onclick = comecar;

  function comecar(){
    let pool = [], cur = null, certos = 0, total = 0, cmb = 0, maxc = 0, ativo = true;
    const errados = [], fimT = Date.now() + DUR * 1000;
    ctx.body.innerHTML = '<article class="sprint"><div class="sp-top"><div class="timer"><i id="tbar"></i></div><span class="sp-time" id="ttxt">60</span></div>' +
      '<div class="sp-stats"><span>Certas: <b id="sc">0</b></span><span class="combo" id="scombo"></span></div>' +
      '<div class="sp-card" id="scard"><p id="stxt"></p></div>' +
      '<div class="sp-btns n' + set.cats.length + '">' + set.cats.map(c => '<button class="btn sp-b" data-k="' + c.k + '" type="button">' + esc(c.l) + '</button>').join('') + '</div></article>';
    const card = $('#scard'), txt = $('#stxt');
    const anima = cls => { card.classList.remove('in', 'ok', 'bad'); void card.offsetWidth; card.classList.add(cls); };
    const novo = () => {
      if (!pool.length){ pool = baralhar(set.itens); if (pool.length > 1 && pool[pool.length - 1] === cur) pool.unshift(pool.pop()); }
      cur = pool.pop(); txt.textContent = cur.x;
    };
    ctx.body.querySelectorAll('.sp-b').forEach(b => b.onclick = () => {
      if (!ativo) return;
      total++;
      const ok = b.dataset.k === cur.c;
      if (ok){ certos++; cmb++; maxc = Math.max(maxc, cmb); acerto(); }
      else { cmb = 0; erro(cur.id); errados.push(cur); }
      anima(ok ? 'ok' : 'bad');
      $('#sc').textContent = certos;
      $('#scombo').textContent = cmb >= 2 ? 'Combo ×' + cmb : '';
      novo();
    });
    const tick = () => {
      const left = Math.max(0, fimT - Date.now());
      $('#tbar').style.width = (left / (DUR * 10)) + '%';
      $('#ttxt').textContent = Math.ceil(left / 1000);
      if (left <= 0) terminar();
    };
    const iv = setInterval(tick, 100); TIMERS.push(iv);
    novo(); anima('in'); tick();

    function terminar(){
      if (!ativo) return; ativo = false; clearInterval(iv);
      const rec = S.recordes[key] || 0, novoRec = certos > rec;
      if (novoRec){ S.recordes[key] = certos; guardar(); }
      const pct = total ? certos / total : 0;
      const unicos = errados.filter((x, i) => errados.indexOf(x) === i);
      const nomeCat = k => set.cats.find(c => c.k === k).l;
      ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Tempo!</p><h2 class="qtext">' + certos + ' certas em ' + total + '</h2>' +
        '<div class="stats" style="justify-content:flex-start"><span>precisão ' + Math.round(pct * 100) + '%</span><span>maior combo ×' + maxc + '</span><span>' + (novoRec ? 'novo recorde!' : 'recorde: ' + rec) + '</span></div>' +
        (unicos.length ? '<div><p class="col-h">Para rever</p><ul class="lista-err">' + unicos.map(x => '<li>“' + esc(x.x) + '” → <b>' + esc(nomeCat(x.c)) + '</b></li>').join('') + '</ul></div>' : (total ? '<p class="fb-msg" style="color:var(--ok)">Sem erros. Impressionante!</p>' : '<p class="lead">Não respondeste a nenhuma frase. Tenta outra vez!</p>')) +
        '<button class="btn primary big" id="sp-ok" type="button">Continuar</button></article>';
      $('#sp-ok').onclick = () => done(pct);
    }
  }
}

/* ---------- Ordena o argumento ---------- */
function telaOrdem(ctx, done){
  const O = C.ordenar, L = O.linhas;
  let pecas = baralhar(L.map((_, i) => i));
  while (pecas.every((v, i) => v === i)) pecas = baralhar(pecas);
  let resp = [];
  const render = () => {
    ctx.body.innerHTML = '<article class="mini"><p class="tag">Ordena o argumento</p><h2 class="qtext">' + esc(O.titulo) + '</h2><p class="lead">' + esc(O.instrucao) + '</p>' +
      '<ol class="slots">' + L.map((_, j) => { const v = resp[j];
        return '<li class="slot ' + (v == null ? 'empty' : '') + '"><span class="sn">' + (j < L.length - 1 ? 'P' + (j + 1) : 'C') + '</span>' +
          (v == null ? '<span class="ph">' + (j === resp.length ? 'Toca numa frase abaixo' : '') + '</span>' : '<button class="slot-b" data-j="' + j + '" type="button">' + esc(L[v]) + '</button>') + '</li>'; }).join('') + '</ol>' +
      '<div class="pecas">' + pecas.filter(i => resp.indexOf(i) < 0).map(i => '<button class="peca" data-i="' + i + '" type="button">' + esc(L[i]) + '</button>').join('') + '</div>' +
      '<div class="acts">' + (resp.length === L.length ? '<button class="btn primary" id="ver" type="button">Verificar</button>' : '') + (resp.length ? '<button class="btn ghost" id="lim" type="button">Recomeçar</button>' : '') + '</div>' +
      '<div class="fb" hidden></div></article>';
    ctx.body.querySelectorAll('.peca').forEach(b => b.onclick = () => { resp.push(+b.dataset.i); render(); });
    ctx.body.querySelectorAll('.slot-b').forEach(b => b.onclick = () => { resp.splice(+b.dataset.j, 1); render(); });
    const lim = $('#lim'); if (lim) lim.onclick = () => { resp = []; render(); };
    const ver = $('#ver'); if (ver) ver.onclick = verificar;
  };
  const verificar = () => {
    const slots = ctx.body.querySelectorAll('.slot');
    let hits = 0;
    resp.forEach((v, j) => { const ok = v === j; if (ok) hits++; slots[j].classList.add(ok ? 'right' : 'wrong'); });
    ctx.body.querySelectorAll('.slot-b').forEach(b => b.disabled = true);
    ctx.body.querySelector('.acts').innerHTML = '';
    const tudo = hits === L.length;
    if (tudo) acerto(); else erro();
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (tudo ? 'is-ok' : 'is-bad');
    fb.innerHTML = '<p class="fb-msg">' + (tudo ? 'Ordem perfeita!' : hits + ' de ' + L.length + ' no sítio certo. ' + esc(sorte(C.mensagens.errado))) + '</p>' +
      (tudo ? '' : '<p class="col-h">Ordem certa</p><ol class="ordem-certa">' + L.map(l => '<li>' + esc(l) + '</li>').join('') + '</ol>') +
      '<p class="fb-e">' + esc(O.nota) + '</p><button class="btn primary" type="button">Continuar</button>';
    fb.querySelector('button').onclick = () => done(hits / L.length);
    try { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  };
  render();
}

  const A = Array.from(ctx.body.querySelectorAll('.lk.a')), B = Array.from(ctx.body.querySelectorAll('.lk.b'));
  const abana = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
  A.forEach(b => b.onclick = () => {
    const i = +b.dataset.i; if (feitos.indexOf(i) >= 0) return;
    sel = i; A.forEach(x => x.classList.toggle('sel', x === b));
  });
  B.forEach(b => b.onclick = () => {
    const j = +b.dataset.i; if (feitos.indexOf(j) >= 0) return;
    if (sel == null){ A.forEach(abana); return; }
    const a = A.find(x => +x.dataset.i === sel);
    if (j === sel){
      const cor = 'm' + (feitos.length % 4); feitos.push(j);
      a.classList.remove('sel'); a.classList.add(cor); b.classList.add(cor); a.disabled = b.disabled = true;
      b.querySelector('.pr').textContent = set.pares[j][0] + ' ·';
      sel = null; acerto();
      if (feitos.length === n) acabar();
    } else { falhas++; erro(); abana(b); abana(a); }
  });
  function acabar(){
    const c = Math.max(0, (n - falhas) / n);
    const fb = ctx.body.querySelector('.fb');
    fb.hidden = false; fb.className = 'fb pop-in ' + (falhas ? 'is-info' : 'is-ok');
    fb.innerHTML = '<p class="fb-msg">' + (falhas ? 'Tudo ligado, com ' + falhas + (falhas === 1 ? ' tentativa errada.' : ' tentativas erradas.') : 'Tudo ligado à primeira!') + '</p><button class="btn primary" type="button">Continuar</button>';
    fb.querySelector('button').onclick = () => done(c);
    try { fb.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  }
}

/* =====================================================================
   REVISÃO DOS ERROS
   ===================================================================== */
function errosAtivos(){ return Object.keys(S.erros).filter(id => ITENS[id]); }
function revisao(){
  const ids = errosAtivos();
  if (!ids.length){
    limpar(); topo();
    $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Revisão dos erros</p><h2>Não tens perguntas erradas para rever.</h2><p class="lead">Quando errares uma pergunta num mundo, num minijogo ou no teste final, ela aparece aqui até a acertares 2 vezes seguidas.</p><div class="acts"><button class="btn primary" id="v-ini" type="button">Voltar ao início</button></div></section></div>';
    $('#v-ini').onclick = inicio; return;
  }
  combo = 0;
  const ctx = palco('Revisão dos erros');
  const totalIni = ids.length, feitas = [];
  let fila = baralhar(ids), atual = null, pend = null;
  const concluir = (ok, Q, i) => {
    const id = atual; feitas.push({ ok, Q, i }); atual = null; pend = null;
    if (ok){
      const e = S.erros[id] || { s:0 }; e.s = (e.s || 0) + 1;
      if (e.s >= 2){ delete S.erros[id]; toast('Dominada! Saiu da revisão.'); }
      else { S.erros[id] = e; fila.splice(Math.min(fila.length, 2 + Math.floor(Math.random() * 3)), 0, id); }
    } else {
      fila.splice(Math.min(fila.length, 2), 0, id);
    }
    guardar(); passo();
  };
  function mostrarFeita(j){
    topo();
    const ultimo = j + 1 >= feitas.length;
    ctx.setAnterior(j > 0, () => mostrarFeita(j - 1));
    ctx.setVoltar(() => j > 0 ? mostrarFeita(j - 1) : ctx.sair());
    ctx.body.innerHTML = htmlRevisto(feitas[j], 'Já respondida') + '<div class="acts"><button class="btn primary" id="rv-seg" type="button">' + (ultimo ? 'Voltar à pergunta onde ias →' : 'Seguinte →') + '</button></div>';
    $('#rv-seg').onclick = () => ultimo ? passo() : mostrarFeita(j + 1);
  }
  function passo(){
    topo();
    const faltam = errosAtivos().length;
    if (!atual && (!fila.length || !faltam)){
      limpar();
      $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Revisão dos erros</p><p class="big">' + totalIni + '</p><h2>Dominaste todas as perguntas que tinhas errado!</h2>' + htmlRespostas(feitas, 'Ver as tuas respostas') + '<div class="acts"><button class="btn primary" id="v-ini" type="button">Voltar ao início</button></div></section></div>';
      $('#v-ini').onclick = inicio; confetis(); return;
    }
    ctx.prog((totalIni - faltam) / totalIni, 'faltam ' + faltam);
    ctx.setAnterior(feitas.length > 0, () => mostrarFeita(feitas.length - 1));
    ctx.setVoltar(() => feitas.length ? mostrarFeita(feitas.length - 1) : ctx.sair());
    if (!atual) atual = fila.shift();
    ctx.setMateria(ITENS[atual].m);
    if (pend){
      ctx.body.innerHTML = htmlRevisto(pend, 'Pergunta atual') + '<div class="acts"><button class="btn primary" id="rv-cont" type="button">Continuar</button></div>';
      $('#rv-cont').onclick = () => concluir(pend.ok, pend.Q, pend.i); return;
    }
    telaPergunta(ctx, ITENS[atual], concluir, { onResp:(ok, Q, i) => { pend = { ok, Q, i }; } });
  }
  passo();
}

function testeFinal(){
  combo = 0;
  if (progOk('teste')) return jogar('Teste final · sem explicações até ao fim', [], fimTeste, 'teste', 'teste');
  const TF = C.testeFinal;
  const dest = baralhar(C.perguntas.filter(p => p.destaque)).slice(0, TF.minDestaque);
  const perg = dest.concat(baralhar(C.perguntas.filter(p => dest.indexOf(p) < 0)).slice(0, TF.perguntas - dest.length));
  const cls = baralhar(Object.values(ITENS).filter(it => it.t === 'cl')).slice(0, TF.classificar);
  const passos = baralhar(perg.concat(cls)).map(it => ({ k:'q', it }));
  jogar('Teste final · sem explicações até ao fim', passos, fimTeste, 'teste', 'teste');
}
function fimTeste(r){
    const certas = r.res.filter(x => x.ok).length, erradas = r.res.filter(x => !x.ok);
    S.xp += certas * 10;
    erradas.forEach(x => { S.erros[x.Q.id] = { s:0 }; });
    S.teste = { melhor:Math.max(S.teste ? S.teste.melhor : 0, certas), ultima:certas };
    guardar();
    const msg = certas >= 18 ? 'Excelente! Estás pronto para o teste.' : certas >= 14 ? 'Muito bom! Revê as que falhaste e chegas lá acima.' : certas >= 10 ? 'Positiva! Usa a revisão dos erros para subir a nota.' : 'Ainda não chegaste à positiva, mas agora sabes exatamente o que rever.';
    limpar(); topo();
    $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Teste final</p><p class="big">' + certas + '<small> valores</small></p><h2>' + esc(msg) + '</h2>' +
      '<div class="stats"><span>' + certas + '/20 certas</span><span>+' + (certas * 10) + ' XP</span><span>melhor: ' + S.teste.melhor + ' valores</span></div>' +
      (erradas.length ? '<div class="revlist"><p class="col-h">As que erraste (' + erradas.length + ')</p>' + erradas.map(x => {
        const certa = x.Q.opts.find(o => o.ok).txt;
        return '<div class="revitem"><p class="qq">' + esc(x.Q.q.replace('___', '______')) + '</p><p class="tu">A tua resposta: ' + esc(x.Q.opts[x.i].txt) + '</p><p class="ce">Resposta certa: ' + esc(certa) + '</p>' + (x.Q.e ? '<p>' + esc(x.Q.e) + '</p>' : '') + '</div>';
      }).join('') + '</div>' : '') +
      htmlRespostas(r.res, 'Ver todas as respostas') +
      '<div class="acts"><button class="btn primary" id="t-rep" type="button">Fazer outro teste</button>' + (erradas.length ? '<button class="btn" id="t-rev" type="button">Rever os erros</button>' : '') + '<button class="btn ghost" id="t-ini" type="button">Início</button></div></section></div>';
    $('#t-rep').onclick = testeFinal;
    const rv = $('#t-rev'); if (rv) rv.onclick = revisao;
    $('#t-ini').onclick = inicio;
    if (certas >= 18) setTimeout(confetis, 250);
}

/* =====================================================================
   SIMULAÇÃO DO TESTE (formato do teste real: grupos I a IV)
   Fica guardada a meio: perguntas sorteadas, respostas, tabela e texto do Grupo IV.
   ===================================================================== */
function virgula(n){ return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
function descreverSim(st){
  const G = C.simulacao.grupos;
  if (st.r1.length < G[0].n) return 'Grupo I, pergunta ' + (st.r1.length + 1) + ' de ' + G[0].n;
  if (st.r2.length < G[1].n) return 'Grupo II, pergunta ' + (st.r2.length + 1) + ' de ' + G[1].n;
  if (!st.r3) return 'Grupo III (tabela)';
  return 'Grupo IV (desenvolvimento)';
}
function simValida(st){
  const tab = C.classificar.tabela.itens;
  return !!st && Array.isArray(st.g1) && st.g1.concat(st.g2).every(id => ITENS[id]) && st.g3.every(i => tab[i]) && C.simulacao.desenvolvimento.some(d => d.id === st.dev);
}
function novaSim(){
  const G = C.simulacao.grupos, tab = C.classificar.tabela.itens, meio = Math.floor(G[2].n / 2), idx = tab.map((_, i) => i);
  return {
    g1:baralhar(C.perguntas.filter(p => p.t === 'mc')).slice(0, G[0].n).map(p => p.id),
    g2:baralhar(C.perguntas.filter(p => p.t === 'vf')).slice(0, G[1].n).map(p => p.id),
    g3:baralhar(baralhar(idx.filter(i => tab[i].c === 'pri')).slice(0, meio).concat(baralhar(idx.filter(i => tab[i].c === 'pos')).slice(0, G[2].n - meio))),
    dev:sorte(C.simulacao.desenvolvimento).id,
    r1:[], r2:[], tab:{}, r3:null, texto:'', submetido:false, marcados:[]
  };
}

function simulacao(){
  combo = 0;
  const SIM = C.simulacao, G = SIM.grupos, tab = C.classificar.tabela.itens;
  let st = S.prog.sim;
  if (!simValida(st)){ delete S.prog.sim; st = novaSim(); }
  const dev = SIM.desenvolvimento.find(d => d.id === st.dev);
  const total = G[0].n + G[1].n + 2;
  const ctx = palco('Simulação do Teste', 'teste', 'sim');
  const titulo = t => { const el = $app.querySelector('.pb-title'); if (el) el.textContent = t; };
  const gravar = () => { S.prog.sim = st; guardar(); };
  const mostrarProg = () => { const f = st.r1.length + st.r2.length + (st.r3 ? 1 : 0); ctx.prog(f / total, Math.min(f + 1, total) + '/' + total); };

  if (S.prog.sim) return continuar();
  // Ecrã de entrada com a estrutura e as cotações
  ctx.prog(0, '');
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Simulação do Teste</p><h2 class="qtext">Igual ao teste real</h2>' +
    '<p class="lead">Responde como no teste: não há explicações até ao fim. No final tens uma estimativa de 0 a 20 valores e a correção. Se saíres a meio, fica guardado.</p>' +
    '<ol class="grupos">' + G.map(g => '<li><span class="gn">' + g.nome + '</span><span>' + esc(g.tipo) + (g.n > 1 ? ' · ' + g.n + (g.nome === 'Grupo III' ? ' frases' : ' perguntas') : '') + '</span><span class="gc">' + g.cotacao + ' val.</span></li>').join('') + '</ol>' +
    '<button class="btn primary big" id="sim-go" type="button">Começar o teste</button></article>';
  $('#sim-go').onclick = () => { gravar(); continuar(); };

  function continuar(){
    topo(); mostrarProg();
    const nResp = st.r1.length + st.r2.length, podeVoltar = !st.r3 && nResp > 0;
    ctx.setAnterior(podeVoltar, () => verSim(nResp - 1));
    ctx.setVoltar(() => podeVoltar ? verSim(nResp - 1) : ctx.sair());
    if (st.r1.length < G[0].n) return pergunta(0);
    if (st.r2.length < G[1].n) return pergunta(1);
    if (!st.r3) return grupo3();
    grupo4();
  }
  function pergunta(gi){
    const lista = gi ? st.g2 : st.g1, dest = gi ? st.r2 : st.r1, k = dest.length;
    titulo('Simulação · ' + G[gi].nome + ' · ' + G[gi].tipo);
    telaPergunta(ctx, ITENS[lista[k]], (ok, Q, i) => { dest.push({ id:Q.id, ok, esc:Q.opts[i].txt }); gravar(); continuar(); });
    ctx.body.querySelector('.tag').textContent = G[gi].nome + ' · ' + (k + 1) + ' de ' + lista.length;
  }
  function verSim(j){ // rever e, se quiseres, mudar uma resposta dos grupos I e II
    topo();
    const gi = j < G[0].n ? 0 : 1, idx = gi ? j - G[0].n : j, lista = gi ? st.g2 : st.g1, dest = gi ? st.r2 : st.r1;
    const Q = preparar(ITENS[lista[idx]]), antes = Q.opts.findIndex(o => o.txt === dest[idx].esc);
    const ultimo = j + 1 >= st.r1.length + st.r2.length;
    const seguinte = () => ultimo ? continuar() : verSim(j + 1);
    titulo('Simulação · ' + G[gi].nome + ' · a rever');
    ctx.setAnterior(j > 0, () => verSim(j - 1));
    ctx.setVoltar(() => j > 0 ? verSim(j - 1) : ctx.sair());
    telaPergunta(ctx, null, (ok, Q2, i) => { dest[idx] = { id:Q2.id, ok, esc:Q2.opts[i].txt }; gravar(); seguinte(); },
      { Q, escolhido:antes, tag:G[gi].nome + ' · ' + (idx + 1) + ' de ' + lista.length + ' · podes mudar a resposta' });
    ctx.body.querySelector('.q').insertAdjacentHTML('beforeend', '<div class="acts"><button class="btn ghost" id="rv-seg" type="button">' + (ultimo ? 'Voltar à pergunta onde ias →' : 'Seguinte sem mudar →') + '</button></div>');
    $('#rv-seg').onclick = seguinte;
  }
  function grupo3(){
    titulo('Simulação · Grupo III · Tabela');
    telaTabela(ctx, st.g3.map(i => tab[i]), st.tab, resp => { st.tab = resp; gravar(); }, res => { st.r3 = res.map(x => ({ r:x.r, ok:x.ok })); gravar(); continuar(); });
  }
  function grupo4(){
    titulo('Simulação · Grupo IV · Desenvolvimento');
    telaDesenvolvimento(ctx, dev, st, gravar, fim);
  }

  function fim(dv){
    delete S.prog.sim;
    const R = { g1:st.r1.map(desResposta), g2:st.r2.map(desResposta), g3:st.r3.map((x, j) => ({ it:tab[st.g3[j]], r:x.r, ok:x.ok })), dev:dv };
    const c1 = R.g1.filter(x => x.ok).length, c2 = R.g2.filter(x => x.ok).length, c3 = R.g3.filter(x => x.ok).length;
    const n1 = c1 * G[0].cotacao / G[0].n, n2 = c2 * G[1].cotacao / G[1].n, n3 = c3 * G[2].cotacao / G[2].n;
    const n4 = R.dev.marcados.length / R.dev.total * G[3].cotacao;
    const nota = Math.round((n1 + n2 + n3 + n4) * 10) / 10;
    const certas = c1 + c2 + c3;
    S.xp += certas * 10;
    const e1 = R.g1.filter(x => !x.ok), e2 = R.g2.filter(x => !x.ok), e3 = R.g3.filter(x => !x.ok);
    e1.concat(e2).forEach(x => { S.erros[x.Q.id] = { s:0 }; });
    e3.forEach(x => { S.erros[x.it.id] = { s:0 }; });
    S.simulacao = { melhor:Math.max(S.simulacao ? S.simulacao.melhor : 0, nota), ultima:nota };
    guardar();
    const msg = nota >= 18 ? 'Excelente resultado neste treino. Revê também as respostas abertas com o professor.' : nota >= 14 ? 'Bom resultado no treino. Revê as que falhaste.' : nota >= 9.5 ? 'A estimativa ficou positiva. Revê os erros para consolidar a matéria.' : 'Este treino mostra os temas que vale a pena rever.';
    const nomeCat = k => k === 'pri' ? 'A priori' : 'A posteriori';
    const itemQ = x => { const certa = x.Q.opts.find(o => o.ok).txt;
      return '<div class="revitem"><p class="qq">' + esc(x.Q.q.replace('___', '______')) + '</p><p class="tu">A tua resposta: ' + esc(x.Q.opts[x.i].txt) + '</p><p class="ce">Resposta certa: ' + esc(certa) + '</p>' + (x.Q.e ? '<p>' + esc(x.Q.e) + '</p>' : '') + '</div>'; };
    const itemT = x => '<div class="revitem"><p class="qq">“' + esc(x.it.x) + '”</p><p class="tu">A tua resposta: ' + nomeCat(x.r) + '</p><p class="ce">Resposta certa: ' + nomeCat(x.it.c) + '</p><p>' + esc(x.it.e || C.classificar.tabela.porque[x.it.c]) + '</p></div>';
    const bloco = (t, arr, f) => arr.length ? '<p class="col-h">' + t + ' (' + arr.length + ')</p>' + arr.map(f).join('') : '';
    const faltou = SIM.pontos.filter((p, i) => dev.pontos.indexOf(i) >= 0 && R.dev.marcados.indexOf(i) < 0);
    limpar(); topo();
    $app.innerHTML = '<div class="wrap"><section class="res pop-in"><p class="eyebrow">Simulação · estimativa indicativa</p><p class="big">' + virgula(nota) + '<small> valores</small></p><h2>' + esc(msg) + '</h2>' +
      '<div class="cotas">' +
        '<div><b>' + virgula(n1) + '/' + G[0].cotacao + '</b><span>Grupo I · ' + c1 + '/' + G[0].n + ' certas</span></div>' +
        '<div><b>' + virgula(n2) + '/' + G[1].cotacao + '</b><span>Grupo II · ' + c2 + '/' + G[1].n + ' certas</span></div>' +
        '<div><b>' + virgula(n3) + '/' + G[2].cotacao + '</b><span>Grupo III · ' + c3 + '/' + G[2].n + ' certas</span></div>' +
        '<div><b>≈ ' + virgula(n4) + '/' + G[3].cotacao + '</b><span>Grupo IV · estimativa pela checklist</span></div>' +
      '</div>' +
      '<div class="stats"><span>+' + (certas * 10) + ' XP</span><span>melhor: ' + virgula(S.simulacao.melhor) + ' valores</span></div>' +
      '<div class="revlist">' +
        bloco('Grupo I · erradas', e1, itemQ) + bloco('Grupo II · erradas', e2, itemQ) + bloco('Grupo III · erradas', e3, itemT) +
        (faltou.length ? '<p class="col-h">Grupo IV · pontos que faltaram</p><div class="revitem">' + faltou.map(p => '<p>• ' + esc(p) + '</p>').join('') + '</div>' : '') +
      '</div>' +
      htmlRespostas(R.g1.concat(R.g2).map(x => Object.assign({ c:x.ok ? 1 : 0 }, x)), 'Ver todas as respostas dos grupos I e II') +
      '<div class="acts"><button class="btn primary" id="s-rep" type="button">Fazer outra simulação</button>' + (e1.length + e2.length + e3.length ? '<button class="btn" id="s-rev" type="button">Rever os erros</button>' : '') + '<button class="btn ghost" id="s-ini" type="button">Início</button></div></section></div>';
    $('#s-rep').onclick = simulacao;
    const rv = $('#s-rev'); if (rv) rv.onclick = revisao;
    $('#s-ini').onclick = inicio;
    if (nota >= 18) setTimeout(confetis, 250);
  }
}

/* Grupo III: cada frase liga-se à coluna "A priori" ou "A posteriori" (toque) */
function telaTabela(ctx, itens, inicial, aoMudar, done){
  const resp = Object.assign({}, inicial || {});
  ctx.body.innerHTML = '<article class="mini pop-in"><p class="tag">Grupo III · Tabela</p><h2 class="qtext">Liga cada frase à coluna certa.</h2>' +
    '<p class="lead">Toca em “A priori” ou “A posteriori” em cada linha. Podes mudar até carregares em Corrigir.</p>' +
    '<div class="tab"><div class="tab-h" aria-hidden="true"><span>Frase</span><span>A priori</span><span>A posteriori</span></div>' +
    itens.map((it, r) => '<div class="tab-row" data-r="' + r + '"><p class="fr">' + esc(it.x) + '</p><div class="seg" role="group" aria-label="Classificação">' +
      ['pri', 'pos'].map(c => '<button class="seg-b" type="button" data-r="' + r + '" data-c="' + c + '" aria-pressed="' + (resp[r] === c) + '">' + (c === 'pri' ? 'A priori' : 'A posteriori') + '</button>').join('') + '</div></div>').join('') + '</div>' +
    '<p class="small muted" id="tab-falta"></p>' +
    '<button class="btn primary big" id="tab-ok" type="button">Corrigir</button><div class="fb" hidden></div></article>';
  const ok = $('#tab-ok');
  const estado = () => {
    const falta = itens.length - Object.keys(resp).length;
    $('#tab-falta').textContent = falta ? 'Faltam ' + falta + (falta === 1 ? ' frase.' : ' frases.') : 'Todas as frases estão ligadas.';
    ok.disabled = falta > 0;
  };
  estado();
  ctx.body.querySelectorAll('.seg-b').forEach(b => b.onclick = () => {
    const r = +b.dataset.r; resp[r] = b.dataset.c;
    ctx.body.querySelectorAll('.seg-b[data-r="' + r + '"]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    estado(); aoMudar(Object.assign({}, resp));
  });
  ok.onclick = () => {
    const res = itens.map((it, r) => ({ it, r:resp[r], ok:resp[r] === it.c }));
    const linhas = ctx.body.querySelectorAll('.tab-row');
    res.forEach((x, r) => {
      linhas[r].classList.add(x.ok ? 'right' : 'wrong');
      if (!x.ok) linhas[r].insertAdjacentHTML('beforeend', '<p class="corr">Certo: ' + (x.it.c === 'pri' ? 'A priori' : 'A posteriori') + '</p>');
    });
    ctx.body.querySelectorAll('.seg-b').forEach(b => b.disabled = true);
    ok.remove(); $('#tab-falta').remove();

    fb.querySelector('button').onclick = () => done(res);

}

function htmlLicao(n){
  const L = C.licoes[n]; if (!L) return '';

/* Uma secção da lição (usada na matéria toda e nas partes dentro dos mundos) */
function htmlSeccao(s){
  const tabela = t => '<p class="li-sub">' + esc(t.titulo) + '</p><div class="li-tabwrap"><table class="li-tab"><thead><tr>' + t.cab.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    t.linhas.map(l => '<tr>' + l.map((c, i) => '<td class="' + (c === '✓' || c === 'SIM' ? 'sim' : (c === '✗' || /^NÃO/.test(c)) ? 'nao' : '') + '">' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';

/* Minijogo dentro da lição: um caso de cada vez, com explicação (os cliques tratam-se em baixo) */
function htmlQuiz(key, ordem, k, certas){
  const set = C.classificar[key];
  ordem = ordem || baralhar(set.itens.map((_, i) => i)); k = k || 0; certas = certas || 0;
  const dados = ' data-set="' + key + '" data-ordem="' + ordem.join(',') + '" data-k="' + k + '" data-certas="' + certas + '"';
  if (k >= ordem.length) return '<div class="lq"' + dados + '><p class="fb-msg">Acertaste ' + certas + ' de ' + ordem.length + '.</p><p class="lead small">' + (certas === ordem.length ? 'Perfeito: já sabes ver que condição falta.' : 'Revê a tabela e tenta outra vez.') + '</p><button class="btn primary lq-rep" type="button">Repetir com outra ordem</button></div>';
  const it = set.itens[ordem[k]];
  return '<div class="lq"' + dados + '><p class="lq-n">Caso ' + (k + 1) + ' de ' + ordem.length + '</p><p class="lq-caso">' + esc(it.x) + '</p>' +
    '<div class="lq-ops">' + set.cats.map(c => '<button class="opt lq-b" data-c="' + c.k + '" type="button"><span>' + esc(c.l) + '</span></button>').join('') + '</div><div class="fb" hidden></div></div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.lq-b, .lq-next, .lq-rep'); if (!b) return;
  const box = b.closest('.lq'), key = box.dataset.set, set = C.classificar[key];
  const ordem = box.dataset.ordem.split(',').map(Number), k = +box.dataset.k, certas = +box.dataset.certas;
  if (b.classList.contains('lq-rep')){ box.outerHTML = htmlQuiz(key); return; }
  if (b.classList.contains('lq-next')){ box.outerHTML = htmlQuiz(key, ordem, k + 1, certas); return; }
  if (box.dataset.feito) return; box.dataset.feito = '1';
  const it = set.itens[ordem[k]], ok = b.dataset.c === it.c;
  box.querySelectorAll('.lq-b').forEach(x => { x.disabled = true; if (x.dataset.c === it.c) x.classList.add('right'); });
  if (!ok) b.classList.add('wrong');
  if (ok){ acerto(); box.dataset.certas = certas + 1; } else erro(it.id);
  const fb = box.querySelector('.fb'); fb.hidden = false; fb.className = 'fb pop-in ' + (ok ? 'is-ok' : 'is-bad');
  fb.innerHTML = '<p class="fb-msg">' + (ok ? 'Certo!' : 'Ainda não.') + '</p><p class="fb-e">' + esc(it.e || set.porque[it.c]) + '</p><button class="btn primary lq-next" type="button">' + (k + 1 < ordem.length ? 'Próximo caso' : 'Ver resultado') + '</button>';
});

/* =====================================================================
   CARTÕES DE ESTUDO
   ===================================================================== */
function cartoes(filtro){
  limpar(); topo();
  const porTema = /^m[1-5]$/.test(filtro), tema = porTema ? +filtro[1] : 0;
  const lista = C.cartoes.filter(c => filtro === 'todos' || (porTema ? c.m === tema : filtro === 'abertas' ? c.aberta : !c.aberta));
  const ordenar = arr => baralhar(arr).sort((a, b) => a.m - b.m); // pela ordem da matéria
  let fila = ordenar(lista.filter(c => S.cartoes[c.id] !== 1)).concat(ordenar(lista.filter(c => S.cartoes[c.id] === 1)));
  let virado = false;
  const sabidos = () => lista.filter(c => S.cartoes[c.id] === 1).length;
  const filtros = [['todos','Todos'], ['abertas','Respostas abertas'], ['conceitos','Conceitos']].concat(C.mundos.map(m => ['m' + m.n, m.letra + ' ' + m.curto]));

  $app.innerHTML = '<div class="wrap" style="gap:14px"><header class="playbar"><button class="icon-btn" id="sair" type="button" aria-label="Sair para o início">✕</button>' +
    '<button class="icon-btn" id="cant" type="button" aria-label="Ver o cartão anterior" title="Cartão anterior" hidden>←</button>' +
    '<div class="pb-mid"><p class="pb-title">Cartões de estudo</p><div class="bar"><i id="pbar"></i></div></div><span></span><div class="pb-right"><span id="pcount"></span></div></header>' +
    '<div class="filtros">' + filtros.map(f => '<button class="mini-b ' + (f[0] === filtro ? 'on' : '') + '" data-f="' + f[0] + '" type="button" aria-pressed="' + (f[0] === filtro) + '">' + esc(f[1]) + '</button>').join('') + '</div>' +
    (porTema ? '<p class="aviso">Primeiro lê a matéria deste tema e só depois tenta os cartões. <button class="link-b" id="c-ler" type="button">Ler a matéria do Mundo ' + tema + '</button></p>' : '') +
    '<main class="stage" id="stage"></main></div>';
  $('#sair').onclick = inicio;
  $app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => cartoes(b.dataset.f));
  const ler = $('#c-ler'); if (ler) ler.onclick = () => abrirMateria(tema);
  const stage = $('#stage');

  const vistos = [], pa = $('#cant');
  const armar = (pode, fn) => { pa.hidden = !pode; pa.onclick = fn; armarVoltar(pode ? fn : inicio); };
  function verCartao(j){ // rever um cartão que já passou
    const c = vistos[j], ultimo = j + 1 >= vistos.length; let v = false;
    armar(j > 0, () => verCartao(j - 1));
    stage.innerHTML = '<p class="small muted">Cartão que já viste (' + (j + 1) + ' de ' + vistos.length + ')</p><div class="cartao"><button class="face pop-in" id="face" type="button" aria-label="Virar cartão">' + frente(c) + '</button></div>' +
      '<div class="acts"><button class="btn primary" id="cv-seg" type="button">' + (ultimo ? 'Voltar ao cartão onde ias →' : 'Seguinte →') + '</button></div>' +
      '<button class="btn ghost" id="c-mat" type="button">Ler a matéria deste tema (Mundo ' + c.m + ')</button>';
    const face = $('#face');
    face.onclick = () => { v = !v; face.innerHTML = v ? verso(c) : frente(c); face.classList.toggle('verso', v); };
    $('#cv-seg').onclick = () => ultimo ? render() : verCartao(j + 1);
    $('#c-mat').onclick = () => abrirMateria(c.m);
  }
  const atualizar = () => { $('#pbar').style.width = (sabidos() / lista.length * 100) + '%'; $('#pcount').textContent = sabidos() + '/' + lista.length; };
  const render = () => {
    atualizar(); virado = false;
    armar(vistos.length > 0, () => verCartao(vistos.length - 1));
    if (!fila.length){
      stage.innerHTML = '<section class="res pop-in"><p class="eyebrow">Baralho terminado</p><p class="big">' + sabidos() + '<small>/' + lista.length + '</small></p><h2>Já sabes ' + sabidos() + ' de ' + lista.length + ' cartões.</h2>' +
        '<div class="acts"><button class="btn primary" id="c-rep" type="button">Recomeçar baralho</button><button class="btn ghost" id="c-ini" type="button">Início</button></div></section>';
      $('#c-rep').onclick = () => cartoes(filtro); $('#c-ini').onclick = inicio;
      if (sabidos() === lista.length) confetis();
      return;
    }
    const c = fila[0];
    stage.innerHTML = '<div class="cartao"><button class="face pop-in" id="face" type="button" aria-label="Virar cartão">' + frente(c) + '</button></div><div class="acts" id="c-acts"></div>' +
      '<button class="btn ghost" id="c-mat" type="button">Ainda não sei: ler a matéria deste tema (Mundo ' + c.m + ')</button>';
    $('#face').onclick = virar;
    $('#c-mat').onclick = () => abrirMateria(c.m);
  };
  const frente = c => '<p class="tag">' + (c.aberta ? 'Resposta aberta (estilo teste)' : 'Conceito') + ' · Mundo ' + c.m + '</p><p class="ft' + (c.frente.length > 140 ? ' longa' : '') + '">' + esc(c.frente) + '</p><p class="hint-t">Pensa na resposta e toca para a ver</p>';
  const verso = c => '<p class="tag">Resposta</p><p class="vt">' + esc(c.verso) + '</p>' + (c.exemplo ? '<p class="ex"><b>Exemplo: </b>' + esc(c.exemplo) + '</p>' : '') + '<p class="hint-t">Toca para voltar à pergunta</p>';
  const virar = () => {
    const face = $('#face'), c = fila[0];
    face.classList.remove('pop-in'); face.classList.add('flip-out');
    setTimeout(() => {
      virado = !virado;
      face.innerHTML = virado ? verso(c) : frente(c);
      face.classList.toggle('verso', virado); face.classList.remove('flip-out');
      if (virado && !$('#c-acts').children.length){
        $('#c-acts').innerHTML = '<button class="btn" id="c-rev" type="button">Rever outra vez</button><button class="btn primary" id="c-sei" type="button">Já sei</button>';
        $('#c-sei').onclick = () => { vistos.push(c); S.cartoes[c.id] = 1; guardar(); fila.shift(); fila = fila.filter(x => x !== c); render(); };
        $('#c-rev').onclick = () => {
          vistos.push(c); S.cartoes[c.id] = 0; guardar(); fila.shift();
          fila.splice(Math.min(fila.length, 3), 0, c);
          if (fila.length > 6) fila.push(c);
          render();
        };
      }
    }, 160);
  };
  render();
}

/* =====================================================================
   CONFETTIS
   ===================================================================== */
function confetis(){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(e){}
  const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
  const g = cv.getContext('2d'); if (!g){ cv.remove(); return; }
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cores = ['--accent','--gold','--ok','--bad','--sky'].map(v => cs.getPropertyValue(v).trim() || '#f0b400');
  const ps = Array.from({ length:150 }, () => ({ x:W / 2 + (Math.random() - .5) * W * .4, y:H * .3, vx:(Math.random() - .5) * 13, vy:-Math.random() * 13 - 4, r:Math.random() * 7 + 5, a:Math.random() * 6, va:(Math.random() - .5) * .3, c:sorte(cores) }));
  const t0 = performance.now();
  (function f(t){
    g.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

/* =====================================================================
   SOM "SQUISH" (Web Audio, sem ficheiros) — desligado por defeito
   ===================================================================== */
// Os sons ficam entre 300 e 3000 Hz: é o que os altifalantes dos telemóveis conseguem tocar
// (sons muito graves, abaixo de ~250 Hz, quase não se ouvem num telemóvel).
let AC = null;
function audio(){
  if (!AC){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; AC = new A(); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
// iPhone/Android: o som só arranca depois de um toque, por isso "acorda-se" o áudio no primeiro toque
document.addEventListener('pointerdown', () => { if (S.def.som) try { audio(); } catch(e){} }, { passive:true, capture:true });

/* Desenha um som num contexto de áudio (também serve para o testar sem colunas, com OfflineAudioContext) */
function desenharSom(ac, dest, t, tipo){
  const out = ac.createGain(); out.gain.value = 0.9; out.connect(dest);
  const tom = (atraso, f0, f1, dur, vol, forma) => {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = t + atraso;
    o.type = forma || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.03);
  };
  const ruido = (f0, f1, dur, vol) => { // parte "molhada" do squish: ruído filtrado que fecha
    const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    n.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.value = vol; n.connect(f); f.connect(g); g.connect(out); n.start(t);
  };
  if (tipo === 'certo'){ // squish + brilho a subir
    ruido(2600, 700, 0.16, 0.45); tom(0, 640, 220, 0.2, 0.32);
    tom(0.09, 880, 1320, 0.14, 0.16);
  } else if (tipo === 'errado'){ // "blop" suave a descer, nada agressivo
    tom(0, 392, 262, 0.22, 0.26, 'triangle'); tom(0.05, 330, 220, 0.2, 0.12);
  } else if (tipo === 'nivel'){ // pequeno arpejo
    [523, 659, 784, 1047].forEach((f, i) => tom(i * 0.09, f, f * 1.01, 0.22, 0.2, 'triangle'));
  } else { // toque num blob
    ruido(2200, 520, 0.15, 0.45); tom(0, 560, 190, 0.18, 0.3);
  }
}
function tocar(tipo){
  if (!S.def.som) return;
  try { const ac = audio(); if (ac) desenharSom(ac, ac.destination, ac.currentTime + 0.01, tipo); } catch(e){}
}
function somSquish(){ tocar('squish'); }

/* =====================================================================
   FUNDO DE SLIME — metaballs num canvas de baixa resolução, ampliado
   (cada blob = 2 bolas que se fundem, por isso a forma muda devagar)
   ===================================================================== */
const FUNDO = (() => {
  const CORES = { rosa:[255,183,214], lilas:[208,186,255], menta:[166,234,207], azul:[168,214,255], pessego:[255,204,168], manteiga:[255,229,138] };
  // [cor, x, y, raio relativo, é butter slime?]
  const SEMENTES = [
    ['rosa',.16,.12,.19], ['lilas',.84,.2,.18], ['menta',.22,.52,.16], ['azul',.8,.6,.2],
    ['pessego',.48,.88,.17], ['manteiga',.6,.36,.14,true], ['lilas',.1,.88,.15], ['manteiga',.92,.94,.13,true]
  ];
  let cv, g, sc, sg, img, W = 0, H = 0, R = 0, cell = 6, gw = 0, gh = 0;
  let blobs = [], brilhos = [], bolas = [], raf = 0, last = 0, t = 0;
  let reduz = false, pronto = false;
  const rnd = (a, b) => a + Math.random() * (b - a);

  function iniciar(){
    try {
      cv = document.createElement('canvas'); cv.id = 'fundo'; cv.setAttribute('aria-hidden', 'true');
      document.body.insertBefore(cv, document.body.firstChild);
      g = cv.getContext('2d'); sc = document.createElement('canvas'); sg = sc.getContext('2d');
      if (!g || !sg) return;
    } catch(e){ return; }
    blobs = SEMENTES.map(s => ({ c:CORES[s[0]], bx:s[1], by:s[2], rr:s[3], butter:!!s[4], a:s[4] ? 0.96 : 0.72,
      ax:rnd(.05,.09), ay:rnd(.04,.07), v1:rnd(.07,.14), v2:rnd(.06,.12), v3:rnd(.18,.32), p:rnd(0, 6.28), sq:0, sv:0 }));
    brilhos = Array.from({ length:14 }, (_, i) => ({ x:Math.random(), y:Math.random(), s:rnd(3, 7), v:rnd(.4, .9), p:rnd(0, 6.28), c:['255,255,255','255,222,150','226,206,255'][i % 3] }));
    t = rnd(0, 100);
    try {
      const mq = matchMedia('(prefers-reduced-motion: reduce)'); reduz = mq.matches;
      const muda = e => { reduz = e.matches; aplicar(); };
      if (mq.addEventListener) mq.addEventListener('change', muda); else if (mq.addListener) mq.addListener(muda);
    } catch(e){}
    addEventListener('resize', medir);
    document.addEventListener('visibilitychange', aplicar);
    document.addEventListener('pointerdown', toque, { passive:true });
    pronto = true; medir(); aplicar();
  }

  function medir(){
    if (!pronto) return;
    W = innerWidth; H = innerHeight; R = Math.sqrt(W * H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.max(6, Math.ceil(Math.max(W, H) / 200));
    gw = Math.ceil(W / cell) + 1; gh = Math.ceil(H / cell) + 1;
    sc.width = gw; sc.height = gh; img = sg.createImageData(gw, gh);
    if (S.def.fundo) desenhar();
  }

  function posicoes(){
    bolas = [];
    blobs.forEach(b => {
      const x = (b.bx + Math.sin(t * b.v1 + b.p) * b.ax) * W, y = (b.by + Math.cos(t * b.v2 + b.p * 1.3) * b.ay) * H;
      const r = b.rr * R, w = 1 + 0.07 * Math.sin(t * 0.5 + b.p), k = (1 + b.sq) * w;
      b.x = x; b.y = y; b.r = r; b.sx = k; b.sy = 1 / k;
      const ang = t * b.v3 + b.p, d = r * 0.55;
      bolas.push({ x, y, r2:r * r, ix:1 / b.sx, iy:1 / b.sy, b });
      bolas.push({ x:x + Math.cos(ang) * d * b.sx, y:y + Math.sin(ang) * d * b.sy, r2:r * r * 0.36, ix:1 / b.sx, iy:1 / b.sy, b });
    });
  }

  function campoEm(px, py){
    let s = 0, melhor = null, fm = 0;
    for (const q of bolas){ const dx = (px - q.x) * q.ix, dy = (py - q.y) * q.iy, f = q.r2 / (dx * dx + dy * dy + 1); s += f; if (f > fm){ fm = f; melhor = q.b; } }
    return { s, melhor };
  }

  function campo(){
    const d = img.data, n = bolas.length; let i = 0;
    for (let gy = 0; gy < gh; gy++){
      const py = gy * cell;
      for (let gx = 0; gx < gw; gx++, i += 4){
        const px = gx * cell; let s = 0, r = 0, gg = 0, bb = 0, a = 0;
        for (let k = 0; k < n; k++){
          const q = bolas[k], dx = (px - q.x) * q.ix, dy = (py - q.y) * q.iy, f = q.r2 / (dx * dx + dy * dy + 1), c = q.b.c;
          s += f; r += f * c[0]; gg += f * c[1]; bb += f * c[2]; a += f * q.b.a;
        }
        if (s < 0.72){ d[i + 3] = 0; continue; }
        const inv = 1 / s, e0 = s >= 1.04 ? 1 : (s - 0.72) / 0.32, e = e0 * e0 * (3 - 2 * e0);
        const luz = Math.min(0.25, Math.max(0, (s - 1) * 0.05)); // centro mais claro = aspeto cremoso
        r *= inv; gg *= inv; bb *= inv;
        d[i] = r + (255 - r) * luz; d[i + 1] = gg + (255 - gg) * luz; d[i + 2] = bb + (255 - bb) * luz;
        d[i + 3] = e * a * inv * 255;
      }
    }
    sg.putImageData(img, 0, 0);
  }

  function estrela(x, y, s, a, c){
    g.fillStyle = 'rgba(' + c + ',' + a + ')';
    g.beginPath(); g.moveTo(x, y - s);
    g.quadraticCurveTo(x, y, x + s, y); g.quadraticCurveTo(x, y, x, y + s);
    g.quadraticCurveTo(x, y, x - s, y); g.quadraticCurveTo(x, y, x, y - s); g.fill();
  }

  function desenhar(){
    if (!pronto || !W) return;
    posicoes(); campo();
    g.clearRect(0, 0, W, H);
    g.imageSmoothingEnabled = true;
    g.drawImage(sc, 0, 0, gw * cell, gh * cell);
    // brilho suave por cima de cada blob (mais forte no butter slime)
    blobs.forEach(b => {
      g.save(); g.translate(b.x - b.r * 0.28 * b.sx, b.y - b.r * 0.4 * b.sy); g.scale(b.sx * 1.3, b.sy * 0.8);
      const hr = b.r * 0.5, rg = g.createRadialGradient(0, 0, 0, 0, 0, hr);
      rg.addColorStop(0, 'rgba(255,255,255,' + (b.butter ? 0.8 : 0.5) + ')'); rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(0, 0, hr, 0, 6.2832); g.fill();
      g.fillStyle = 'rgba(255,255,255,' + (b.butter ? 0.85 : 0.6) + ')';
      g.beginPath(); g.ellipse(-hr * 0.15, -hr * 0.1, hr * 0.16, hr * 0.09, -0.5, 0, 6.2832); g.fill();
      g.restore();
    });
    // glitter que pisca devagar
    brilhos.forEach(s => {
      const v = Math.sin(t * s.v + s.p); if (v <= 0.3) return;
      const a = Math.pow((v - 0.3) / 0.7, 3) * 0.9;
      estrela(s.x * W, s.y * H, s.s * (0.6 + 0.4 * a), a, s.c);
    });
  }

  function frame(ts){
    raf = requestAnimationFrame(frame);
    if (!last){ last = ts; return; }
    if (ts - last < 40) return; // ~25 fps chega para movimento lento e poupa bateria
    const dt = Math.min(0.06, (ts - last) / 1000); last = ts; t += dt;
    // mola amortecida: achata, estica e volta com efeito gelatina
    blobs.forEach(b => { const ac = -70 * b.sq - 5 * b.sv; b.sv += ac * dt; b.sq += b.sv * dt; });
    desenhar();
  }
  function parar(){ if (raf) cancelAnimationFrame(raf); raf = 0; last = 0; }

  function aplicar(){
    if (!pronto) return;
    const on = !!S.def.fundo;
    document.body.classList.toggle('com-fundo', on);
    cv.hidden = !on;
    if (on && !reduz && !document.hidden){ if (!raf) raf = requestAnimationFrame(frame); }
    else { parar(); if (on){ blobs.forEach(b => { b.sq = 0; b.sv = 0; }); desenhar(); } }
  }

  function squish(b, forca){
    if (!raf) return; // fundo parado (desligado ou movimento reduzido)
    b.sq = forca; b.sv = 0;
  }
  function squishTodos(){
    if (!pronto || !raf) return;
    blobs.forEach(b => squish(b, 0.26));
  }
  function toque(e){
    if (!raf || !e.target || !e.target.closest) return;
    if (e.target.closest('button, a, input, select, textarea, label, .q, .mini, .res, .player, .mundo, .acao, .sp-card, .face, .playbar, .hero, .rodape, .aviso, .sheet, .confirma, .plano, .dobra, .continuar')) return;
    const r = campoEm(e.clientX, e.clientY);
    if (r.s > 0.9 && r.melhor){ squish(r.melhor, 0.42); somSquish(); }
  }

  return { iniciar, aplicar, squishTodos };
})();

FUNDO.iniciar();
inicio();
if ('serviceWorker' in navigator && location.protocol !== 'file:'){ addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
