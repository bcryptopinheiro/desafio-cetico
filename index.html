<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Desafio Cético — Filosofia 11.º ano</title>
<meta name="description" content="Jogo para estudar Filosofia 11.º ano: conhecimento, ceticismo e origem do conhecimento.">
<meta name="theme-color" content="#ECEFF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1322" media="(prefers-color-scheme: dark)">
<!-- PWA: manifest e ícones (pode ser adicionado ao ecrã principal e funciona sem internet) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desafio Cético">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=GFS+Didot&family=IBM+Plex+Mono:wght@500;600&family=Young+Serif&display=swap">
<style>
/* Layout: uma coluna centrada (máx. 720px); o mapa é um caminho vertical de 5 mundos marcados com letras gregas α–ε */
:root{
  --bg:#ECEFF6; --surface:#FFFFFF; --surface-2:#F4F6FC; --ink:#161D36; --muted:#56608A; --line:#D3D9EA;
  --accent:#2443D0; --accent-ink:#FFFFFF; --accent-soft:#DFE5FF;
  --gold:#D99A00; --gold-soft:#FFF0C4; --ok:#0F8456; --ok-soft:#D7F2E5; --bad:#C9372F; --bad-soft:#FBE0DC; --sky:#1398BB;
  --shadow:0 1px 0 rgba(22,29,54,.05), 0 8px 22px -12px rgba(22,29,54,.28);
  --f-display:'Young Serif', Georgia, 'Times New Roman', serif;
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --f-greek:'GFS Didot', 'Times New Roman', serif;
  --r:16px;
  --glass:rgba(255,255,255,.72); --fundo-op:1;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#171E35; --surface-2:#1D2541; --ink:#E8ECF8; --muted:#9CA6C8; --line:#2B355A;
  --accent:#8499FF; --accent-ink:#0E1322; --accent-soft:#252F66;
  --gold:#FFC93C; --gold-soft:#3B3115; --ok:#3DD09A; --ok-soft:#163A2D; --bad:#FF7D72; --bad-soft:#45201E; --sky:#4CC8E8;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark;
  --glass:rgba(23,30,53,.74); --fundo-op:.5; } }
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E35; --surface-2:#1D2541; --ink:#E8ECF8; --muted:#9CA6C8; --line:#2B355A;
  --accent:#8499FF; --accent-ink:#0E1322; --accent-soft:#252F66;
  --gold:#FFC93C; --gold-soft:#3B3115; --ok:#3DD09A; --ok-soft:#163A2D; --bad:#FF7D72; --bad-soft:#45201E; --sky:#4CC8E8;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark;
  --glass:rgba(23,30,53,.74); --fundo-op:.5; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5; overflow-x:hidden}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); font-weight:400; text-wrap:balance; margin:0; line-height:1.15}
p{margin:0}
.wrap{max-width:720px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:20px 56px; display:flex; flex-direction:column; gap:22px}
.eyebrow{font-family:var(--f-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- Início ---------- */
.hero{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:end; padding-top:8px}
.hero h1{font-size:clamp(36px, 9vw, 54px); letter-spacing:-.01em}
.hero h1 .sub{display:block; font-size:.42em; color:var(--muted); margin-top:6px; letter-spacing:0}
.epoche{text-align:right; color:var(--accent)}
.epoche b{display:block; font-family:var(--f-greek); font-weight:400; font-size:clamp(34px,8vw,48px); line-height:1}
.epoche span{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; color:var(--muted)}
@media (max-width:480px){ .hero{grid-template-columns:1fr} .epoche{text-align:left; display:flex; align-items:baseline; gap:10px} .epoche b{font-size:30px} }
.meander{height:12px; color:var(--accent); opacity:.55}
.meander svg{display:block; width:100%; height:12px}

.player{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center}
.lvl{width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-display); font-size:26px}
.player .nm{font-family:var(--f-display); font-size:20px}
.xpbar{height:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:6px}
.xpbar i{display:block; height:100%; background:linear-gradient(90deg, var(--gold), var(--accent)); border-radius:99px; transition:width .6s ease}
.player .meta{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-family:var(--f-mono); font-size:12px; color:var(--muted); margin-top:5px; font-variant-numeric:tabular-nums}

.aviso{background:var(--gold-soft); border-radius:12px; padding:12px 14px; font-size:15px}
.aviso b{font-weight:700}

.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.sec-h h2{font-size:24px}

.mapa{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; position:relative}
.mapa::before{content:""; position:absolute; left:31px; top:30px; bottom:30px; border-left:3px dotted var(--line)}
.mundo{position:relative; display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:center; width:100%; text-align:left; background:var(--surface); border:2px solid transparent; border-radius:var(--r); box-shadow:var(--shadow); padding:14px 14px 14px 0; transition:transform .15s ease, border-color .15s}
.mundo:not(:disabled):hover{border-color:var(--accent); transform:translateY(-1px)}
.mundo:disabled{cursor:not-allowed; background:var(--surface-2); box-shadow:none}
.no{justify-self:end; width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); font-family:var(--f-greek); font-size:30px; line-height:1; position:relative; z-index:1}
.mundo:disabled .no{background:var(--line); color:var(--muted)}
.mundo.feito .no{background:var(--ok); color:var(--surface)}
.mundo .tx{min-width:0; display:flex; flex-direction:column; gap:3px}
.mundo .tt{font-family:var(--f-display); font-size:19px; line-height:1.2}
.mundo .rs{font-size:14px; color:var(--muted)}
.mundo .rw{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:4px}
.stars{display:inline-flex; gap:2px}
.stars svg{width:20px; height:20px; fill:var(--line)}
.stars svg.on{fill:var(--gold)}
.chip{font-family:var(--f-mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:99px; background:var(--accent-soft); color:var(--ink)}
.chip.lock{background:transparent; border:1px solid var(--line); color:var(--muted); display:inline-flex; gap:5px; align-items:center; text-transform:none; letter-spacing:0}
.chip.lock svg{width:12px; height:12px; fill:currentColor}
.pct{font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

.acoes{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media (max-width:560px){ .acoes{grid-template-columns:1fr} }
.acao{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); padding:14px; text-align:left; display:flex; flex-direction:column; gap:4px; min-height:92px; transition:border-color .15s, transform .15s}
.acao:hover{border-color:var(--accent); transform:translateY(-1px)}
.acao .t{font-family:var(--f-display); font-size:18px}
.acao .d{font-size:14px; color:var(--muted)}
.acao.final{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.acao.final .d{color:inherit; opacity:.85}
.badge{display:inline-block; min-width:24px; padding:0 7px; border-radius:99px; background:var(--bad); color:var(--surface); font-family:var(--f-mono); font-size:13px; text-align:center; margin-left:6px; vertical-align:2px}

.minis{display:flex; flex-wrap:wrap; gap:8px}
.mini-b{border:1.5px solid var(--line); background:var(--surface); border-radius:99px; padding:10px 14px; font-size:15px; min-height:44px}
.mini-b:hover{border-color:var(--accent)}

.rodape{border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--muted)}
.rodape .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.link-b{background:none; border:none; padding:6px 0; text-decoration:underline; color:var(--muted); font-size:14px}

/* ---------- Botões ---------- */
.btn{border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 18px; min-height:52px; font-weight:700; font-size:16px; transition:transform .1s, background .15s, border-color .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.btn.big{width:100%; font-size:18px; min-height:58px}
.acts{display:flex; gap:10px; flex-wrap:wrap}
.acts .btn{flex:1 1 180px}

/* ---------- Ecrã de jogo ---------- */
.playbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); display:flex; gap:10px; align-items:center; padding-block:10px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.icon-btn{width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--surface); font-size:18px; display:grid; place-items:center}
.pb-title{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pb-mid{flex:1; min-width:0}
.bar{height:10px; background:var(--surface); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:4px}
.bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s ease}
.pb-right{display:flex; flex-direction:column; align-items:flex-end; font-family:var(--f-mono); font-size:13px; font-variant-numeric:tabular-nums; min-width:52px}
.pb-combo{color:var(--gold); font-weight:600; font-size:12px; min-height:16px}
.stage{display:flex; flex-direction:column; gap:16px}

.q, .mini{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); padding:20px 18px; display:flex; flex-direction:column; gap:16px}
.tag{font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.qtext{font-size:clamp(22px, 5.4vw, 28px); line-height:1.25}
.lead{color:var(--muted)}
.blank{display:inline-block; min-width:4.5em; border-bottom:3px solid var(--accent); color:transparent; line-height:1}
.blank.filled{color:var(--ok); border-color:var(--ok); padding:0 4px}
.opts{display:flex; flex-direction:column; gap:10px}
.opts.vf{flex-direction:row}
.opts.vf .opt{flex:1; justify-content:center}
.opt{display:flex; align-items:center; gap:12px; text-align:left; width:100%; min-height:56px; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--surface-2); font-size:17px; transition:border-color .15s, background .15s}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{flex:none; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-family:var(--f-mono); font-size:13px; background:var(--surface); border:1.5px solid var(--line)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .key{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt.picked{border-color:var(--accent); background:var(--accent-soft)}
.opt:disabled:not(.right):not(.wrong):not(.picked){opacity:.6}

.fb{border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px}
.fb.is-ok{background:var(--ok-soft)}
.fb.is-bad{background:var(--bad-soft)}
.fb.is-info{background:var(--surface-2)}
.fb-msg{font-weight:700; font-size:18px}
.fb.is-ok .fb-msg{color:var(--ok)}
.fb.is-bad .fb-msg{color:var(--bad)}
.fb-e{font-size:16px}

/* Ordena */
.slots{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.slot{display:grid; grid-template-columns:38px 1fr; gap:10px; align-items:center; min-height:54px; border-radius:12px; border:2px dashed var(--line); padding:6px 8px}
.slot:not(.empty){border-style:solid; background:var(--surface-2)}
.slot.right{border-color:var(--ok); background:var(--ok-soft)}
.slot.wrong{border-color:var(--bad); background:var(--bad-soft)}
.sn{font-family:var(--f-mono); font-weight:600; font-size:13px; color:var(--muted); text-align:center}
.ph{color:var(--muted); font-size:14px}
.slot-b{background:none; border:none; text-align:left; padding:6px 2px; font-size:15px; width:100%}
.slot-b:disabled{cursor:default}
.pecas{display:flex; flex-direction:column; gap:8px}
.peca{text-align:left; border:2px solid var(--accent); background:var(--accent-soft); border-radius:12px; padding:12px 14px; font-size:15px; min-height:52px}
.ordem-certa{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px; font-size:15px}

/* Liga */
.lig{display:flex; flex-direction:column; gap:14px}
.col-h{font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.lig-a{display:flex; flex-wrap:wrap; gap:8px}
.lig-b{display:flex; flex-direction:column; gap:8px}
.lk{border:2px solid var(--line); background:var(--surface-2); border-radius:12px; padding:10px 14px; min-height:50px; text-align:left; font-size:16px}
.lig-a .lk{font-weight:700}
.lk.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft)}
.lk:disabled{cursor:default}
.lk.m0{border-color:var(--ok); background:var(--ok-soft)}
.lk.m1{border-color:var(--sky); background:var(--surface-2); box-shadow:inset 6px 0 0 var(--sky)}
.lk.m2{border-color:var(--gold); background:var(--gold-soft)}
.lk.m3{border-color:var(--accent); background:var(--accent-soft)}
.lk .pr{font-family:var(--f-mono); font-size:12px; margin-right:6px; color:var(--muted)}

/* Classifica rápido */
.hint{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.sprint{display:flex; flex-direction:column; gap:14px}
.sp-top{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center}
.timer{height:14px; border-radius:99px; background:var(--surface); border:1px solid var(--line); overflow:hidden}
.timer i{display:block; height:100%; background:var(--gold); border-radius:99px}
.sp-time{font-family:var(--f-mono); font-weight:600; font-size:22px; min-width:2.2em; text-align:right; font-variant-numeric:tabular-nums}
.sp-stats{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:14px; color:var(--muted)}
.sp-stats b{color:var(--ink)}
.combo{color:var(--gold); font-weight:600}
.sp-card{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); min-height:170px; display:grid; place-items:center; padding:22px; text-align:center; border:3px solid transparent}
.sp-card p{font-family:var(--f-display); font-size:clamp(22px,5.6vw,30px); line-height:1.25; text-wrap:balance}
.sp-btns{display:grid; gap:10px; grid-template-columns:1fr 1fr}
.sp-btns.n3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:440px){ .sp-btns.n3{grid-template-columns:1fr} }
.sp-b{min-height:66px; font-size:17px}
.sp-b:nth-child(1){border-color:var(--accent)}
.sp-b:nth-child(2){border-color:var(--gold)}
.sp-b:nth-child(3){border-color:var(--sky)}
.lista-err{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px; font-size:15px}

/* Resultados */
.res{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); padding:24px 18px; display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center}
.res .big{font-family:var(--f-display); font-size:64px; line-height:1}
.res .big small{font-size:.4em; color:var(--muted)}
.res .stars svg{width:44px; height:44px}
.res .stars svg.on{animation:starIn .5s cubic-bezier(.3,1.6,.5,1) both}
.res .stars svg.on:nth-child(2){animation-delay:.15s}
.res .stars svg.on:nth-child(3){animation-delay:.3s}
.res .acts{width:100%}
.stats{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; font-family:var(--f-mono); font-size:13px}
.stats span{background:var(--surface-2); border-radius:99px; padding:6px 12px}
.revlist{display:flex; flex-direction:column; gap:12px; width:100%; text-align:left}
.revitem{border:1.5px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:6px; font-size:15px}
.revitem .qq{font-weight:700; font-size:16px}
.revitem .tu{color:var(--bad)}
.revitem .ce{color:var(--ok)}

/* Cartões */
.filtros{display:flex; gap:8px; flex-wrap:wrap}
.filtros .mini-b.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.cartao{perspective:1000px}
.face{width:100%; min-height:300px; border:none; border-radius:22px; box-shadow:var(--shadow); background:var(--surface); padding:24px 20px; display:flex; flex-direction:column; gap:14px; justify-content:center; text-align:left; transition:transform .16s ease-in}
.face.verso{background:var(--surface-2); border:2px solid var(--accent)}
.face.flip-out{transform:rotateY(90deg)}
.face .ft{font-family:var(--f-display); font-size:clamp(22px,5.6vw,30px); line-height:1.25; white-space:pre-line}
.face .ft.longa{font-size:19px; line-height:1.4}
.face .vt{font-size:17px; white-space:pre-line}
.face .ex{font-size:15px; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.face .ex b{color:var(--ink)}
.face .hint-t{font-family:var(--f-mono); font-size:12px; color:var(--muted)}

/* Toasts */
#toasts{position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 64px); z-index:30; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding-inline:16px}
.toast{background:var(--ink); color:var(--bg); border-radius:99px; padding:8px 16px; font-weight:700; font-size:15px; box-shadow:var(--shadow); animation:toastIn 1.9s ease both; max-width:100%; text-align:center}
.toast.xp{background:var(--gold); color:#1d1600}
.confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40}

/* Animações */
.pop-in{animation:popIn .25s ease both}
.opt.right, .slot.right{animation:pulse .35s ease}
.opt.wrong, .slot.wrong, .shake{animation:shake .35s ease}
.sp-card.in{animation:popIn .18s ease both}
.sp-card.ok{border-color:var(--ok); animation:popIn .18s ease both}
.sp-card.bad{border-color:var(--bad); animation:shake .3s ease}
@keyframes popIn{from{opacity:.4; transform:translateY(6px) scale(.98)} to{opacity:1; transform:none}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes shake{20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)} to{transform:none}}
@keyframes toastIn{0%{opacity:0; transform:translateY(-8px)} 12%{opacity:1; transform:none} 80%{opacity:1} 100%{opacity:0; transform:translateY(-6px)}}

<script>
/* =====================================================================
   CONTEÚDO — tudo o que é matéria está aqui. Para acrescentar perguntas:
   - Escolha múltipla:  { id:'m2-50', m:2, s:0, t:'mc', q:'Pergunta', o:['CERTA','errada','errada','errada'], e:'Explicação' }
   - Verdadeiro/falso:  { id:'m2-51', m:2, s:0, t:'vf', q:'Afirmação', a:true|false, e:'Explicação' }
   - Completa a frase:  { id:'m2-52', m:2, s:0, t:'completa', q:'Frase com ___ no sítio da palavra', o:['CERTA','errada',...], e:'...' }
   A primeira opção de "o" é sempre a certa (as opções são baralhadas no jogo).
   "m" é o número do mundo (1–5) e "s" é a secção da lição desse mundo onde a matéria é explicada
   (a pergunta só aparece no mundo depois dessa parte da matéria). Cada id tem de ser único.
   destaque:true = pergunta de matéria nova; o teste final inclui sempre pelo menos
   "testeFinal.minDestaque" perguntas destas.
   ===================================================================== */
const CONTEUDO = {
  niveis: [
    { xp:0,    nome:'Cético Iniciante' },
    { xp:150,  nome:'Questionador' },
    { xp:400,  nome:'Fundacionalista' },
    { xp:800,  nome:'Epistemólogo' },
    { xp:1400, nome:'Mestre do Conhecimento' }
  ],

  mundos: [
    { n:1, letra:'α', curto:'Conhecer', titulo:'O que é conhecer', resumo:'Epistemologia, os seus problemas e a definição tradicional.', nPerguntas:12, especiais:[{k:'ligar', set:'problemas'}, {k:'sprint', set:'condicoes'}], partes:[[0,1],[2],[3,4],[6,7],[8,9]], teste:false },
    { n:2, letra:'β', curto:'Tipos', titulo:'Tipos de conhecimento', resumo:'Proposicional, prático e por contacto, com o exercício da Julieta.', nPerguntas:12, especiais:[{k:'ligar', set:'tipos'}, {k:'sprint', set:'tipos'}], partes:[[0],[1],[2]], teste:true },
    { n:3, letra:'γ', curto:'Ceticismo', titulo:'Será possível conhecer?', resumo:'Problema da possibilidade, o desafio cético, os argumentos céticos e Pirro de Élis.', nPerguntas:13, especiais:[{k:'ligar', set:'ceticismo'}, {k:'sprint', set:'ceticos'}], partes:[[0,1],[2,3],[4,5],[6]], teste:true },
    { n:4, letra:'δ', curto:'Regressão', titulo:'A regressão infinita e a resposta fundacionalista', resumo:'O argumento cético, a sua validade e as crenças básicas.', nPerguntas:9, especiais:[{k:'ordem'}], partes:[[0],[1],[2]], teste:true },
    { n:5, letra:'ε', curto:'Origem', titulo:'De onde vem o conhecimento?', resumo:'Problema da origem, racionalismo e empirismo, a priori e a posteriori.', nPerguntas:11, especiais:[{k:'ligar', set:'origem'}, {k:'sprint', set:'apriori'}], partes:[[0,1],[2],[3]], teste:true }
  ],

  /* Lições: a matéria explicada, mostrada ANTES das perguntas de cada mundo.
     Segue o manual (pp. 8–19) e as fichas (pp. 13–18). Cada secção tem linhas [termo, explicação]
     (pode ter <b>negrito</b> e <i>itálico</i>). */
  licoes: {
    1: { ideia:'Antes de perguntar se podemos conhecer, é preciso saber o que é conhecer. (Manual, pp. 8–13)',
      seccoes:[
        { t:'A epistemologia (p. 8)', l:[
          ['Epistemologia','A parte da filosofia que estuda o <b>conhecimento</b>. Também se chama <b>filosofia do conhecimento</b> ou <b>teoria do conhecimento</b>. Vem da palavra grega para conhecimento, <i>epistéme</i> (+ <i>logos</i>, estudo).'] ]},
        { t:'Os 3 problemas da epistemologia (p. 8)', l:[
          ['1. Definição','«<b>O que é o conhecimento?</b>» (ou «O que é conhecer?»). Resposta estudada: a definição tradicional.'],
          ['2. Possibilidade','«<b>O conhecimento é possível?</b>» (ou «Será que temos crenças justificadas?»). Resposta estudada: o ceticismo radical (Mundo 3).'],
          ['3. Origem','«<b>Qual é a origem do conhecimento?</b>» Provém da razão ou da experiência? (Mundo 5)'],
          ['Nota','No manual, os problemas da possibilidade e da origem também têm as teorias de Descartes e de Hume, mas a professora disse que <b>não saem</b>.'] ]},
        { t:'O que é o conhecimento: sujeito e objeto (p. 9)', l:[
          ['Não é raro','Todos temos conhecimentos: saber o caminho de casa, saber coser um botão, conhecer os vizinhos, saber multiplicar… «Conhecer» e «saber» têm um significado semelhante.'],
          ['Sujeito','<b>Quem conhece.</b>'],
          ['Objeto','<b>Aquilo que é conhecido.</b>'],
          ['Conhecimento','É uma <b>relação entre um sujeito e um objeto</b>. Em todos os casos de conhecimento há pelo menos estes dois elementos.'],
          ['Autoconhecimento','Quando alguém se tenta conhecer a si próprio, o <b>sujeito e o objeto coincidem</b>.'] ]},
        { t:'As condições para haver conhecimento (pp. 12–13)', l:[
          ['1. A pergunta','O que tem de acontecer para podermos dizer que alguém <b>SABE</b> alguma coisa? Essas coisas chamam-se <b>condições do conhecimento</b>.'],
          ['2. Duas palavras-chave','<b>Necessária</b> = «sem isto, <b>NÃO</b>». Se faltar, não acontece.<br><b>Suficiente</b> = «com isto, <b>SIM</b>, de certeza». Se estiver lá, acontece.'],
          ['3. Como se ligam: o concerto','Para entrar num concerto precisas de: (1) <b>bilhete</b>, (2) <b>documento de identificação</b>, (3) ter <b>mais de 16 anos</b>.<br>• Cada uma é <b>NECESSÁRIA</b>: se faltar uma, não entras.<br>• Nenhuma sozinha é <b>SUFICIENTE</b>: só o bilhete não chega, só o documento não chega, só a idade não chega.<br>• As três <b>JUNTAS</b> são <b>SUFICIENTES</b>: com as três, entras de certeza.<br><b>Ideia principal:</b> várias condições necessárias, juntas, tornam-se suficientes.'],
          ['4. Aplicado ao conhecimento','É exatamente igual. Para a Ana saber que Lisboa é a capital de Portugal precisa de: (1) <b>acreditar</b> nisso (CRENÇA), (2) <b>ser verdade</b> (VERDADE), (3) ter <b>boas razões</b> (JUSTIFICAÇÃO).<br>• Cada uma é <b>NECESSÁRIA</b>: se faltar uma, não há conhecimento.<br>• Nenhuma sozinha é <b>SUFICIENTE</b>: só acreditar não chega; acreditar em algo verdadeiro por sorte não chega; ter boas razões para algo falso não chega.<br>• As três <b>JUNTAS</b> são <b>SUFICIENTES</b>: crença + verdade + justificação = conhecimento.'],
          ['Nos testes','Por isso os testes dizem: «condições necessárias e <b>conjuntamente</b> suficientes» (conjuntamente = as três juntas).'] ],
          tabela:{ titulo:'5. Em tabela', cab:['Crença','Verdade','Justifi\u00adcação','Há conhecimento?'], linhas:[
            ['✓','✓','✓','SIM'], ['✗','✓','✓','NÃO (falta crença)'], ['✓','✗','✓','NÃO (falta verdade)'], ['✓','✓','✗','NÃO (falta justificação)'] ]} },
        { t:'6. Exemplos do manual', l:[
          ['Falta a crença','O Carlos leu numa revista médica que o álcool em excesso provoca cirroses, mas pensou que era falso → <b>não sabe</b>.'],
          ['Falta a verdade','Há muito tempo havia razões para acreditar que a Terra era plana, mas era falso → <b>ninguém sabia</b> isso.'],
          ['Falta a justificação','A Teresa acredita que a Terra é maior do que a Lua porque ouviu dizer que o tamanho dos nomes exprime o tamanho das coisas → é verdade, mas foi sorte: <b>não sabe</b>.'],
          ['Tem as três','A Luísa acredita, por estudos científicos que leu, que o albinismo tem causa genética → <b>sabe</b>.'] ]},
        { t:'7. Minijogo rápido: sabe ou não sabe?', quiz:'condicoes', l:[] },
        { t:'A definição tradicional (pp. 12–13)', l:[
          ['Conhecimento','= <b>crença verdadeira justificada</b>. Vem de Platão, no diálogo <i>Teeteto</i>. Define o conhecimento <b>proposicional</b>.'],
          ['Tripartida','Indica <b>três condições necessárias</b>: crença, verdade e justificação. «P» é uma frase que pode ser verdadeira ou falsa; por exemplo, P = «Lisboa é a capital de Portugal». S sabe que P se <b>acreditar</b> em P, se P for <b>verdadeira</b> e se tiver uma <b>justificação adequada</b>. Juntas, as três condições são <b>suficientes</b>. Esta definição refere-se ao conhecimento proposicional.'],
          ['Exemplo do manual','Os autores sabem que os Países Baixos são uma monarquia porque: a) acreditam nisso; b) é verdade; c) têm justificação (leram em livros fidedignos e falaram com pessoas que lá vivem).'] ]},
        { t:'1.ª condição: a crença', l:[
          ['O que é','Ter uma crença é <b>acreditar numa proposição</b>, considerá-la verdadeira. É um <b>estado mental</b> de adesão a uma ideia. Pode ter <b>graus de convicção</b> variados: achar que é provavelmente verdadeira ou ter a certeza firme.'],
          ['Necessária','Dizer «conheço P, mas não acredito em P» é <b>contraditório</b> (ou «sei que o mar tem ondas, mas não acredito nisso»).'],
          ['O cartoon da Lua','Quem diz «Eu não acredito que o homem tenha ido à Lua» <b>não sabe</b> que fomos à Lua: <b>falta-lhe a crença</b> (mesmo sendo verdade e havendo provas).'],
          ['Não basta','As crenças podem ser verdadeiras ou falsas; só as verdadeiras podem ser conhecimento. «Acredito em extraterrestres» não é saber.'],
          ['A calculadora','Não «sabe» que 356 ÷ 4 = 89: não tem estados mentais nem crenças.'] ]},
        { t:'2.ª condição: a verdade', l:[
          ['Necessária','Uma crença falsa <b>não é conhecimento</b>. Não podemos saber que os pardais falam, porque não falam. Podemos saber <b>que</b> uma proposição é falsa, mas não podemos <b>conhecer</b> uma proposição falsa.'],
          ['Redundante','Não há conhecimento falso: «<b>conhecimento verdadeiro</b>» é uma expressão <b>redundante</b>. O conhecimento é <b>factivo</b>.'],
          ['Na prática','Quando percebemos que nos enganámos, dizemos «julgava», «pensava» ou «acreditava», e não «sabia». Não se diz que Aristóteles <b>sabia</b> que o coração era o órgão do pensamento, mas que <b>acreditava</b> nisso.'],
          ['Não basta','Uma crença verdadeira <b>por sorte</b> não é conhecimento: o aluno que acerta num palpite sem compreender o assunto não sabe.'] ]},
        { t:'3.ª condição: a justificação', l:[
          ['O que é','Ter <b>boas razões</b> para acreditar que a proposição é verdadeira. Ligam a crença à verdade, para que a convicção <b>não se deva ao acaso</b>.'],
          ['Boas razões','Ler num manual de História que D. Pedro V defendeu a abolição da escravatura; <b>ouvir o vento</b> para dizer que está vento lá fora.'],
          ['Más razões','Gostar do nome do rei; ter sonhado com vento ou ter lido uma ventania num romance.'],
          ['Não basta','Podemos ter boas razões para acreditar em algo falso (na Antiguidade havia razões para acreditar que a Terra era plana).'] ]}
      ],
      truque:'Para saber se alguém sabe, verifica as 3 condições por ordem: <b>acredita? é verdade? tem boas razões?</b> Se faltar uma, não há conhecimento.' },

    2: { ideia:'Há três tipos principais de conhecimento. O que os distingue é o <b>objeto</b>: aquilo que se conhece. (Manual, pp. 10–11)',
      seccoes:[
        { t:'Os 3 tipos e o seu objeto (p. 11)', l:[
          ['Prático','<b>Saber-fazer.</b> O objeto é uma <b>aptidão ou capacidade</b>: o sujeito sabe realizar uma ação ou atividade. Ex.: saber fritar ovos.'],
          ['Por contacto','O sujeito conhece <b>diretamente</b> algo, através dos <b>sentidos externos</b> (visão, audição, tato…). O objeto são lugares, animais, plantas, pessoas, objetos físicos. Ex.: conhecer o Castelo dos Mouros. Também se chama conhecimento por <b>familiaridade</b>.'],
          ['Proposicional','<b>Saber-que.</b> O objeto são <b>proposições</b> (verdadeiras). Conhecer proposicionalmente é <b>conhecer ideias</b>. Ex.: saber o que é uma alucinação. Também se chama conhecimento factual.'],
          ['Na escola','A maior parte do que se aprende na escola (História, Biologia…) é conhecimento <b>proposicional</b>. É também o que a epistemologia mais estuda.'],
          ['Proposição','O pensamento expresso por uma <b>frase declarativa</b>, que pode ser verdadeiro ou falso. «Fecha a porta!» e «Que horas são?» não exprimem proposições. Escreve-se <b>proposicional</b>, não «proporcional».'] ]},
        { t:'A tabela da Alice (p. 10)', l:[
          ['Prático','A. Alice sabe <b>andar de bicicleta</b>. B. Alice sabe <b>fazer chá</b>. C. Alice <b>consegue assobiar</b> o hino nacional.'],
          ['Por contacto','D. Alice conhece o <b>Museu Nacional de Arte Antiga</b>. E. Alice conhece a <b>diretora da sua escola</b>. F. Alice conhece o <b>seu corpo</b>.'],
          ['Proposicional','G. Alice sabe que <b>Platão foi um filósofo grego</b>. H. Alice sabe que <b>um soneto tem catorze versos</b>. I. Alice <b>compreende a teoria da relatividade</b>.'],
          ['São Tomé (p. 10)','Qual é o tipo de conhecimento que nos permite saber <b>sem ter uma experiência direta</b>? O <b>proposicional</b>: posso saber que Platão foi um filósofo grego sem o ter conhecido. O por contacto exige contacto direto.'] ]},
        { t:'Exercício 1 da ficha: a Julieta (sai no teste)', l:[
          ['A','A Julieta sabe preparar batidos de frutas → <b>prático</b>'],
          ['B','Conhece de trás para a frente o sítio onde o Mondego nasce → <b>por contacto</b> (um lugar)'],
          ['C','Sabe qual é a diferença entre um romance e uma novela → <b>proposicional</b>'],
          ['D','Consegue fingir na perfeição que está a dormir → <b>prático</b>'],
          ['E','O filho dela já sabe comer de faca e garfo → <b>prático</b>'],
          ['F','Sabe o que é um neutrino → <b>proposicional</b>'],
          ['G','Conhece o primeiro namorado da sua mãe → <b>por contacto</b> (uma pessoa)'] ]}
      ],
      truque:'Pergunta: <b>qual é o objeto?</b> Uma <b>ação/capacidade</b> (sabe fazer, consegue, sabe comer, sabe preparar) → prático. Uma <b>pessoa, lugar ou coisa</b> conhecida diretamente pelos sentidos → por contacto. Uma <b>ideia/proposição</b> (sabe que…, sabe o que é…, compreende uma teoria) → proposicional. Cuidado: «sabe» nem sempre é proposicional!' },

    3: { ideia:'O cético desafia a nossa pretensão de saber. É um dos temas que saem no teste. (Manual, pp. 15–19; ficha, p. 13)',
      seccoes:[
        { t:'O problema da possibilidade (p. 15)', l:[
          ['Formulação','«<b>Será o conhecimento possível?</b>» «Saberemos o que julgamos saber?» (ou «Será que temos crenças justificadas?»)'],
          ['De onde vem','Quando temos crenças falsas, não nos apercebemos disso: vivemos na <b>ilusão</b> de que sabemos. E se isso estiver a acontecer agora, com crenças importantes?'],
          ['Exemplo do manual','Acreditamos que o <b>mundo exterior</b> é real e que as <b>outras pessoas</b> existem mesmo (não são sonhos ou alucinações). Mas como podemos <b>justificar</b> essa crença? Se não a conseguirmos justificar, <b>não é conhecimento, mesmo que seja verdadeira</b>.'],
          ['Alucinações','São erros percetivos: percecionamos objetos que nem existem. Para quem alucina, é igual a ver um oásis a sério.'] ]},
        { t:'O que é ser cético (p. 16; ficha p. 13)', l:[
          ['Ceticismo','Uma perspetiva que põe em causa se podemos conhecer. O <b>ceticismo radical</b> responde «não» para todo o conhecimento; o <b>moderado</b> duvida apenas de alguns domínios.'],
          ['No dia a dia','Cético = quem duvida («sou um pouco cético quanto ao sushi»). Isto <b>não</b> é ceticismo filosófico: para isso teria de achar que <b>não é de todo possível saber</b> se o sushi é saboroso.'],
          ['Em filosofia','O cético <b>põe em causa a possibilidade do conhecimento</b>: desafia a nossa pretensão de saber.'] ]},
        { t:'Radical e moderado (p. 16)', l:[
          ['Radical','É <b>global</b>: duvida da possibilidade de <b>todo e qualquer</b> conhecimento. Defende que não existe realmente conhecimento e que aquilo a que chamamos conhecimento <b>não passa de uma ilusão</b> (p. 17).'],
          ['Moderado','É <b>regional ou localizado</b>: duvida do conhecimento em <b>algumas áreas, mas não noutras</b>. Ex.: duvidar que haja conhecimento na <b>Ética e na Estética</b>, mas não na Física e na Matemática; ou sobre o livre-arbítrio, a moral, a existência de Deus, a religião.'],
          ['Pirrónico','Ao ceticismo radical também se chama <b>ceticismo pirrónico</b>, por causa de Pirro.'] ]},
        { t:'Pirro e outros céticos (p. 16; ficha p. 13)', l:[
          ['Pirro de Élis','(c. 360–270 a.C. no manual; c. 365–270 a.C. na ficha) O mais antigo e radical. Como <b>não podemos ter a certeza de nada</b>, não devemos afirmar que uma ideia é verdadeira nem que é falsa: devemos <b>suspender o juízo</b>.'],
          ['Suspender o juízo','É <b>suspender a crença</b>: <b>não acreditar nem deixar de acreditar</b> na ideia em causa. Para Pirro, isso liberta-nos dos desejos e traz a <b>paz de espírito</b> e a tranquilidade, para sermos felizes.'],
          ['Sexto Empírico','Pirro <b>não escreveu nenhum livro</b>. As suas ideias foram apresentadas por outros céticos, como Sexto Empírico (c. 160–210 d.C.), na obra <i>Hipóteses Pirrónicas</i>.'],
          ['Francisco Sanches','(c. 1551–1623) Filósofo cético, matemático e médico <b>português</b>, autor de <i>Que Nada se Sabe</i>.'] ]},
        { t:'O argumento do ceticismo radical (p. 17)', l:[
          ['Argumento','Se as nossas crenças não estão justificadas, então não temos conhecimento. As nossas crenças não estão justificadas. Logo, não temos conhecimento.'],
          ['Válido ou sólido?','É válido: se as premissas forem verdadeiras, a conclusão segue-se. É sólido quando, além de válido, tem premissas verdadeiras. O debate é se as premissas deste argumento são verdadeiras.'],
          ['A 2.ª premissa','«As nossas crenças não estão justificadas.» Os céticos pirrónicos defenderam-na com vários argumentos: a <b>regressão infinita da justificação</b> (Mundo 4) e os <b>enganos sensoriais</b>.'] ]},
        { t:'Os argumentos céticos (pp. 17–19)', l:[
          ['Enganos sensoriais','(Também chamado <b>ilusão dos sentidos</b>.) Por vezes os sentidos enganam-nos: um avião parece pequeno no céu, mas é enorme; com luz azul, objetos de outra cor parecem azuis; com a mão fria, a água morna parece quente; um lápis parece partido dentro de água; na ilusão de Müller-Lyer, figuras iguais parecem de tamanhos diferentes; uma miragem no deserto. Os céticos dizem: se os enganos existem, <b>pode suceder que sejamos sempre enganados</b>; então as justificações dos sentidos são <b>inadequadas e sem valor epistémico</b>.'],
          ['Regressão infinita','Cada crença precisa de outra para a justificar, e essa de outra, sem fim → nenhuma crença fica justificada → não há conhecimento. (Mundo 4)'],
          ['Extra — diversidade de opiniões','As pessoas discordam sobre alguns assuntos e pode ser difícil decidir quem tem razão. Este argumento vem dos apontamentos, não do esquema do manual. Estuda-o se foi abordado nas aulas.'],
          ['Atenção','As <b>crenças básicas autoevidentes</b> não são um argumento cético: são a resposta do fundacionalismo.'],
          ['Desafio cético','Como quase todos achamos que temos conhecimentos, o ceticismo lança um desafio: <b>como mostrar que temos realmente conhecimento e não uma ilusão de conhecimento?</b> (p. 18)'] ]},
        { t:'Objeção: o ceticismo radical é contraditório (p. 19; exercício 9)', l:[
          ['Autorrefutação','O cético radical diz que o conhecimento não é possível, mas assim <b>pretende ter um conhecimento</b>: o de que o conhecimento não é possível. Se a tese fosse verdadeira, nem ele a poderia conhecer.'],
          ['E mais (manual)','Para <b>pensar e dizer</b> que o conhecimento não é possível é preciso <b>conhecer várias coisas</b>: o significado das palavras usadas e algumas regras de gramática.'],
          ['Conclusão','Sendo contraditório, o ceticismo radical <b>autorrefuta-se</b>. Também: se nenhuma crença está justificada, as premissas do cético também não estão.'],
          ['Esquema (p. 19)','<b>Tese:</b> o conhecimento não é possível. <b>Argumentos:</b> dos enganos sensoriais e da regressão infinita da justificação. <b>Objeção:</b> é contraditório (autorrefutante).'] ]}
      ],
      truque:'Duvida de <b>tudo</b> → radical (global, pirrónico). Duvida só de <b>algumas áreas</b> → moderado (regional). Só desconfia de uma coisa do dia a dia → <b>não é</b> ceticismo filosófico.' },

    4: { ideia:'O principal argumento cético, passo a passo, e a resposta do fundacionalismo. (Manual, p. 17; fichas, pp. 13–15)',
      seccoes:[
        { t:'A ideia', l:[
          ['Os “porquês”','Como uma criança: «Come a sopa!» «Porquê?» «Porque te faz bem.» «Porquê?»… Podemos sempre pedir justificação. «Porque sim!» não justifica nada: só mostra que a pessoa desistiu.'],
          ['O diálogo do manual','«Não deves só decorar.» «Porquê?» «Porque esqueces.» «Como sabes?» «Aconteceu a muitas pessoas.» «Como sabes que te acontece a ti?» «Li num livro de Psicologia.» «Como sabes que não está errado?»… e a conversa podia continuar.'],
          ['Cadeia sem fim','A crença A é justificada com a B, a B com a C, a C com a D… Cada justificação é outra crença, que também precisa de justificação.'],
          ['Sexto Empírico','O que se apresenta como demonstração precisa também de ser demonstrado, até ao infinito; a consequência é a <b>suspensão do juízo</b>, porque não temos um ponto de partida para o raciocínio.'] ]},
        { t:'O argumento (decora a ordem)', l:[
          ['P1','As nossas crenças justificam-se com base noutras crenças.'],
          ['P2','Se as nossas crenças se justificam com base noutras crenças, então sempre que tentamos justificar uma crença caímos numa regressão infinita da justificação.'],
          ['P3','Se sempre que tentamos justificar uma crença caímos numa regressão infinita, então nunca temos crenças justificadas.'],
          ['P4','Se nunca temos crenças justificadas, não há conhecimento. (Liga-se à definição tradicional: sem justificação não há conhecimento.)'],
          ['C','Logo, não há conhecimento.'],
          ['Validade','Um argumento é válido quando, se as premissas forem verdadeiras, a conclusão também tem de ser verdadeira. Quem não aceita a conclusão tem de <b>rejeitar pelo menos uma premissa</b>.'],
          ['Solidez','Um argumento é sólido quando é válido <b>e</b> todas as suas premissas são verdadeiras. Os céticos defendem a conclusão; os fundacionalistas contestam uma premissa.'] ]},
        { t:'A resposta fundacionalista (ficha, p. 15)', l:[
          ['Fundacionalismo','Uma das mais célebres respostas ao ceticismo. Rejeita a <b>premissa 1</b>: nem todas as crenças se justificam com base noutras. Das premissas 1 a 4, <b>só a 1 é falsa</b>.'],
          ['Crenças básicas','(Ou fundacionais.) São <b>autoevidentes</b>: não precisam de ser justificadas por outras crenças, <b>justificam-se a si mesmas</b>.'],
          ['Não-básicas','Não são autoevidentes: são <b>inferidas</b> a partir de outras crenças.'],
          ['Metáfora','Como os <b>alicerces (fundações)</b> de um edifício: sustentam tudo sem serem sustentados. As crenças básicas são a base sólida das restantes. A cadeia termina nelas, logo <b>não há regressão infinita</b>.'],
          ['De onde vêm?','Racionalistas: as crenças básicas vêm da <b>razão</b> (a priori). Empiristas: vêm da <b>experiência</b> (a posteriori). (Mundo 5)'] ]}
      ],
      truque:'O fundacionalista só diz que a <b>premissa 1</b> é falsa. Se a pergunta for «que premissa rejeita?», a resposta é sempre a 1.' },

    5: { ideia:'De onde vem o conhecimento: da razão ou da experiência? E como distinguir a priori de a posteriori. (Manual, p. 14; fichas, pp. 15–18)',
      seccoes:[
        { t:'O problema da origem (sai no teste)', l:[
          ['Formulação','«<b>Qual é a origem do conhecimento? Provém da razão ou da experiência?</b>»'],
          ['Resposta-modelo','O problema da origem do conhecimento consiste em saber qual é a fonte do nosso conhecimento: se é a razão, independentemente da experiência, ou a experiência sensível.'] ]},
        { t:'Duas respostas', l:[
          ['Racionalismo','A principal fonte é a <b>razão</b>. As crenças básicas são conhecidas <b>a priori</b>. É possível conhecimento a priori sobre o mundo.'],
          ['Empirismo','A principal fonte é a <b>experiência sensível</b> (do grego <i>empeiria</i>, experiência). As crenças básicas são <b>a posteriori</b>. O a priori só diz respeito a relações entre ideias, não informa sobre o mundo.'],
          ['Ligação','O fundacionalismo diz que há crenças básicas; o problema da origem pergunta de onde vêm. Há fundacionalistas racionalistas e empiristas.'] ]},
        { t:'Duas modalidades de conhecimento proposicional (p. 14)', l:[
          ['Fontes','O conhecimento proposicional adquire-se de duas maneiras: pelo <b>pensamento</b> → a priori; pela <b>experiência</b> → a posteriori.'],
          ['A priori','Significa <b>anterior à experiência</b>. Pode saber-se <b>só pelo pensamento</b>, sem observar nada. Matemática, lógica, geometria. Ex.: «Um triângulo tem três lados», «O todo é maior do que a parte», «O dobro de 30 é metade de 120», «723 + 168 = 891», «Tudo o que é verde é colorido», «Duas coisas iguais a uma terceira são iguais entre si», «Nenhum solteiro é casado», «As esferas não têm arestas».'],
          ['A posteriori','Significa <b>posterior à experiência</b>. Só pode saber-se <b>pela experiência</b>, observando o mundo. Também se chama conhecimento <b>empírico</b> (de <i>empeiría</i>). Física, química, biologia, história, geografia. Ex.: «As avestruzes não voam», «A segunda maior cidade portuguesa é o Porto», «A Suíça é um país europeu», «Em Portugal o ensino secundário termina no 12.º ano», «As baleias são mamíferos», «Os ursos polares são brancos», «A água é H2O», «A Maria tem o cabelo castanho».'] ]},
        { t:'Armadilhas', l:[
          ['Calculadora','Saber 2 + 2 = 4 numa calculadora continua a ser <b>a priori</b>: <b>podia</b> saber-se só pelo pensamento. O a priori pode obter-se pelo pensamento, mas a experiência também permite essa aquisição.'],
          ['Conceitos','Na infância precisamos de experiência para aprender os conceitos (1, 2, 3, somar, «solteiro»…) e treinar o raciocínio. Depois descobrimos coisas novas só a pensar. Saber a priori <b>não é recordar experiências</b>: posso nunca ter somado 99 + 98 e saber que dá 197.'],
          ['Esfera','A definição de esfera é a priori; «A Terra é aproximadamente esférica» é a posteriori.'],
          ['Existência','«Os solteiros não são casados» é a priori, mas não diz se existe algum solteiro. «Se foi o Smith ou o Jones e não foi o Smith, foi o Jones» também não diz se houve assalto. Pode o a priori informar sobre o mundo? <b>Racionalistas: sim. Empiristas: não.</b>'] ]}
      ],
      truque:'Pergunta: «<b>o contrário podia ser verdade sem contradição?</b>» Sim (os ursos podiam ser castanhos) → a posteriori. Não (um solteiro casado é contraditório) → a priori.' }
  },

  /* Respostas escritas dentro dos mundos (como no teste: «Explica», «Justifica», «Distingue»).
     s = secção da lição depois da qual aparecem. O aluno escreve, compara com a resposta-modelo
     e marca os pontos que incluiu. Os modelos seguem os cartões de resposta aberta (manual e fichas). */
  escritas: [
    { id:'e1-1', m:1, s:4, pergunta:'O Carlos leu numa revista médica que o álcool em excesso provoca cirroses, mas pensou que era falso. Segundo a definição tradicional, o Carlos sabe que o álcool em excesso provoca cirroses? Justifica.',
      pontos:['Responde que o Carlos não tem conhecimento.','Explica que falta a crença: ele não acredita no que leu.','Refere que a crença, a verdade e a justificação são condições necessárias: basta faltar uma para não haver conhecimento.'],
      modelo:'Segundo a definição tradicional, conhecimento é crença verdadeira justificada, e cada uma destas três condições é necessária. No caso do Carlos, a proposição é verdadeira e ele até tinha uma boa justificação (uma revista médica), mas pensou que era falso, ou seja, não acredita nela. Falta a condição da crença e, como basta faltar uma condição para não haver conhecimento, o Carlos não sabe que o álcool em excesso provoca cirroses.' },
    { id:'e1-2', m:1, s:9, pergunta:'Explica porque é que a crença, a verdade e a justificação são, cada uma, condições necessárias do conhecimento.',
      pontos:['Crença: é contraditório dizer «sei que P, mas não acredito em P».','Verdade: não se pode saber o que é falso (o conhecimento é factivo).','Justificação: uma crença verdadeira por sorte (um palpite) não é conhecimento; são precisas boas razões.'],
      modelo:'A crença é necessária porque seria contraditório dizer «sei que o mar tem ondas, mas não acredito nisso». A verdade é necessária porque só se pode saber o que é verdadeiro: ninguém sabia que a Terra era plana, porque isso é falso. A justificação é necessária porque uma crença verdadeira obtida por acaso, como um palpite certeiro, não é conhecimento: são precisas boas razões que liguem a crença à verdade. Basta faltar uma destas condições para não haver conhecimento; as três juntas são suficientes.' },
    { id:'e2-1', m:2, s:0, pergunta:'Distingue os três tipos de conhecimento, indicando o objeto de cada um e dando um exemplo.',
      pontos:['Prático (saber-fazer): o objeto é uma aptidão ou capacidade (ex.: saber nadar).','Por contacto: conhecer diretamente, pelos sentidos, pessoas, lugares ou coisas (ex.: conhecer o Porto).','Proposicional (saber-que): o objeto são proposições verdadeiras (ex.: saber que Lisboa é a capital de Portugal).'],
      modelo:'O conhecimento prático, ou saber-fazer, tem como objeto uma aptidão ou capacidade: o sujeito sabe realizar uma ação, como nadar ou fritar ovos. O conhecimento por contacto consiste em conhecer diretamente, através dos sentidos, pessoas, lugares ou coisas, como conhecer o Porto ou o sabor da manga. O conhecimento proposicional, ou saber-que, tem como objeto proposições verdadeiras, como saber que Lisboa é a capital de Portugal; é o tipo mais estudado pela epistemologia.' },
    { id:'e2-2', m:2, s:2, pergunta:'«A Julieta sabe preparar batidos de frutas» e «A Julieta sabe o que é um neutrino» usam o verbo «saber». Indica o tipo de conhecimento de cada frase e justifica.',
      pontos:['A primeira é conhecimento prático: é saber-fazer (uma capacidade).','A segunda é conhecimento proposicional: é saber que algo é verdadeiro (uma ideia).','Conclui que o verbo «saber» não indica sempre conhecimento proposicional: é preciso ver o objeto do conhecimento.'],
      modelo:'«A Julieta sabe preparar batidos de frutas» é conhecimento prático, porque se trata de saber-fazer: o objeto é uma capacidade. «A Julieta sabe o que é um neutrino» é conhecimento proposicional, porque se trata de saber que certas proposições sobre os neutrinos são verdadeiras. Por isso, não basta olhar para o verbo «saber»: é preciso ver qual é o objeto do conhecimento.' },
    { id:'e3-1', m:3, s:3, pergunta:'Distingue ceticismo radical de ceticismo moderado e dá um exemplo de cada.',
      pontos:['Ceticismo radical (global, pirrónico): põe em causa todo e qualquer conhecimento.','Ceticismo moderado (regional): põe em causa só certos domínios, como a ética ou a religião.','Dá um exemplo correto de cada (ex.: Pirro de Élis; duvidar que haja conhecimento na ética, mas não na física).'],
      modelo:'O ceticismo radical, também chamado global ou pirrónico, põe em causa todo e qualquer conhecimento: Pirro de Élis, por exemplo, defendia que devemos suspender o juízo sobre tudo. O ceticismo moderado, ou regional, só põe em causa o conhecimento em certos domínios: por exemplo, quem duvida que haja conhecimento na Ética e na Estética, mas aceita o conhecimento da Física e da Matemática, ou quem diz que na religião não há conhecimento, só opiniões.' },
    { id:'e3-2', m:3, s:6, pergunta:'Muitas pessoas pensam que o ceticismo radical é contraditório. Porquê? (Exercício 9)',
      pontos:['Indica a tese do cético radical: não é possível conhecer nada.','Explica que, ao afirmá-la como verdadeira, o cético pretende saber pelo menos uma coisa.','Conclui que o ceticismo radical se refuta a si mesmo (é autorrefutante).'],
      modelo:'O cético radical defende que não é possível conhecer nada. Mas, ao afirmar isso, apresenta a sua tese como verdadeira, ou seja, pretende saber pelo menos uma coisa: que nada se pode saber. Se a tese fosse verdadeira, o próprio cético não a poderia conhecer. Além disso, se nenhuma crença está justificada, as premissas do cético também não estão. Por isso, o ceticismo radical refuta-se a si mesmo: é autorrefutante.' },
    { id:'e4-1', m:4, s:1, pergunta:'Apresenta o argumento cético da regressão infinita e explica porque é válido.',
      pontos:['Apresenta as premissas: as crenças justificam-se noutras; isso leva à regressão infinita; então nunca há crenças justificadas; sem justificação não há conhecimento.','Apresenta a conclusão: logo, não há conhecimento.','Explica a validade: se as premissas forem verdadeiras, a conclusão também é; quem a rejeita tem de rejeitar uma premissa.'],
      modelo:'1. As nossas crenças justificam-se com base noutras crenças. 2. Se as nossas crenças se justificam com base noutras crenças, então sempre que tentamos justificar uma crença caímos numa regressão infinita da justificação. 3. Se caímos sempre numa regressão infinita, então nunca temos crenças justificadas. 4. Se nunca temos crenças justificadas, não há conhecimento. 5. Logo, não há conhecimento. O argumento é válido: se as premissas forem verdadeiras, a conclusão também é. Por isso, quem não aceita a conclusão tem de rejeitar pelo menos uma premissa.' },
    { id:'e4-2', m:4, s:2, pergunta:'Explica como o fundacionalismo responde ao argumento cético da regressão infinita.',
      pontos:['Refere que o fundacionalismo rejeita a premissa 1.','Explica as crenças básicas: autoevidentes, justificam-se a si mesmas; as não-básicas são inferidas.','Conclui que a cadeia de justificação termina nas crenças básicas, logo não há regressão infinita.'],
      modelo:'Como o argumento é válido, para recusar a conclusão é preciso rejeitar uma premissa. O fundacionalismo rejeita a premissa 1: nem todas as crenças se justificam com base noutras. Há crenças básicas, autoevidentes, que se justificam a si mesmas, e crenças não-básicas, que são inferidas a partir delas. Tal como as fundações sustentam um edifício sem precisarem de ser sustentadas, a cadeia de justificação termina nas crenças básicas. Assim, não há regressão infinita e o conhecimento é possível.' },
    { id:'e5-1', m:5, s:1, pergunta:'Identifica o problema da origem do conhecimento e as duas respostas estudadas.',
      pontos:['Formula o problema: qual é a fonte do conhecimento, a razão ou a experiência?','Racionalismo: a principal fonte é a razão.','Empirismo: a principal fonte é a experiência sensível.'],
      modelo:'O problema da origem do conhecimento consiste em saber qual é a fonte do nosso conhecimento: se é a razão, independentemente da experiência, ou a experiência sensível. Formula-se assim: «O conhecimento provém da razão ou da experiência?». Os racionalistas respondem que a principal fonte do conhecimento é a razão; os empiristas respondem que é a experiência sensível.' },
    { id:'e5-2', m:5, s:2, pergunta:'Distingue conhecimento a priori de conhecimento a posteriori, dando um exemplo de cada.',
      pontos:['A priori: pode conhecer-se independentemente da experiência, só pelo pensamento.','A posteriori: só pode conhecer-se através da experiência (conhecimento empírico).','Dá um exemplo correto de cada (ex.: «Nenhum solteiro é casado»; «Os ursos polares são brancos»).'],
      modelo:'O conhecimento a priori é o que pode ser conhecido independentemente da experiência, apenas pelo pensamento, como na matemática e na lógica: por exemplo, «Nenhum solteiro é casado». O conhecimento a posteriori, ou empírico, é o que só pode ser conhecido através da experiência, observando o mundo, como na física ou na história: por exemplo, «Os ursos polares são brancos», que só sabemos porque os observámos.' }
  ],

  perguntas: [
    /* ---------- Mundo 1 · O que é conhecer ---------- */
    { id:'m1-01', m:1, s:0, t:'mc', q:'A epistemologia estuda:', o:['o conhecimento','o bem e o mal','a arte','a existência de Deus'], e:'A epistemologia (ou teoria do conhecimento) é a área da filosofia que estuda o conhecimento.' },
    { id:'m1-02', m:1, s:0, t:'mc', q:'A palavra “epistemologia” vem do grego “epistéme” e “logos”, que significam:', o:['conhecimento e estudo','crença verdadeira e argumento','dúvida e razão','ciência e natureza humana'], e:'Epistéme = conhecimento; logos = estudo. Epistemologia = estudo do conhecimento.' },
    { id:'m1-03', m:1, s:6, t:'mc', q:'Conhecimento é, segundo a definição tradicional:', o:['crença verdadeira justificada','crença justificada, mesmo que falsa','crença verdadeira, mesmo sem razões','opinião certa e partilhada'], e:'Definição tradicional (Platão, Teeteto): conhecimento = crença verdadeira justificada.' },
    { id:'m1-04', m:1, s:1, t:'mc', q:'“O que é conhecer?” formula o problema da:', o:['definição do conhecimento','possibilidade do conhecimento','origem do conhecimento','validade'], e:'O problema da definição pergunta o que é conhecer, ou seja, quais são as condições necessárias e suficientes para saber.' },
    { id:'m1-05', m:1, s:1, t:'mc', q:'“Será possível conhecer alguma coisa?” formula o problema da:', o:['possibilidade','definição','origem','fundamentação'], e:'O problema da possibilidade pergunta se é possível conhecer, ou se temos crenças justificadas.' },
    { id:'m1-06', m:1, s:1, t:'mc', q:'“O conhecimento provém da razão ou da experiência?” formula o problema da:', o:['origem','definição','possibilidade','justificação moral'], e:'O problema da origem pergunta qual é a fonte do conhecimento: a razão ou a experiência.' },
    { id:'m1-07', m:1, s:3, t:'mc', q:'Uma condição necessária para o conhecimento é aquela que:', o:['se faltar, não há conhecimento','se estiver presente, garante que há conhecimento','é opcional','só existe na matemática'], e:'Necessária = obrigatória: «sem isto, não». Ex.: sem crença não há conhecimento.' },
    { id:'m1-08', m:1, s:3, t:'mc', q:'Uma condição suficiente para o conhecimento é aquela que:', o:['se estiver presente, há conhecimento de certeza','se faltar, nunca há conhecimento, mas sozinha pode não chegar','torna a crença verdadeira, mesmo sem justificação','só serve para as crenças básicas autoevidentes'], e:'Suficiente = chega sozinha: «com isto, sim, de certeza». Ex.: crença + verdade + justificação, juntas.' },
    { id:'m1-09', m:1, s:4, t:'mc', q:'O João acredita que vai chover amanhã só porque lhe apetece. No dia seguinte chove. Segundo a definição tradicional, o João:', o:['não sabia, porque a crença não estava justificada','sabia, porque a crença era verdadeira e ele acreditava','sabia, porque acreditava nisso com muita força','não sabia, porque a crença acabou por ser falsa no dia seguinte'], e:'É uma crença verdadeira mas não justificada. Acertar por sorte ou palpite não é saber.' },
    { id:'m1-10', m:1, s:6, t:'mc', q:'A definição tradicional de conhecimento tem origem em:', o:['Platão, no diálogo Teeteto','Pirro de Élis, nas Hipóteses Pirrónicas','Francisco Sanches, em Que Nada se Sabe','Sexto Empírico'], e:'A definição de conhecimento como crença verdadeira justificada remonta a Platão, no Teeteto.' },
    { id:'m1-11', m:1, s:6, t:'mc', q:'Segundo a definição tradicional, S sabe que P se e só se:', o:['S acredita que P, P é verdadeira e S tem justificação para acreditar que P','S acredita que P e P é verdadeira, mesmo sem justificação','P é verdadeira e S tem justificação, mesmo que S não acredite em P','S acredita que P e tem justificação, mesmo que P seja falsa'], e:'As três condições: crença, verdade e justificação. Cada uma é necessária; juntas seriam suficientes.' },
    { id:'m1-12', m:1, s:4, t:'vf', q:'Uma crença verdadeira obtida por palpite é conhecimento.', a:false, e:'Falta a justificação. Acertar por sorte ou palpite não é saber.' },
    { id:'m1-13', m:1, s:8, t:'vf', q:'Não se pode saber aquilo que é falso.', a:true, e:'A verdade é condição necessária: não se sabe o que é falso.' },
    { id:'m1-14', m:1, s:7, t:'vf', q:'Pode-se saber algo em que não se acredita.', a:false, e:'A crença é condição necessária: não se sabe aquilo em que não se acredita.' },
    { id:'m1-15', m:1, s:3, t:'vf', q:'Na definição tradicional, cada condição é necessária e, juntas, as três seriam suficientes.', a:true, e:'Crença + verdade + justificação: cada uma é necessária; juntas seriam suficientes.' },
    { id:'m1-16', m:1, s:6, t:'completa', q:'Segundo a definição tradicional, conhecimento é crença verdadeira ___.', o:['justificada','provável','partilhada','inquestionável'], e:'Conhecimento = crença verdadeira justificada (CVJ).' },
    { id:'m1-17', m:1, s:3, t:'completa', q:'O problema da ___ pergunta quais são as condições necessárias e suficientes para que alguém saiba que algo é o caso.', o:['definição','possibilidade','origem','validade'], e:'É a formulação rigorosa do problema da definição do conhecimento.' },
    { id:'m1-18', m:1, s:0, t:'completa', q:'A epistemologia também se chama teoria do ___.', o:['conhecimento','ser','valor','pensamento lógico'], e:'Epistemologia = teoria do conhecimento.' },
    { id:'m1-19', m:1, s:7, t:'mc', destaque:true, q:'Qual é a relação entre crença e conhecimento?', o:['Todo o conhecimento é uma crença, mas nem todas as crenças são conhecimento.','Todas as crenças são conhecimento, mas nem todo o conhecimento é uma crença.','As crenças são sempre falsas e o conhecimento é sempre verdadeiro.','Não podemos acreditar em nada que ainda não conheçamos.'], e:'Para saber é preciso acreditar, mas uma crença só é conhecimento se também for verdadeira e justificada.' },
    { id:'m1-20', m:1, s:7, t:'mc', destaque:true, q:'Porque é que a crença é condição necessária do conhecimento?', o:['Porque é contraditório dizer “sei que o mar tem ondas, mas não acredito nisso”.','Porque todas as crenças são verdadeiras e, por isso, são conhecimento.','Porque basta acreditar com força numa coisa para passar a saber que é verdade.','Porque as crenças não precisam de justificação para serem conhecimento.'], e:'Não se sabe aquilo em que não se acredita: afirmar que se sabe e não se acredita é contraditório.' },
    { id:'m1-21', m:1, s:7, t:'mc', destaque:true, q:'“Acredito em extraterrestres.” Este exemplo mostra que:', o:['a crença, sozinha, não basta para haver conhecimento','acreditar com convicção é o mesmo que saber','a crença não é uma condição necessária para saber','os extraterrestres existem, porque há quem acredite'], e:'Acreditar que existem extraterrestres não é saber que existem. A crença é necessária, mas não é suficiente.' },
    { id:'m1-22', m:1, s:8, t:'mc', destaque:true, q:'Dizer que o conhecimento é factivo significa que:', o:['só se sabe o que é verdadeiro','o conhecimento é sempre sobre o passado','basta acreditar para saber','também se pode saber o que é falso'], e:'A verdade é condição necessária: não se sabe o que é falso.' },
    { id:'m1-23', m:1, s:9, t:'mc', destaque:true, q:'Na Antiguidade havia razões para acreditar que a Terra era plana. Este exemplo mostra que:', o:['a justificação, sozinha, não basta: podemos ter boas razões para acreditar em algo falso','os antigos sabiam que a Terra era plana, porque tinham boas razões para isso','a verdade não é necessária para saber, desde que haja boas razões','a justificação não é necessária para saber, basta que muita gente acredite'], e:'Tinham razões, mas a crença era falsa, logo não era conhecimento. A justificação não é suficiente sozinha.' },
    { id:'m1-24', m:1, s:9, t:'mc', destaque:true, q:'Porque é que uma crença verdadeira não basta para haver conhecimento?', o:['Porque pode ser verdadeira por acaso, como um palpite, sem boas razões.','Porque as crenças verdadeiras são raras e difíceis de encontrar.','Porque a verdade não interessa para o conhecimento, só a crença.','Porque só os cientistas podem ter conhecimento verdadeiro.'], e:'O conhecimento tem de estar apoiado em boas razões (justificação), e não na sorte.' },
    { id:'m1-25', m:1, s:7, t:'mc', destaque:true, q:'O Eurico diz que a calculadora “sabe” que 356 € a dividir por 4 dá 89 €. Segundo a definição tradicional:', o:['a calculadora não sabe, porque não tem crenças (estados mentais)','a calculadora sabe, porque o resultado que mostra é verdadeiro','a calculadora sabe, porque está justificada pela sua programação','a calculadora sabe, porque nunca se engana nas contas'], e:'Saber implica ter uma crença, que é um estado mental. A calculadora só dá o resultado certo porque foi programada.' },
    { id:'m1-26', m:1, s:7, t:'vf', destaque:true, q:'Todo o conhecimento é uma crença, mas nem todas as crenças são conhecimento.', a:true, e:'A crença é necessária para saber, mas falta-lhe ser verdadeira e justificada.' },
    { id:'m1-27', m:1, s:9, t:'vf', destaque:true, q:'Ter boas razões para acreditar em algo garante que sabemos.', a:false, e:'Podemos ter boas razões para acreditar em algo falso, como os antigos que acreditavam que a Terra era plana.' },
    { id:'m1-28', m:1, s:7, t:'vf', destaque:true, q:'Uma calculadora sabe que 356 a dividir por 4 dá 89.', a:false, e:'Não tem estados mentais nem crenças, logo não tem conhecimento.' },
    { id:'m1-29', m:1, s:7, t:'vf', destaque:true, q:'É contraditório dizer “sei que o mar tem ondas, mas não acredito nisso”.', a:true, e:'É por isso que a crença é condição necessária do conhecimento.' },
    { id:'m1-30', m:1, s:8, t:'completa', destaque:true, q:'O conhecimento é ___: só se sabe o que é verdadeiro.', o:['factivo','provável','subjetivo','prático'], e:'Factivo: se S sabe que P, então P é verdadeira.' },
    // Treino extra do manual: tem ou não conhecimento?
    { id:'m1-31', m:1, s:4, t:'mc', destaque:true, q:'A Luísa acredita, devido a estudos científicos que leu, que o albinismo tem causa genética. Segundo a definição tradicional, a Luísa:', o:['tem conhecimento: é uma crença verdadeira e justificada','não tem conhecimento: falta a crença, só leu estudos','não tem conhecimento: a crença não está bem justificada','não tem conhecimento: a crença é falsa'], e:'Tem as três condições: acredita, é verdade e tem boas razões (os estudos científicos).' },
    { id:'m1-32', m:1, s:4, t:'mc', destaque:true, q:'A Teresa acredita que a Terra é maior do que a Lua porque ouviu dizer que o tamanho dos nomes exprime o tamanho das coisas. Segundo a definição tradicional, a Teresa:', o:['não tem conhecimento: a crença é verdadeira, mas mal justificada','não tem conhecimento: a crença é falsa, a Lua é maior','não tem conhecimento: falta a crença, ela só ouviu dizer','tem conhecimento: a crença é verdadeira e ouviu dizer'], e:'A Terra é mesmo maior do que a Lua, mas a razão da Teresa não justifica nada. Sem boa justificação não há conhecimento.' },
    { id:'m1-33', m:1, s:4, t:'mc', destaque:true, q:'O Carlos leu numa revista médica que o álcool em excesso provoca cirroses, mas pensou que era falso. Segundo a definição tradicional, o Carlos:', o:['não tem conhecimento: falta a crença','tem conhecimento: leu numa revista médica','não tem conhecimento: a afirmação é falsa','tem conhecimento: a afirmação é verdadeira'], e:'É verdade e havia justificação, mas o Carlos não acredita. Não se sabe aquilo em que não se acredita.' },
    { id:'m1-34', m:1, s:4, t:'vf', destaque:true, q:'A Teresa sabe que a Terra é maior do que a Lua, porque a sua crença é verdadeira.', a:false, e:'É uma crença verdadeira, mas mal justificada (o tamanho dos nomes não diz nada sobre o tamanho das coisas).' },
    { id:'m1-35', m:1, s:4, t:'vf', destaque:true, q:'O Carlos não tem conhecimento de que o álcool em excesso provoca cirroses, porque não acredita no que leu.', a:true, e:'Falta a condição da crença.' },

    // Condição necessária e suficiente, com exemplos do dia a dia
    { id:'m1-53', m:1, s:3, t:'mc', q:'Ser um animal é, para ser um cão, uma condição:', o:['necessária, mas não suficiente','suficiente, mas não necessária','necessária e suficiente','nem necessária nem suficiente'], e:'Um cão é sempre animal (necessária), mas ser animal não chega: um gato também é animal (não é suficiente).' },
    { id:'m1-54', m:1, s:3, t:'mc', q:'Ser um cão é, para ser um animal, uma condição:', o:['suficiente, mas não necessária','necessária, mas não suficiente','necessária e suficiente','nem necessária nem suficiente'], e:'Se é cão, é de certeza animal (suficiente). Mas há animais que não são cães (não é necessária).' },
    { id:'m1-55', m:1, s:3, t:'mc', q:'Na definição tradicional, a crença, sozinha, é uma condição:', o:['necessária, mas não suficiente','suficiente, mas não necessária','necessária e suficiente','nem necessária nem suficiente'], e:'Sem crença não há conhecimento (necessária), mas só acreditar não chega: também tem de ser verdade e estar justificado.' },
    { id:'m1-56', m:1, s:3, t:'mc', q:'Na definição tradicional, a crença, a verdade e a justificação, as três juntas, são:', o:['uma condição suficiente para haver conhecimento','uma condição que não chega para haver conhecimento','opcionais','apenas uma opinião'], e:'Juntas chegam: se alguém acredita, é verdade e tem boas razões, então sabe.' },
    { id:'m1-57', m:1, s:3, t:'vf', q:'Na definição tradicional, a verdade, sozinha, é suficiente para haver conhecimento.', a:false, e:'É necessária (não se sabe o que é falso), mas não chega: um palpite pode ser verdadeiro e não é conhecimento.' },
    { id:'m1-58', m:1, s:3, t:'vf', q:'Uma condição necessária é obrigatória, mas sozinha pode não chegar.', a:true, e:'Necessária = «sem isto, não». Suficiente = «com isto, sim, de certeza».' },
    { id:'m1-59', m:1, s:3, t:'mc', q:'Para entrar num concerto é preciso bilhete, documento de identificação e ter mais de 16 anos. O bilhete, sozinho, é uma condição:', o:['necessária, mas não suficiente','suficiente, mas não necessária','necessária e suficiente','nem necessária nem suficiente'], e:'Sem bilhete não entras (necessária), mas só o bilhete não chega (não é suficiente).' },
    { id:'m1-60', m:1, s:3, t:'vf', q:'Na definição tradicional, a crença, a verdade e a justificação são condições necessárias e conjuntamente suficientes.', a:true, e:'Cada uma é necessária; as três juntas (conjuntamente) são suficientes.' },
    { id:'m1-61', m:1, s:3, t:'mc', q:'«Condições conjuntamente suficientes» quer dizer que:', o:['as condições, todas juntas, chegam para haver conhecimento','cada condição, sozinha, chega para haver conhecimento','basta ter uma das condições para haver conhecimento','as condições juntas não chegam: é sempre preciso uma quarta'], e:'Conjuntamente = as três juntas. Crença + verdade + justificação = conhecimento.' },
    // Manual, pp. 8–13
    { id:'m1-36', m:1, s:2, t:'mc', q:'Quais são os dois elementos comuns a todos os casos de conhecimento?', o:['o sujeito e o objeto','a crença e a dúvida','a razão e a experiência','a verdade e a opinião'], e:'O sujeito é quem conhece e o objeto é aquilo que é conhecido (manual, p. 9).' },
    { id:'m1-37', m:1, s:2, t:'mc', q:'No conhecimento, o sujeito é:', o:['quem conhece','aquilo que é conhecido','a justificação da crença','a proposição verdadeira'], e:'Sujeito = quem conhece; objeto = aquilo que é conhecido.' },
    { id:'m1-38', m:1, s:2, t:'mc', q:'Segundo o manual, o conhecimento é:', o:['uma relação entre um sujeito e um objeto','uma opinião muito firme sobre um assunto','uma crença qualquer, verdadeira ou falsa','aquilo em que a maioria das pessoas acredita'], e:'Há sempre quem conhece (sujeito) e aquilo que é conhecido (objeto).' },
    { id:'m1-39', m:1, s:2, t:'vf', q:'No autoconhecimento, o sujeito e o objeto do conhecimento coincidem.', a:true, e:'Quando alguém se tenta conhecer a si próprio, é ao mesmo tempo quem conhece e aquilo que é conhecido.' },
    { id:'m1-40', m:1, s:2, t:'vf', q:'Segundo o manual, «conhecer» e «saber» têm um significado semelhante.', a:true, e:'É o que diz o manual na p. 9.' },
    { id:'m1-41', m:1, s:6, t:'mc', q:'Porque se diz que a definição tradicional de conhecimento é «tripartida»?', o:['Porque indica três condições necessárias: crença, verdade e justificação.','Porque há três tipos de conhecimento: prático, por contacto e proposicional.','Porque responde aos três problemas: definição, possibilidade e origem.','Porque foi escrita por três filósofos gregos diferentes.'], e:'Tripartida = em três partes: crença, verdade e justificação.' },
    { id:'m1-42', m:1, s:7, t:'mc', q:'Um homem diz: «Eu não acredito que o homem tenha ido à Lua.» Porque é que não sabe que os seres humanos foram à Lua?', o:['Porque lhe falta a crença.','Porque a afirmação é falsa.','Porque não há justificação nenhuma.','Porque é conhecimento por contacto.'], e:'É verdade e há provas, mas ele não acredita. Sem crença não há conhecimento.' },
    { id:'m1-43', m:1, s:7, t:'mc', q:'Ter uma crença é:', o:['acreditar numa proposição, considerá-la verdadeira (um estado mental de adesão a uma ideia)','ter a certeza absoluta de algo, sem qualquer possibilidade de dúvida','saber algo verdadeiro e ter boas razões para isso','ter uma opinião religiosa ou política, que não pode ser verdadeira nem falsa'], e:'As crenças podem ter graus de convicção variados: do «provavelmente verdadeiro» à certeza firme.' },
    { id:'m1-44', m:1, s:7, t:'vf', q:'Uma crença tem sempre de ser uma certeza absoluta.', a:false, e:'As crenças podem ter graus de convicção muito variados.' },
    { id:'m1-45', m:1, s:8, t:'vf', q:'A expressão «conhecimento verdadeiro» é redundante.', a:true, e:'Não há conhecimento falso: se é conhecimento, é verdadeiro.' },
    { id:'m1-46', m:1, s:8, t:'vf', q:'Podemos saber que uma proposição é falsa, mas não podemos conhecer uma proposição falsa.', a:true, e:'Ex.: posso saber que é falso que os pardais falam, mas não posso saber que os pardais falam.' },
    { id:'m1-47', m:1, s:8, t:'mc', q:'Porque é que não se diz que Aristóteles «sabia» que o coração era o órgão do pensamento, mas sim que «acreditava» nisso?', o:['Porque a crença era falsa, e não se conhece o que é falso.','Porque Aristóteles não acreditava nisso, só o defendia.','Porque Aristóteles não tinha nenhuma razão para pensar assim.','Porque esse conhecimento era a priori e não a posteriori.'], e:'A verdade é condição necessária: quando a crença é falsa dizemos «julgava», «pensava» ou «acreditava».' },
    { id:'m1-48', m:1, s:9, t:'mc', q:'Qual destas é uma boa justificação para acreditar que D. Pedro V defendeu a abolição da escravatura?', o:['Ler isso num manual de História.','Gostar muito do nome do rei.','Ter sonhado com isso uma noite.','Ter lido isso num romance de ficção.'], e:'Uma justificação adequada são boas razões que ligam a crença à verdade (manual, p. 13).' },
    { id:'m1-49', m:1, s:9, t:'mc', q:'Qual destas justifica a crença de que está vento lá fora?', o:['Ouvir o vento.','Ter sonhado com vento ontem.','Ler a descrição de uma ventania num romance.','Gostar de dias de vento.'], e:'Ouvir o vento é uma boa razão; sonhos e romances não justificam.' },
    { id:'m1-50', m:1, s:6, t:'mc', q:'Os autores do manual sabem que os Países Baixos são uma monarquia porque:', o:['acreditam nisso, é verdade e leram-no em livros fidedignos e falaram com quem lá vive','é uma opinião comum, partilhada pela maioria das pessoas na Europa','ouviram um palpite de um amigo e, por acaso, acertaram na resposta','acreditam nisso e é verdade, embora não tenham razões para acreditar'], e:'É o exemplo do manual das três condições: crença, verdade e justificação.' },
    { id:'m1-51', m:1, s:9, t:'mc', q:'A justificação adequada consiste em:', o:['boas razões para acreditar que a proposição é verdadeira, para que a convicção não se deva ao acaso','acreditar com muita força numa proposição, sem nunca duvidar dela','a maioria das pessoas concordar com a proposição, mesmo sem razões','a proposição ser útil para a vida, quer seja verdadeira quer seja falsa, desde que se acredite nela'], e:'As boas razões ligam a crença à verdade da proposição.' },
    { id:'m1-52', m:1, s:0, t:'completa', q:'A epistemologia também se chama filosofia do ___ ou teoria do conhecimento.', o:['conhecimento','ser','valor','pensamento lógico'], e:'Filosofia do conhecimento = teoria do conhecimento = epistemologia.' },
    /* ---------- Mundo 2 · Tipos de conhecimento (sai no teste) ---------- */
    { id:'m2-01', m:2, s:0, t:'mc', q:'“Sei andar de bicicleta” é conhecimento:', o:['prático','proposicional','por contacto','nenhum dos três tipos'], e:'É saber-fazer: uma competência. Conhecimento prático.' },
    { id:'m2-02', m:2, s:0, t:'mc', q:'“Conheço o Porto” é conhecimento:', o:['por contacto','proposicional','prático','nenhum dos três tipos'], e:'Conhecer diretamente um lugar é conhecimento por contacto (familiaridade).' },
    { id:'m2-03', m:2, s:0, t:'mc', q:'“Sei que a água ferve a 100 °C” é conhecimento:', o:['proposicional','prático','por contacto','nenhum dos três tipos'], e:'“Sei que…” + proposição: conhecimento proposicional (saber-que).' },
    { id:'m2-04', m:2, s:0, t:'mc', q:'“Conheço o sabor da manga” é conhecimento:', o:['por contacto','proposicional','prático','nenhum dos três tipos'], e:'Conhecer diretamente um sabor é conhecimento por contacto.' },
    { id:'m2-05', m:2, s:0, t:'mc', q:'“Sei tocar guitarra” é conhecimento:', o:['prático','proposicional','por contacto','nenhum dos três tipos'], e:'Tocar guitarra é uma competência: saber-fazer.' },
    { id:'m2-06', m:2, s:0, t:'mc', q:'“Sei que Lisboa é a capital de Portugal” é conhecimento:', o:['proposicional','prático','por contacto','nenhum dos três tipos'], e:'Saber que uma proposição é verdadeira: conhecimento proposicional ou factual.' },
    { id:'m2-07', m:2, s:0, t:'mc', q:'“Conheço a Maria” é conhecimento:', o:['por contacto','proposicional','prático','nenhum dos três tipos'], e:'Conhecer diretamente uma pessoa é conhecimento por contacto.' },
    { id:'m2-08', m:2, s:0, t:'mc', q:'O conhecimento proposicional também se chama:', o:['saber-que ou conhecimento factual','saber-fazer ou conhecimento prático','familiaridade ou conhecimento direto','competência ou aptidão'], e:'Proposicional = saber-que = conhecimento factual.' },
    { id:'m2-09', m:2, s:0, t:'mc', q:'O conhecimento prático consiste em:', o:['ter uma competência (saber fazer algo)','saber que uma proposição é verdadeira','conhecer diretamente pessoas ou lugares','conhecer algo só pelo pensamento'], e:'Prático = saber-fazer: nadar, andar de bicicleta, tocar guitarra.' },
    { id:'m2-10', m:2, s:0, t:'mc', q:'O conhecimento por contacto consiste em:', o:['conhecer diretamente pessoas, lugares ou coisas','ter uma competência ou aptidão para fazer algo','saber que uma frase declarativa é verdadeira','deduzir conclusões a partir de outras crenças'], e:'Por contacto = familiaridade direta: o Porto, a Maria, o sabor da manga.' },
    { id:'m2-11', m:2, s:0, t:'mc', q:'Que tipo de conhecimento é o mais estudado pela epistemologia?', o:['proposicional','prático','por contacto','nenhum dos três tipos'], e:'A epistemologia estuda sobretudo o conhecimento proposicional (saber-que).' },
